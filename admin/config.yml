local_backend: false
locale: zh_Hans

backend:
  name: github
  repo: Apprentice185/yinzaosuo
  branch: main
  base_url: https://decap-oauth.xiaotanqingqing.workers.dev
  auth_endpoint: auth

media_folder: "pic"
public_folder: "/pic"
site_url: "https://yinzaosuo.com"
display_url: "https://yinzaosuo.com"

# Content is split per language (redesign phase 1, 2026-11-16):
# the overseas site reads content/en only, the domestic site content/zh
# only. No shared entries, no publish_to, no translation field pairs.
collections:
  # ================= 海外版（English, yinzaosuo.com） =================
  - name: "en_products"
    label: "海外版 · Products"
    folder: "content/en/products"
    summary: "{{title}} · {{category}} · 顺序 {{sort_order}}"
    sortable_fields:
      - { field: sort_order, label: "后台排序", default_sort: asc }
      - title
    create: true
    format: "json"
    extension: "json"
    identifier_field: "id"
    slug: "{{id}}"
    fields:
      - { label: "Product ID (system identifier)", name: "id", widget: "string" }
      - { label: "Hide this product", name: "hidden", widget: "boolean", default: false }
      - { label: "Sort order (smaller first)", name: "sort_order", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "Show in product archive", name: "show_in_archive", widget: "boolean", default: true }
      - { label: "Category key (e.g. wideformat)", name: "category", widget: "string", required: false }
      - { label: "Category title", name: "category_title", widget: "string", required: false }
      - { label: "Category description", name: "category_desc", widget: "text", required: false }
      - { label: "Category number", name: "category_num", widget: "string", required: false }
      - { label: "Category label shown on the detail page", name: "category_label", widget: "string", required: false }
      - { label: "List title", name: "title", widget: "string" }
      - { label: "List image", name: "image", widget: "image", required: false }
      - { label: "List summary", name: "desc", widget: "text", required: false }
      - { label: "Intro (fallback summary)", name: "intro", widget: "text", required: false }
      - { label: "Material tags", name: "materials", widget: "list", required: false }
      - { label: "Finishing tags", name: "crafts", widget: "list", required: false }
      - { label: "List SEO title", name: "seo_title", widget: "string", required: false }
      - { label: "List SEO description", name: "seo_description", widget: "text", required: false }
      - { label: "Detail page name (H1)", name: "name", widget: "string", required: false }
      - { label: "Detail page main image", name: "detail_image", widget: "image", required: false }
      - { label: "Detail intro", name: "detail_desc", widget: "text", required: false }
      - { label: "Detail SEO title", name: "detail_seo_title", widget: "string", required: false }
      - { label: "Detail SEO description", name: "detail_seo_description", widget: "text", required: false }
      - { label: "List image credit", name: "image_credit", widget: "string", required: false }
      - { label: "Detail image credit", name: "detail_image_credit", widget: "string", required: false }
      - label: "Product details"
        name: "detail"
        widget: "object"
        required: false
        fields:
          - { label: "Lead paragraph", name: "lead", widget: "text", required: false }
          - { label: "Production & customisation capability", name: "highlights", widget: "list", required: false }
          - { label: "Applications", name: "applications", widget: "list", required: false }
          - { label: "Finishing options", name: "finishing", widget: "list", required: false }
          - { label: "Packing & delivery", name: "delivery", widget: "list", required: false }
          - { label: "Artwork requirements", name: "artwork", widget: "text", required: false }
          - { label: "What to include in an enquiry", name: "brief", widget: "text", required: false }
          - { label: "Specification notes", name: "caveat", widget: "text", required: false }

  - name: "en_solutions"
    label: "海外版 · Solutions"
    folder: "content/en/solutions"
    summary: "{{title}} · {{category}} · {{date}}"
    sortable_fields:
      - { field: sort_order, label: "后台排序", default_sort: asc }
      - { field: date, label: "发布日期" }
      - title
    create: true
    format: "yaml-frontmatter"
    extension: "md"
    identifier_field: "slug"
    slug: "{{slug}}"
    fields:
      - { label: "Content ID", name: "id", widget: "string" }
      - { label: "Sort order (smaller first)", name: "sort_order", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "Hide this entry", name: "hidden", widget: "boolean", default: false }
      - { label: "URL slug (lowercase, digits, hyphens)", name: "slug", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Scenario tag / category", name: "category", widget: "string" }
      - { label: "Cover image", name: "cover", widget: "image", required: false }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "SEO title (optional)", name: "seo_title", widget: "string", required: false }
      - { label: "SEO description (optional)", name: "seo_description", widget: "text", required: false }
      - { label: "Publish date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Photo gallery", name: "gallery", widget: "list", required: false, fields: [{ label: "Image", name: "image", widget: "image" }] }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "en_knowledge"
    label: "海外版 · Knowledge"
    folder: "content/en/knowledge"
    summary: "{{title}} · {{category}} · {{date}}"
    sortable_fields:
      - { field: sort_order, label: "后台排序", default_sort: asc }
      - { field: date, label: "发布日期" }
      - title
    create: true
    format: "yaml-frontmatter"
    extension: "md"
    identifier_field: "slug"
    slug: "{{slug}}"
    fields:
      - { label: "Content ID", name: "id", widget: "string" }
      - { label: "Sort order (smaller first)", name: "sort_order", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "Hide this entry", name: "hidden", widget: "boolean", default: false }
      - { label: "URL slug (lowercase, digits, hyphens)", name: "slug", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Cover image", name: "cover", widget: "image", required: false }
      - { label: "Summary (defaults to SEO description)", name: "summary", widget: "text" }
      - { label: "SEO title (optional)", name: "seo_title", widget: "string", required: false }
      - { label: "SEO description (optional)", name: "seo_description", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "en_home"
    label: "海外版 · 首页"
    files:
      - name: "en_home_page"
        label: "Homepage content & banners"
        file: "content/en/settings/home.json"
        fields:
          - label: "Banner carousel images (3–5)"
            name: "hero_slides"
            widget: "list"
            min: 3
            max: 5
            summary: "{{fields.image}}"
            fields:
              - { label: "Banner image", name: "image", widget: "image" }
          - { label: "Hero eyebrow", name: "eyebrow_en", widget: "string", required: false }
          - { label: "Hero title", name: "hero_title_en", widget: "string", required: false }
          - { label: "Hero description", name: "hero_description_en", widget: "text", required: false }
          - { label: "Hero note", name: "hero_note_en", widget: "string", required: false }
          - { label: "Hero image (single-image fallback)", name: "hero_image", widget: "image", required: false }
          - { label: "Hero image alt (Chinese)", name: "hero_image_alt", widget: "string", required: false }
          - { label: "Hero image alt (English)", name: "hero_image_alt_en", widget: "string", required: false }
          - label: "Homepage modules (show / hide)"
            name: "modules"
            widget: "object"
            fields:
              - { label: "Trust & capability strip", name: "trust", widget: "boolean", default: true }
              - { label: "Products", name: "products", widget: "boolean", default: true }
              - { label: "Process", name: "process", widget: "boolean", default: true }
              - { label: "Knowledge", name: "knowledge", widget: "boolean", default: true }
              - { label: "Journal", name: "journal", widget: "boolean", default: true }
              - { label: "About", name: "about", widget: "boolean", default: true }
              - { label: "FAQ", name: "faq", widget: "boolean", default: true }
          - { label: "Module order (top to bottom)", name: "module_order", widget: "select", multiple: true, options: ["trust", "products", "process", "knowledge", "journal", "about", "faq"], required: false }
          - label: "Homepage FAQ"
            name: "faq_items"
            widget: "list"
            fields:
              - { label: "Question", name: "question_en", widget: "string" }
              - { label: "Answer", name: "answer_en", widget: "text" }
      - name: "en_site_global"
        label: "Site settings (navigation, contact, footer)"
        file: "content/en/settings/site.json"
        fields:
          - { label: "Top announcement", name: "announcement_en", widget: "string", required: false }
          - { label: "Brand tagline", name: "brand_tagline_en", widget: "string", required: false }
          - { label: "Contact email", name: "contact_email", widget: "string" }
          - { label: "Contact phone", name: "contact_phone", widget: "string", required: false }
          - { label: "WhatsApp link", name: "contact_whatsapp_url", widget: "string", required: false }
          - { label: "WhatsApp QR code image", name: "contact_whatsapp_qr", widget: "image", required: false }
          - label: "Navigation menu"
            name: "nav_items"
            widget: "list"
            fields:
              - { label: "Label", name: "label_en", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Show this item", name: "enabled", widget: "boolean", default: true }
          - { label: "Homepage SEO title", name: "seo_home_title_en", widget: "string", required: false }
          - { label: "Homepage SEO description", name: "seo_home_description_en", widget: "text", required: false }
          - { label: "Footer tagline", name: "footer_tagline_en", widget: "text", required: false }
          - { label: "Footer hours", name: "footer_hours_en", widget: "string", required: false }
          - { label: "Footer delivery note", name: "footer_delivery_en", widget: "text", required: false }
          - { label: "Footer copyright", name: "footer_copyright_en", widget: "string", required: false }
          - { label: "Footer region note", name: "footer_region_en", widget: "string", required: false }

  - name: "en_company"
    label: "海外版 · 公司信息"
    files:
      - name: "en_company_pages"
        label: "Shipping & About pages"
        file: "content/en/settings/company.json"
        fields:
          - label: "Shipping page"
            name: "shipping"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Steps heading", name: "steps_heading", widget: "string", required: false }
              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Step title", name: "title", widget: "string" }
                  - { label: "Step text", name: "body", widget: "text" }
              - { label: "Trade terms heading", name: "trade_terms_heading", widget: "string", required: false }
              - { label: "Trade terms intro", name: "trade_terms_intro", widget: "text", required: false }
              - label: "Trade terms"
                name: "trade_terms"
                widget: "list"
                fields:
                  - { label: "Term (FOB / CIF / DDP)", name: "term", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "body", widget: "text" }
              - { label: "Transit heading", name: "transit_heading", widget: "string", required: false }
              - { label: "Transit text", name: "transit_body", widget: "text", required: false }
              - { label: "Australia note", name: "australia_note", widget: "text", required: false }
              - { label: "Packing heading", name: "packing_heading", widget: "string", required: false }
              - label: "Packing points"
                name: "packing"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "body", widget: "text" }
          - label: "About page"
            name: "about"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Studio heading", name: "studio_heading", widget: "string", required: false }
              - { label: "Studio paragraphs", name: "studio_paragraphs", widget: "list", required: false }
              - { label: "Steps heading", name: "steps_heading", widget: "string", required: false }
              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Step title", name: "title", widget: "string" }
                  - { label: "Step text", name: "body", widget: "text" }
              - { label: "Audience heading", name: "audience_heading", widget: "string", required: false }
              - { label: "Audience intro", name: "audience_intro", widget: "text", required: false }
              - label: "Audience groups"
                name: "audience"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "body", widget: "text" }
              - { label: "Audience note", name: "audience_note", widget: "text", required: false }
              - { label: "CTA heading", name: "cta_heading", widget: "string", required: false }
              - { label: "CTA text", name: "cta_body", widget: "text", required: false }
              - { label: "Contact email", name: "contact_email", widget: "string", required: false }

  # ================= 国内版（中文, yinzaosuo.com/zh） =================
  - name: "zh_products"
    label: "国内版 · 产品大全"
    folder: "content/zh/products"
    summary: "{{title}} · {{category}} · 顺序 {{sort_order}}"
    sortable_fields:
      - { field: sort_order, label: "后台排序", default_sort: asc }
      - title
    create: true
    format: "json"
    extension: "json"
    identifier_field: "id"
    slug: "{{id}}"
    fields:
      - { label: "产品编号（系统识别）", name: "id", widget: "string" }
      - { label: "隐藏内容", name: "hidden", widget: "boolean", default: false }
      - { label: "展示顺序（数字越小越靠前）", name: "sort_order", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "在产品展示中显示", name: "show_in_archive", widget: "boolean", default: true }
      - { label: "分类键（如 wideformat）", name: "category", widget: "string", required: false }
      - { label: "分类名称", name: "category_title", widget: "string", required: false }
      - { label: "分类介绍", name: "category_desc", widget: "text", required: false }
      - { label: "分类序号", name: "category_num", widget: "string", required: false }
      - { label: "详情页显示的分类名", name: "category_label", widget: "string", required: false }
      - { label: "列表名称", name: "title", widget: "string" }
      - { label: "列表图片", name: "image", widget: "image", required: false }
      - { label: "列表简介", name: "desc", widget: "text", required: false }
      - { label: "介绍（简介备用）", name: "intro", widget: "text", required: false }
      - { label: "材质标签", name: "materials", widget: "list", required: false }
      - { label: "加工工艺标签", name: "crafts", widget: "list", required: false }
      - { label: "列表 SEO 标题", name: "seo_title", widget: "string", required: false }
      - { label: "列表 SEO 描述", name: "seo_description", widget: "text", required: false }
      - { label: "详情页名称（H1）", name: "name", widget: "string", required: false }
      - { label: "详情页主图", name: "detail_image", widget: "image", required: false }
      - { label: "详情页导语", name: "detail_desc", widget: "text", required: false }
      - { label: "详情 SEO 标题", name: "detail_seo_title", widget: "string", required: false }
      - { label: "详情 SEO 描述", name: "detail_seo_description", widget: "text", required: false }
      - { label: "列表图片来源说明", name: "image_credit", widget: "string", required: false }
      - { label: "详情图片来源说明", name: "detail_image_credit", widget: "string", required: false }
      - label: "产品详情"
        name: "detail"
        widget: "object"
        required: false
        fields:
          - { label: "详情导语", name: "lead", widget: "text", required: false }
          - { label: "生产与定制能力", name: "highlights", widget: "list", required: false }
          - { label: "适用场景", name: "applications", widget: "list", required: false }
          - { label: "加工与后道处理", name: "finishing", widget: "list", required: false }
          - { label: "交付形式", name: "delivery", widget: "list", required: false }
          - { label: "设计文件支持", name: "artwork", widget: "text", required: false }
          - { label: "询价时建议提供的信息", name: "brief", widget: "text", required: false }
          - { label: "规格与生产注意事项", name: "caveat", widget: "text", required: false }

  - name: "zh_solutions"
    label: "国内版 · 场景方案"
    folder: "content/zh/solutions"
    summary: "{{title}} · {{category}} · {{date}}"
    sortable_fields:
      - { field: sort_order, label: "后台排序", default_sort: asc }
      - { field: date, label: "发布日期" }
      - title
    create: true
    format: "yaml-frontmatter"
    extension: "md"
    identifier_field: "slug"
    slug: "{{slug}}"
    fields:
      - { label: "内容编号(ID)", name: "id", widget: "string" }
      - { label: "后台排序（数字越小越靠前）", name: "sort_order", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "隐藏内容", name: "hidden", widget: "boolean", default: false }
      - { label: "文章网址（英文小写字母、数字和连字符）", name: "slug", widget: "string" }
      - { label: "方案标题", name: "title", widget: "string" }
      - { label: "场景标签", name: "category", widget: "string" }
      - { label: "封面图", name: "cover", widget: "image", required: false }
      - { label: "方案简述", name: "summary", widget: "text" }
      - { label: "SEO 标题（可选，默认使用方案标题）", name: "seo_title", widget: "string", required: false }
      - { label: "SEO 描述（可选，默认使用方案摘要）", name: "seo_description", widget: "text", required: false }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "实景图集", name: "gallery", widget: "list", required: false, fields: [{ label: "图片", name: "image", widget: "image" }] }
      - { label: "方案详细内容", name: "body", widget: "markdown" }

  - name: "zh_knowledge"
    label: "国内版 · 资讯"
    folder: "content/zh/knowledge"
    summary: "{{title}} · {{category}} · {{date}}"
    sortable_fields:
      - { field: sort_order, label: "后台排序", default_sort: asc }
      - { field: date, label: "发布日期" }
      - title
    create: true
    format: "yaml-frontmatter"
    extension: "md"
    identifier_field: "slug"
    slug: "{{slug}}"
    fields:
      - { label: "内容编号(ID)", name: "id", widget: "string" }
      - { label: "后台排序（数字越小越靠前）", name: "sort_order", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "隐藏内容", name: "hidden", widget: "boolean", default: false }
      - { label: "文章网址（英文小写字母、数字和连字符）", name: "slug", widget: "string" }
      - { label: "文章标题", name: "title", widget: "string" }
      - { label: "资讯分类", name: "category", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "封面图", name: "cover", widget: "image", required: false }
      - { label: "文章摘要（默认作为 SEO 描述）", name: "summary", widget: "text" }
      - { label: "SEO 标题（可选，默认使用文章标题）", name: "seo_title", widget: "string", required: false }
      - { label: "SEO 描述（可选，默认使用文章摘要）", name: "seo_description", widget: "text", required: false }
      - { label: "正文内容", name: "body", widget: "markdown" }

  - name: "zh_materials"
    label: "国内版 · 素材中心"
    folder: "content/zh/materials"
    summary: "{{title}} · 顺序 {{sort_order}}"
    sortable_fields:
      - { field: sort_order, label: "后台排序", default_sort: asc }
      - title
    create: true
    format: "json"
    extension: "json"
    identifier_field: "id"
    slug: "{{id}}"
    fields:
      - { label: "素材编号（系统识别）", name: "id", widget: "string" }
      - { label: "隐藏内容", name: "hidden", widget: "boolean", default: false }
      - { label: "素材标题", name: "title", widget: "string" }
      - label: "主图（3–5 张，可切换展示）"
        name: "gallery"
        widget: "list"
        min: 3
        max: 5
        summary: "{{fields.image}}"
        fields:
          - { label: "图片", name: "image", widget: "image", choose_url: true }
      - { label: "文字介绍", name: "description", widget: "text", required: false }
      - { label: "展示顺序（数字越小越靠前）", name: "sort_order", widget: "number", default: 10, value_type: "int", required: false }

  - name: "zh_delivery"
    label: "国内版 · 配送时效"
    files:
      - name: "zh_delivery_page"
        label: "配送时效页内容"
        file: "content/zh/settings/delivery.json"
        fields:
          - { label: "页面标题", name: "title", widget: "string" }
          - { label: "页面导语", name: "intro", widget: "text" }
          - { label: "时效表标题", name: "timetable_heading", widget: "string", required: false }
          - { label: "时效表说明", name: "timetable_note", widget: "text", required: false }
          - label: "配送时效档位"
            name: "timetable"
            widget: "list"
            fields:
              - { label: "档位名称", name: "label", widget: "string" }
              - { label: "确认条件", name: "condition", widget: "string" }
              - { label: "说明", name: "body", widget: "text" }
          - { label: "配送范围说明", name: "coverage", widget: "text", required: false }
          - { label: "专车配送标题", name: "van_heading", widget: "string", required: false }
          - label: "我方配送（整板专送）"
            name: "van_ours"
            widget: "object"
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - { label: "说明", name: "body", widget: "text" }
          - label: "对比（快递与自提）"
            name: "van_compare"
            widget: "object"
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - { label: "说明", name: "body", widget: "text" }
          - label: "下单流程"
            name: "steps"
            widget: "list"
            fields:
              - { label: "步骤标题", name: "title", widget: "string" }
              - { label: "步骤说明", name: "body", widget: "text" }
          - label: "常见问题"
            name: "faq"
            widget: "list"
            fields:
              - { label: "问题", name: "question", widget: "string" }
              - { label: "答案", name: "answer", widget: "text" }
          - { label: "其他地区说明", name: "regions_note", widget: "text", required: false }
          - { label: "联系电话", name: "contact_phone", widget: "string", required: false }

  - name: "zh_home"
    label: "国内版 · 首页"
    files:
      - name: "zh_home_page"
        label: "首页内容与 Banner"
        file: "content/zh/settings/home.json"
        fields:
          - label: "首页 Banner 轮播图（3–5张）"
            name: "hero_slides"
            widget: "list"
            min: 3
            max: 5
            summary: "{{fields.image}}"
            fields:
              - { label: "Banner 图片", name: "image", widget: "image" }
          - { label: "首屏小标题", name: "eyebrow_zh", widget: "string", required: false }
          - { label: "首页主标题", name: "hero_title_zh", widget: "string", required: false }
          - { label: "首页介绍", name: "hero_description_zh", widget: "text", required: false }
          - { label: "首页辅助文案", name: "hero_note_zh", widget: "string", required: false }
          - { label: "首屏图片（单图备用）", name: "hero_image", widget: "image", required: false }
          - { label: "首屏图片替代文字（中文）", name: "hero_image_alt", widget: "string", required: false }
          - { label: "首屏图片替代文字（英文）", name: "hero_image_alt_en", widget: "string", required: false }
          - label: "首页模块显示与隐藏"
            name: "modules"
            widget: "object"
            fields:
              - { label: "信任与服务能力", name: "trust", widget: "boolean", default: true }
              - { label: "产品展示", name: "products", widget: "boolean", default: true }
              - { label: "合作流程", name: "process", widget: "boolean", default: true }
              - { label: "印刷知识", name: "knowledge", widget: "boolean", default: true }
              - { label: "品牌资讯", name: "journal", widget: "boolean", default: true }
              - { label: "品牌介绍", name: "about", widget: "boolean", default: true }
              - { label: "常见问题", name: "faq", widget: "boolean", default: true }
          - { label: "首页模块顺序（从上到下）", name: "module_order", widget: "select", multiple: true, options: ["trust", "products", "process", "knowledge", "journal", "about", "faq"], required: false }
          - label: "首页常见问题"
            name: "faq_items"
            widget: "list"
            fields:
              - { label: "问题", name: "question_zh", widget: "string" }
              - { label: "答案", name: "answer_zh", widget: "text" }
      - name: "zh_site_global"
        label: "网站设置（导航、联系信息、页脚）"
        file: "content/zh/settings/site.json"
        fields:
          - { label: "顶部公告", name: "announcement_zh", widget: "string", required: false }
          - { label: "品牌副标题", name: "brand_tagline_zh", widget: "string", required: false }
          - { label: "业务邮箱", name: "contact_email", widget: "string" }
          - { label: "联系电话", name: "contact_phone", widget: "string", required: false }
          - { label: "WhatsApp 联系链接", name: "contact_whatsapp_url", widget: "string", required: false }
          - { label: "WhatsApp 二维码图片", name: "contact_whatsapp_qr", widget: "image", required: false }
          - label: "导航菜单"
            name: "nav_items"
            widget: "list"
            fields:
              - { label: "名称", name: "label_zh", widget: "string" }
              - { label: "链接地址", name: "url", widget: "string" }
              - { label: "显示此菜单", name: "enabled", widget: "boolean", default: true }
          - { label: "首页 SEO 标题", name: "seo_home_title_zh", widget: "string", required: false }
          - { label: "首页 SEO 描述", name: "seo_home_description_zh", widget: "text", required: false }
          - { label: "页脚品牌介绍", name: "footer_tagline_zh", widget: "text", required: false }
          - { label: "页脚工作时间", name: "footer_hours_zh", widget: "string", required: false }
          - { label: "页脚配送说明", name: "footer_delivery_zh", widget: "text", required: false }
          - { label: "版权文字", name: "footer_copyright_zh", widget: "string", required: false }
          - { label: "页脚地区说明", name: "footer_region_zh", widget: "string", required: false }
