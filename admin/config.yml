local_backend: false
locale: zh_Hans

backend:
  name: github
  repo: Apprentice185/yinzaosuo
  branch: main
  base_url: https://decap-oauth.xiaotanqingqing.workers.dev
  auth_endpoint: auth

media_folder: "pic"
public_folder: "/pic"
site_url: "https://yinzaosuo.com"
display_url: "https://yinzaosuo.com"
logo_url: "https://yinzaosuo.com/pic/brand-visual-board.jpg"

collections:
  - name: "products"
    label: "产品中心"
    folder: "content/products"
    summary: "{{title}} · {{category}} · {{status}} · 顺序 {{sort_order}}"
    sortable_fields:
      - { field: sort_order, label: "后台排序", default_sort: asc }
      - { field: date, label: "发布日期" }
      - title
    create: true
    format: "json"
    extension: "json"
    identifier_field: "id"
    slug: "{{id}}"
    fields:
      - { label: "产品编号（系统识别）", name: "id", widget: "string" }
      - { label: "发布范围", name: "publish_to", widget: "select", default: "both", options: [{ label: "国内站和国际站", value: "both" }, { label: "仅国内站", value: "domestic" }, { label: "仅国际站", value: "international" }] }
      - { label: "发布状态", name: "status", widget: "select", default: "published", options: [{ label: "正常发布", value: "published" }, { label: "隐藏（不在网站展示）", value: "hidden" }] }
      - { label: "产品中文名称", name: "title", widget: "string" }
      - { label: "英文译文：标题 / 名称", name: "title_en", widget: "string", required: false }
      - { label: "所属首页产品分类", name: "category", widget: "select", options: [{ label: "定制印刷成品", value: "commercial" }, { label: "包装定制类", value: "packaging" }, { label: "广告加工与展示", value: "exhibition" }] }
      - { label: "国际站产品图片", name: "image", widget: "image" }
      - { label: "国内站产品图片（可选）", name: "image_zh", widget: "image", required: false }
      - { label: "产品介绍（中文）", name: "desc", widget: "text" }
      - { label: "英文译文：内容介绍", name: "desc_en", widget: "text", required: false }
      - { label: "材质标签（中文）", name: "materials", widget: "list", required: false }
      - { label: "英文译文：材质标签", name: "materials_en", widget: "list", required: false }
      - { label: "加工工艺标签（中文）", name: "crafts", widget: "list", required: false }
      - { label: "英文译文：工艺标签", name: "crafts_en", widget: "list", required: false }
      - { label: "首页展示顺序（数字越小越靠前）", name: "sort_order", widget: "number", default: 10, value_type: "int" }
      - { label: "在产品展示中显示", name: "show_in_archive", widget: "boolean", default: true }
      - { label: "分类名称（中文）", name: "category_title", widget: "string", required: false }
      - { label: "英文译文：分类名称", name: "category_title_en", widget: "string", required: false }
      - { label: "分类介绍（中文）", name: "category_desc", widget: "text", required: false }
      - { label: "英文译文：分类介绍", name: "category_desc_en", widget: "text", required: false }
      - { label: "分类序号", name: "category_num", widget: "string", required: false }

  - name: "catalogue"
    label: "核心产品详情（7类）"
    folder: "content/catalogue"
    summary: "{{name_zh}} · {{status}} · {{sort_order}}"
    sortable_fields:
      - { field: sort_order, label: "后台排序", default_sort: asc }
      - { field: date, label: "发布日期", default_sort: desc }
      - title
    create: false
    format: "json"
    extension: "json"
    identifier_field: "id"
    slug: "{{id}}"
    fields:
      - { label: "产品编号（请勿修改）", name: "id", widget: "string" }
      - { label: "后台排序（数字越小越靠前）", name: "sort_order", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "发布范围", name: "publish_to", widget: "select", default: "both", options: [{ label: "国内站和国际站", value: "both" }, { label: "仅国内站", value: "domestic" }, { label: "仅国际站", value: "international" }] }
      - { label: "发布状态", name: "status", widget: "select", default: "published", options: [{ label: "正常发布", value: "published" }, { label: "隐藏（不在网站展示）", value: "hidden" }] }
      - { label: "产品中文名称", name: "name_zh", widget: "string" }
      - { label: "英文译文：产品名称", name: "name_en", widget: "string", required: false }
      - { label: "产品主图", name: "image", widget: "image" }
      - { label: "产品简介（中文）", name: "desc_zh", widget: "text" }
      - { label: "英文译文：内容介绍", name: "desc_en", widget: "text", required: false }
      - label: "产品详情（中文）"
        name: "detail_zh"
        widget: "object"
        fields:
          - { label: "详情导语", name: "lead", widget: "text" }
          - { label: "生产与定制能力", name: "highlights", widget: "list" }
          - { label: "适用场景", name: "applications", widget: "list" }
          - { label: "加工与后道处理", name: "finishing", widget: "list" }
          - { label: "交付形式", name: "delivery", widget: "list" }
          - { label: "设计文件支持", name: "artwork", widget: "text" }
          - { label: "询价时建议提供的信息", name: "brief", widget: "text" }
          - { label: "规格与生产注意事项", name: "caveat", widget: "text" }
      - label: "英文详情（AI 翻译后可修改）"
        name: "detail_en"
        widget: "object"
        required: false
        fields:
          - { label: "英文译文：详情导语", name: "lead", widget: "text", required: false }
          - { label: "英文译文：生产能力", name: "highlights", widget: "list", required: false }
          - { label: "英文译文：适用场景", name: "applications", widget: "list", required: false }
          - { label: "英文译文：加工与后道处理", name: "finishing", widget: "list", required: false }
          - { label: "英文译文：交付形式", name: "delivery", widget: "list", required: false }
          - { label: "英文译文：设计文件支持", name: "artwork", widget: "text", required: false }
          - { label: "英文译文：询价信息", name: "brief", widget: "text", required: false }
          - { label: "英文译文：规格与生产注意事项", name: "caveat", widget: "text", required: false }

  - name: "solutions"
    label: "场景方案"
    folder: "content/solutions"
    summary: "{{title}} · {{tag}} · {{date}} · {{status}}"
    sortable_fields:
      - { field: sort_order, label: "后台排序", default_sort: asc }
      - { field: date, label: "发布日期", default_sort: desc }
      - title
    create: true
    format: "yaml-frontmatter"
    extension: "md"
    identifier_field: "slug"
    slug: "{{slug}}"
    fields:
      - { label: "内容编号(ID)", name: "id", widget: "string" }
      - { label: "后台排序（数字越小越靠前）", name: "sort_order", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "发布范围", name: "publish_to", widget: "select", default: "both", options: [{ label: "国内站和国际站", value: "both" }, { label: "仅国内站", value: "domestic" }, { label: "仅国际站", value: "international" }] }
      - { label: "发布状态", name: "status", widget: "select", default: "published", options: [{ label: "正常发布", value: "published" }, { label: "隐藏（不在网站展示）", value: "hidden" }] }
      - { label: "内容路径", name: "slug", widget: "string" }
      - { label: "方案标题", name: "title", widget: "string" }
      - { label: "英文译文：标题 / 名称", name: "title_en", widget: "string", required: false }
      - { label: "场景标签", name: "tag", widget: "string" }
      - { label: "英文译文：标签", name: "tag_en", widget: "string", required: false }
      - { label: "封面图", name: "cover_image", widget: "image" }
      - { label: "方案简述", name: "summary", widget: "text" }
      - { label: "英文译文：摘要", name: "summary_en", widget: "text", required: false }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "实景图集", name: "gallery", widget: "list", required: false, fields: [{ label: "图片", name: "image", widget: "image" }] }
      - { label: "方案详细内容", name: "body", widget: "markdown" }
      - { label: "英文译文：正文", name: "body_en", widget: "markdown", required: false }

  - name: "knowledge"
    label: "印刷知识"
    folder: "content/knowledge"
    summary: "{{title}} · {{category}} · {{date}} · {{status}}"
    sortable_fields:
      - { field: sort_order, label: "后台排序", default_sort: asc }
      - { field: date, label: "发布日期", default_sort: desc }
      - title
    create: true
    format: "yaml-frontmatter"
    extension: "md"
    identifier_field: "slug"
    slug: "{{slug}}"
    fields:
      - { label: "内容编号(ID)", name: "id", widget: "string" }
      - { label: "后台排序（数字越小越靠前）", name: "sort_order", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "发布范围", name: "publish_to", widget: "select", default: "both", options: [{ label: "国内站和国际站", value: "both" }, { label: "仅国内站", value: "domestic" }, { label: "仅国际站", value: "international" }] }
      - { label: "发布状态", name: "status", widget: "select", default: "published", options: [{ label: "正常发布", value: "published" }, { label: "隐藏（不在网站展示）", value: "hidden" }] }
      - { label: "内容路径", name: "slug", widget: "string" }
      - { label: "文章标题", name: "title", widget: "string" }
      - { label: "英文译文：标题 / 名称", name: "title_en", widget: "string", required: false }
      - { label: "知识分类", name: "category", widget: "select", options: ["材质科普", "工艺解析", "避坑指南"] }
      - { label: "英文译文：分类", name: "category_en", widget: "string", required: false }
      - { label: "旧分类记录", name: "legacy_category", widget: "string", required: false }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "封面图", name: "cover", widget: "image", required: false }
      - { label: "SEO 摘要", name: "summary", widget: "text" }
      - { label: "英文译文：摘要", name: "summary_en", widget: "text", required: false }
      - { label: "正文内容", name: "body", widget: "markdown" }
      - { label: "英文译文：正文", name: "body_en", widget: "markdown", required: false }

  - name: "news"
    label: "品牌资讯"
    folder: "content/news"
    summary: "{{title}} · {{tag}} · {{date}} · {{status}} · 顺序 {{sort_order}}"
    sortable_fields:
      - { field: sort_order, label: "后台排序", default_sort: asc }
      - { field: date, label: "发布日期", default_sort: desc }
      - title
    create: true
    format: "yaml-frontmatter"
    extension: "md"
    identifier_field: "slug"
    slug: "{{slug}}"
    fields:
      - { label: "内容编号(ID)", name: "id", widget: "string" }
      - { label: "发布范围", name: "publish_to", widget: "select", default: "both", options: [{ label: "国内站和国际站", value: "both" }, { label: "仅国内站", value: "domestic" }, { label: "仅国际站", value: "international" }] }
      - { label: "发布状态", name: "status", widget: "select", default: "published", options: [{ label: "正常发布", value: "published" }, { label: "隐藏（不在网站展示）", value: "hidden" }] }
      - { label: "内容路径", name: "slug", widget: "string" }
      - { label: "资讯标题", name: "title", widget: "string" }
      - { label: "英文译文：标题 / 名称", name: "title_en", widget: "string", required: false }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "封面图", name: "cover", widget: "image", required: false }
      - { label: "标签", name: "tag", widget: "string" }
      - { label: "英文译文：标签", name: "tag_en", widget: "string", required: false }
      - { label: "资讯摘要", name: "summary", widget: "text", required: false }
      - { label: "英文译文：摘要", name: "summary_en", widget: "text", required: false }
      - { label: "排序权重", name: "sort_order", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "资讯正文", name: "body", widget: "markdown" }
      - { label: "英文译文：正文", name: "body_en", widget: "markdown", required: false }

  - name: "templates"
    label: "模板素材"
    folder: "content/templates"
    summary: "{{title}} · {{type}} · {{size_spec}} · {{status}}"
    sortable_fields:
      - { field: sort_order, label: "后台排序", default_sort: asc }
      - { field: date, label: "发布日期", default_sort: desc }
      - title
    create: true
    format: "json"
    extension: "json"
    identifier_field: "id"
    slug: "{{id}}"
    fields:
      - { label: "素材编号(ID)", name: "id", widget: "string" }
      - { label: "后台排序（数字越小越靠前）", name: "sort_order", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "发布范围", name: "publish_to", widget: "select", default: "both", options: [{ label: "国内站和国际站", value: "both" }, { label: "仅国内站", value: "domestic" }, { label: "仅国际站", value: "international" }] }
      - { label: "发布状态", name: "status", widget: "select", default: "published", options: [{ label: "正常发布", value: "published" }, { label: "隐藏（不在网站展示）", value: "hidden" }] }
      - { label: "素材标题", name: "title", widget: "string" }
      - { label: "英文译文：标题 / 名称", name: "title_en", widget: "string", required: false }
      - { label: "模板类型", name: "type", widget: "select", options: ["包装盒展开图", "展架刀模", "迎宾牌工程", "VI规范"] }
      - { label: "预览图", name: "thumb", widget: "image", required: false }
      - { label: "尺寸规范", name: "size_spec", widget: "string", required: false }
      - { label: "源文件/下载链接", name: "file_url", widget: "string", required: false }
      - { label: "英文译文：类型", name: "type_en", widget: "string", required: false }
      - { label: "描述", name: "description", widget: "text", required: false }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "原品类", name: "category", widget: "string", required: false }
      - { label: "原风格", name: "style", widget: "string", required: false }
      - { label: "尺寸", name: "size", widget: "string", required: false }
      - { label: "价格参考", name: "price", widget: "string", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "色调", name: "tone", widget: "string", required: false }
      - { label: "颜色", name: "color", widget: "string", required: false }
      - { label: "设计图", name: "designImage", widget: "image", required: false }
      - { label: "尺寸图", name: "sizeImage", widget: "image", required: false }
      - { label: "场景图", name: "sceneImage", widget: "image", required: false }

  - name: "site_settings"
    label: "网站设置"
    files:
      - name: "global"
        label: "全局网站设置（导航、联系信息、SEO）"
        file: "content/settings/site.json"
        fields:
          - { label: "英文译文：顶部公告", name: "announcement_en", widget: "string", required: false }
          - { label: "顶部公告（中文）", name: "announcement_zh", widget: "string" }
          - { label: "英文译文：品牌副标题", name: "brand_tagline_en", widget: "string", required: false }
          - { label: "品牌副标题（中文）", name: "brand_tagline_zh", widget: "string" }
          - { label: "业务邮箱", name: "contact_email", widget: "string" }
          - { label: "联系电话", name: "contact_phone", widget: "string", required: false }
          - { label: "WhatsApp 联系链接（如 https://wa.me/国家区号手机号）", name: "contact_whatsapp_url", widget: "string", required: false }
          - { label: "WhatsApp 二维码图片", name: "contact_whatsapp_qr", widget: "image", required: false }
          - label: "导航菜单"
            name: "nav_items"
            widget: "list"
            fields:
              - { label: "中文名称", name: "label_zh", widget: "string" }
              - { label: "英文译文：导航名称", name: "label_en", widget: "string", required: false }
              - { label: "链接地址", name: "url", widget: "string" }
              - { label: "显示此菜单", name: "enabled", widget: "boolean", default: true }
          - { label: "英文译文：首页 SEO 标题", name: "seo_home_title_en", widget: "string", required: false }
          - { label: "首页 SEO 标题（中文）", name: "seo_home_title_zh", widget: "string" }
          - { label: "英文译文：首页 SEO 描述", name: "seo_home_description_en", widget: "text", required: false }
          - { label: "首页 SEO 描述（中文）", name: "seo_home_description_zh", widget: "text" }
          - { label: "英文译文：页脚品牌介绍", name: "footer_tagline_en", widget: "text", required: false }
          - { label: "页脚品牌介绍（中文）", name: "footer_tagline_zh", widget: "text" }
          - { label: "英文译文：页脚工作时间", name: "footer_hours_en", widget: "string", required: false }
          - { label: "页脚工作时间（中文）", name: "footer_hours_zh", widget: "string" }
          - { label: "英文译文：页脚配送说明", name: "footer_delivery_en", widget: "text", required: false }
          - { label: "页脚配送说明（中文）", name: "footer_delivery_zh", widget: "text" }
          - { label: "英文译文：版权文字", name: "footer_copyright_en", widget: "string", required: false }
          - { label: "版权文字（中文）", name: "footer_copyright_zh", widget: "string" }
          - { label: "英文译文：页脚地区说明", name: "footer_region_en", widget: "string", required: false }
          - { label: "页脚地区说明（中文）", name: "footer_region_zh", widget: "string" }
      - name: "home"
        label: "首页内容与 Banner"
        file: "content/settings/home.json"
        fields:
          - label: "首页 Banner 轮播图（3–5张）"
            name: "hero_slides"
            widget: "list"
            min: 3
            max: 5
            summary: "{{fields.image}}"
            fields:
              - { label: "Banner 图片", name: "image", widget: "image" }
          - { label: "首屏小标题（中文）", name: "eyebrow_zh", widget: "string" }
          - { label: "英文译文：首屏小标题", name: "eyebrow_en", widget: "string", required: false }
          - { label: "首页主标题（中文）", name: "hero_title_zh", widget: "string" }
          - { label: "英文译文：首页主标题", name: "hero_title_en", widget: "string", required: false }
          - { label: "首页介绍（中文）", name: "hero_description_zh", widget: "text" }
          - { label: "英文译文：首页介绍", name: "hero_description_en", widget: "text", required: false }
          - { label: "首页辅助文案（中文）", name: "hero_note_zh", widget: "string" }
          - { label: "英文译文：首页辅助文案", name: "hero_note_en", widget: "string", required: false }
          - label: "首页模块显示与顺序"
            name: "modules"
            widget: "object"
            fields:
              - { label: "信任与服务能力", name: "trust", widget: "boolean", default: true }
              - { label: "产品展示", name: "products", widget: "boolean", default: true }
              - { label: "合作流程", name: "process", widget: "boolean", default: true }
              - { label: "印刷知识", name: "knowledge", widget: "boolean", default: true }
              - { label: "品牌资讯", name: "journal", widget: "boolean", default: true }
              - { label: "品牌介绍", name: "about", widget: "boolean", default: true }
              - { label: "常见问题", name: "faq", widget: "boolean", default: true }
          - { label: "首页模块顺序（从上到下）", name: "module_order", widget: "select", multiple: true, options: ["trust", "products", "process", "knowledge", "journal", "about", "faq"], required: false }
          - label: "首页常见问题"
            name: "faq_items"
            widget: "list"
            fields:
              - { label: "问题（中文）", name: "question_zh", widget: "string" }
              - { label: "答案（中文）", name: "answer_zh", widget: "text" }
              - { label: "英文译文：问题", name: "question_en", widget: "string", required: false }
              - { label: "英文译文：答案", name: "answer_en", widget: "text", required: false }
