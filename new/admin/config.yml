local_backend: true

backend:
  name: github
  repo: Apprentice185/yinzaosuo
  branch: main
  base_url: https://decap-oauth.xiaotanqingqing.workers.dev
  auth_endpoint: auth

media_folder: "new/pic"
public_folder: "/new/pic"
site_url: "https://yinzaosuo.com/new"
display_url: "https://yinzaosuo.com/new"
logo_url: "https://yinzaosuo.com/new/pic/brand-visual-board.jpg"

collections:
  - name: "products"
    label: "产品中心"
    folder: "new/content/products"
    create: true
    format: "json"
    extension: "json"
    identifier_field: "id"
    slug: "{{id}}"
    fields:
      - { label: "产品编号（系统识别）", name: "id", widget: "string" }
      - { label: "产品中文名称", name: "title", widget: "string" }
      - { label: "Product name (English)", name: "title_en", widget: "string" }
      - { label: "所属首页产品分类", name: "category", widget: "select", options: [{ label: "定制印刷成品", value: "commercial" }, { label: "包装定制类", value: "packaging" }, { label: "广告加工与展示", value: "exhibition" }] }
      - { label: "产品展示图片", name: "image", widget: "image" }
      - { label: "产品介绍（中文）", name: "desc", widget: "text" }
      - { label: "Product description (English)", name: "desc_en", widget: "text" }
      - { label: "材质标签（中文）", name: "materials", widget: "list", required: false }
      - { label: "Material tags (English)", name: "materials_en", widget: "list", required: false }
      - { label: "加工工艺标签（中文）", name: "crafts", widget: "list", required: false }
      - { label: "Finishing tags (English)", name: "crafts_en", widget: "list", required: false }
      - { label: "首页展示顺序（数字越小越靠前）", name: "sort_order", widget: "number", default: 10, value_type: "int" }
      - { label: "在产品展示中显示", name: "show_in_archive", widget: "boolean", default: true }
      - { label: "分类名称（中文）", name: "category_title", widget: "string", required: false }
      - { label: "Category title (English)", name: "category_title_en", widget: "string", required: false }
      - { label: "分类介绍（中文）", name: "category_desc", widget: "text", required: false }
      - { label: "Category description (English)", name: "category_desc_en", widget: "text", required: false }
      - { label: "分类序号", name: "category_num", widget: "string", required: false }

  - name: "solutions"
    label: "场景方案"
    folder: "new/content/solutions"
    create: true
    format: "yaml-frontmatter"
    extension: "md"
    identifier_field: "slug"
    slug: "{{slug}}"
    fields:
      - { label: "内容编号(ID)", name: "id", widget: "string" }
      - { label: "内容路径", name: "slug", widget: "string" }
      - { label: "方案标题", name: "title", widget: "string" }
      - { label: "英文标题", name: "title_en", widget: "string" }
      - { label: "场景标签", name: "tag", widget: "string" }
      - { label: "英文场景标签", name: "tag_en", widget: "string", required: false }
      - { label: "封面图", name: "cover_image", widget: "image" }
      - { label: "方案简述", name: "summary", widget: "text" }
      - { label: "英文方案简述", name: "summary_en", widget: "text", required: false }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "实景图集", name: "gallery", widget: "list", required: false, fields: [{ label: "图片", name: "image", widget: "image" }] }
      - { label: "方案详细内容", name: "body", widget: "markdown" }
      - { label: "英文详细内容", name: "body_en", widget: "markdown", required: false }

  - name: "knowledge"
    label: "印刷知识"
    folder: "new/content/knowledge"
    create: true
    format: "yaml-frontmatter"
    extension: "md"
    identifier_field: "slug"
    slug: "{{slug}}"
    fields:
      - { label: "内容编号(ID)", name: "id", widget: "string" }
      - { label: "内容路径", name: "slug", widget: "string" }
      - { label: "文章标题", name: "title", widget: "string" }
      - { label: "英文标题", name: "title_en", widget: "string" }
      - { label: "知识分类", name: "category", widget: "select", options: ["材质科普", "工艺解析", "避坑指南"] }
      - { label: "英文分类", name: "category_en", widget: "string", required: false }
      - { label: "旧分类记录", name: "legacy_category", widget: "string", required: false }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "封面图", name: "cover", widget: "image", required: false }
      - { label: "SEO 摘要", name: "summary", widget: "text" }
      - { label: "英文 SEO 摘要", name: "summary_en", widget: "text", required: false }
      - { label: "正文内容", name: "body", widget: "markdown" }
      - { label: "英文正文", name: "body_en", widget: "markdown", required: false }

  - name: "news"
    label: "品牌资讯"
    folder: "new/content/news"
    create: true
    format: "yaml-frontmatter"
    extension: "md"
    identifier_field: "slug"
    slug: "{{slug}}"
    fields:
      - { label: "内容编号(ID)", name: "id", widget: "string" }
      - { label: "内容路径", name: "slug", widget: "string" }
      - { label: "资讯标题", name: "title", widget: "string" }
      - { label: "英文标题", name: "title_en", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "封面图", name: "cover", widget: "image", required: false }
      - { label: "标签", name: "tag", widget: "string" }
      - { label: "英文标签", name: "tag_en", widget: "string", required: false }
      - { label: "资讯摘要", name: "summary", widget: "text", required: false }
      - { label: "英文摘要", name: "summary_en", widget: "text", required: false }
      - { label: "排序权重", name: "sort_order", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "资讯正文", name: "body", widget: "markdown" }
      - { label: "英文正文", name: "body_en", widget: "markdown", required: false }

  - name: "templates"
    label: "模板素材"
    folder: "new/content/templates"
    create: true
    format: "json"
    extension: "json"
    identifier_field: "id"
    slug: "{{id}}"
    fields:
      - { label: "素材编号(ID)", name: "id", widget: "string" }
      - { label: "素材标题", name: "title", widget: "string" }
      - { label: "英文标题", name: "title_en", widget: "string" }
      - { label: "模板类型", name: "type", widget: "select", options: ["包装盒展开图", "展架刀模", "迎宾牌工程", "VI规范"] }
      - { label: "预览图", name: "thumb", widget: "image", required: false }
      - { label: "尺寸规范", name: "size_spec", widget: "string", required: false }
      - { label: "源文件/下载链接", name: "file_url", widget: "string", required: false }
      - { label: "英文模板类型", name: "type_en", widget: "string", required: false }
      - { label: "描述", name: "description", widget: "text", required: false }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "原品类", name: "category", widget: "string", required: false }
      - { label: "原风格", name: "style", widget: "string", required: false }
      - { label: "尺寸", name: "size", widget: "string", required: false }
      - { label: "价格参考", name: "price", widget: "string", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "色调", name: "tone", widget: "string", required: false }
      - { label: "颜色", name: "color", widget: "string", required: false }
      - { label: "设计图", name: "designImage", widget: "image", required: false }
      - { label: "尺寸图", name: "sizeImage", widget: "image", required: false }
      - { label: "场景图", name: "sceneImage", widget: "image", required: false }

  - name: "site_settings"
    label: "网站设置"
    files:
      - name: "global"
        label: "全局网站设置（导航、联系信息、SEO）"
        file: "new/content/settings/site.json"
        fields:
          - { label: "顶部公告（英文）", name: "announcement_en", widget: "string" }
          - { label: "顶部公告（中文）", name: "announcement_zh", widget: "string" }
          - { label: "品牌副标题（英文）", name: "brand_tagline_en", widget: "string" }
          - { label: "品牌副标题（中文）", name: "brand_tagline_zh", widget: "string" }
          - { label: "业务邮箱", name: "contact_email", widget: "string" }
          - { label: "联系电话", name: "contact_phone", widget: "string", required: false }
          - label: "导航菜单"
            name: "nav_items"
            widget: "list"
            fields:
              - { label: "中文名称", name: "label_zh", widget: "string" }
              - { label: "英文名称", name: "label_en", widget: "string" }
              - { label: "链接地址", name: "url", widget: "string" }
              - { label: "显示此菜单", name: "enabled", widget: "boolean", default: true }
          - { label: "首页 SEO 标题（英文）", name: "seo_home_title_en", widget: "string" }
          - { label: "首页 SEO 标题（中文）", name: "seo_home_title_zh", widget: "string" }
          - { label: "首页 SEO 描述（英文）", name: "seo_home_description_en", widget: "text" }
          - { label: "首页 SEO 描述（中文）", name: "seo_home_description_zh", widget: "text" }
          - { label: "页脚品牌介绍（英文）", name: "footer_tagline_en", widget: "text" }
          - { label: "页脚品牌介绍（中文）", name: "footer_tagline_zh", widget: "text" }
          - { label: "页脚工作时间（英文）", name: "footer_hours_en", widget: "string" }
          - { label: "页脚工作时间（中文）", name: "footer_hours_zh", widget: "string" }
          - { label: "页脚配送说明（英文）", name: "footer_delivery_en", widget: "text" }
          - { label: "页脚配送说明（中文）", name: "footer_delivery_zh", widget: "text" }
          - { label: "版权文字（英文）", name: "footer_copyright_en", widget: "string" }
          - { label: "版权文字（中文）", name: "footer_copyright_zh", widget: "string" }
          - { label: "页脚地区说明（英文）", name: "footer_region_en", widget: "string" }
          - { label: "页脚地区说明（中文）", name: "footer_region_zh", widget: "string" }
      - name: "home"
        label: "首页内容与 Banner"
        file: "new/content/settings/home.json"
        fields:
          - label: "首页 Banner 轮播图（3–5张）"
            name: "hero_slides"
            widget: "list"
            min: 3
            max: 5
            summary: "{{fields.image}}"
            fields:
              - { label: "Banner 图片", name: "image", widget: "image" }
          - { label: "首屏小标题（中文）", name: "eyebrow_zh", widget: "string" }
          - { label: "Hero eyebrow (English)", name: "eyebrow_en", widget: "string" }
          - { label: "首页主标题（中文）", name: "hero_title_zh", widget: "string" }
          - { label: "Main headline (English)", name: "hero_title_en", widget: "string" }
          - { label: "首页介绍（中文）", name: "hero_description_zh", widget: "text" }
          - { label: "Intro text (English)", name: "hero_description_en", widget: "text" }
          - { label: "首页辅助文案（中文）", name: "hero_note_zh", widget: "string" }
          - { label: "Supporting line (English)", name: "hero_note_en", widget: "string" }
          - label: "首页模块显示与顺序"
            name: "modules"
            widget: "object"
            fields:
              - { label: "信任与服务能力", name: "trust", widget: "boolean", default: true }
              - { label: "产品展示", name: "products", widget: "boolean", default: true }
              - { label: "合作流程", name: "process", widget: "boolean", default: true }
              - { label: "印刷知识", name: "knowledge", widget: "boolean", default: true }
              - { label: "品牌资讯", name: "journal", widget: "boolean", default: true }
              - { label: "品牌介绍", name: "about", widget: "boolean", default: true }
              - { label: "常见问题", name: "faq", widget: "boolean", default: true }
          - { label: "首页模块顺序（从上到下）", name: "module_order", widget: "select", multiple: true, options: ["trust", "products", "process", "knowledge", "journal", "about", "faq"], required: false }
          - label: "首页常见问题"
            name: "faq_items"
            widget: "list"
            fields:
              - { label: "问题（中文）", name: "question_zh", widget: "string" }
              - { label: "答案（中文）", name: "answer_zh", widget: "text" }
              - { label: "Question (English)", name: "question_en", widget: "string" }
              - { label: "Answer (English)", name: "answer_en", widget: "text" }
