<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>拼豆工作台</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- jsPDF for True Vector PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'system-ui', 'sans-serif'],
            mono: ['"SF Mono"', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          },
          colors: {
            apple: {
              bg: '#F5F5F7',
              surface: '#FFFFFF',
              border: '#E5E5EA',
              blue: '#0071E3',
              hoverBlue: '#0077ED',
              dark: '#1D1D1F',
              secondary: '#86868B'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col font-sans select-none">

  <!-- Apple Minimal Header (全响应式：手机端收纳留白，禁止文字挤压) -->
  <header class="h-14 md:h-16 border-b border-apple-border glass px-3 md:px-6 flex items-center justify-between shrink-0 z-40">
    <!-- 左侧：Logo + 标题 + 网址 (加 whitespace-nowrap 绝不折行) -->
    <div class="flex items-center space-x-2 md:space-x-3 shrink-0">
      <div class="w-7 h-7 md:w-8 md:h-8 rounded-lg bg-apple-dark flex items-center justify-center text-white text-xs shadow-xs shrink-0">
        <i class="fa-solid fa-shapes"></i>
      </div>
      
      <div class="flex items-center gap-1.5 md:gap-2.5 shrink-0">
        <h1 class="text-sm md:text-base font-semibold tracking-tight text-gray-900 whitespace-nowrap">拼豆工作台</h1>
        
        <!-- 网址展示胶囊：手机端隐藏或精简，平板/电脑端展示 -->
        <a href="https://yinzaosuo.com/pd" target="_blank" 
           class="hidden sm:inline-flex items-center gap-1.5 px-2 md:px-2.5 py-0.5 rounded-md bg-gray-100 hover:bg-gray-200/80 text-[10px] md:text-[11px] font-mono text-gray-600 hover:text-gray-900 transition border border-gray-200/60 shrink-0">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="tracking-wide font-medium">yinzaosuo.com/pd</span>
          <i class="fa-solid fa-arrow-up-right-from-square text-[9px] text-gray-400"></i>
        </a>
      </div>
    </div>

    <!-- 右侧操作区：手机端紧凑化 -->
    <div class="flex items-center space-x-1.5 md:space-x-2 shrink-0">
      <!-- 水平镜像按钮 -->
      <button id="mirrorToggleBtn" title="水平镜像翻转 (反面热熔烫平)" 
              class="h-8 md:h-9 px-2 md:px-2.5 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 flex items-center gap-1 text-xs font-medium transition shadow-2xs cursor-pointer shrink-0">
        <i class="fa-solid fa-arrows-left-right text-gray-500 text-[11px]"></i>
        <span class="hidden md:inline">镜像</span>
      </button>

      <!-- 拼装打卡消消乐辅助按钮 -->
      <button id="progressToggleBtn" title="拼装打卡辅助模式" 
              class="h-8 md:h-9 px-2 md:px-2.5 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 flex items-center gap-1 text-xs font-medium transition shadow-2xs cursor-pointer shrink-0">
        <i class="fa-solid fa-circle-check text-emerald-500 text-[11px]"></i>
        <span class="hidden md:inline">打卡</span>
        <span id="progressBadge" class="hidden text-[10px] px-1 py-0.2 rounded-full bg-emerald-100 text-emerald-700 font-mono font-semibold">0%</span>
      </button>

      <!-- 侧边栏展开按钮 (仅移动端可见) -->
      <button id="toggleSidebarBtn" class="md:hidden h-8 px-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-xs font-medium text-gray-700 transition flex items-center gap-1 shrink-0">
        <i class="fa-solid fa-sliders text-xs"></i>
        <span class="text-[11px]">参数</span>
      </button>

      <!-- 复位视图 -->
      <button id="resetViewBtn" title="复位视角" 
              class="w-8 h-8 md:w-9 md:h-9 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 text-gray-600 flex items-center justify-center transition text-xs shadow-2xs cursor-pointer shrink-0">
        <i class="fa-solid fa-arrows-rotate"></i>
      </button>

      <!-- 导出下拉 -->
      <div class="relative shrink-0">
        <button id="exportDropdownBtn" 
                class="h-8 md:h-9 px-2.5 md:px-3.5 rounded-xl bg-apple-blue hover:bg-apple-hoverBlue text-white text-xs font-medium transition flex items-center gap-1 md:gap-1.5 shadow-sm cursor-pointer whitespace-nowrap">
          <span>导出</span>
          <i class="fa-solid fa-chevron-down text-[9px] opacity-80"></i>
        </button>
        <div id="exportMenu" class="hidden absolute right-0 mt-1.5 w-44 rounded-xl bg-white shadow-xl py-1.5 z-50 border border-apple-border text-xs text-gray-800">
          <button id="exportPngBtn" class="w-full text-left px-3.5 py-2 hover:bg-blue-50 hover:text-apple-blue flex items-center gap-2 transition cursor-pointer">
            <i class="fa-regular fa-image text-sm"></i>
            <span>超清 PNG 图纸</span>
          </button>
          <button id="exportPdfBtn" class="w-full text-left px-3.5 py-2 hover:bg-blue-50 hover:text-apple-blue flex items-center gap-2 transition cursor-pointer">
            <i class="fa-regular fa-file-pdf text-sm text-red-500"></i>
            <span>矢量 PDF 图纸</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Workspace Container -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- 侧边栏：移动端抽屉遮罩，iPad/电脑端常驻 -->
    <aside id="sidebar" class="w-76 md:w-80 border-r border-apple-border bg-white flex flex-col h-full z-30 transition-transform duration-200 absolute md:relative -translate-x-full md:translate-x-0 shadow-xl md:shadow-none">
      <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs">
        
        <!-- 1. 图片上传 -->
        <section class="space-y-1.5">
          <div id="dropZone" class="border border-dashed border-gray-300 hover:border-apple-blue rounded-xl p-3 text-center cursor-pointer transition bg-gray-50/50 hover:bg-blue-50/30 relative overflow-hidden min-h-[64px] flex flex-col items-center justify-center">
            <input type="file" id="imageInput" accept="image/*" class="hidden">
            <div id="uploadPlaceholder" class="flex flex-col items-center justify-center">
              <i class="fa-solid fa-cloud-arrow-up text-lg text-gray-400 mb-0.5"></i>
              <p class="text-[11px] text-gray-600 font-medium">点击选择或拖拽图片</p>
            </div>
            <div id="imageActiveState" class="hidden w-full flex items-center justify-between px-1">
              <div class="flex items-center gap-2 overflow-hidden">
                <img id="imageThumb" class="w-8 h-8 rounded-md object-cover border border-gray-200 shrink-0" src="" alt="预览">
                <span id="imageName" class="truncate text-left text-[11px] font-medium text-gray-700 max-w-[130px]"></span>
              </div>
              <button id="removeImageBtn" class="px-2 py-1 text-[11px] rounded text-red-500 hover:bg-red-50 transition shrink-0 font-medium">清除</button>
            </div>
          </div>
        </section>

        <!-- 2. 色库选择 -->
        <section class="space-y-1.5">
          <label class="font-medium text-gray-800">色库方案</label>
          <div class="grid grid-cols-2 gap-1.5 bg-gray-100 p-1 rounded-xl">
            <button id="palette221Btn" class="py-1 rounded-lg font-medium text-center transition bg-white text-gray-900 shadow-xs cursor-pointer">
              MARD 221
            </button>
            <button id="palette291Btn" class="py-1 rounded-lg font-medium text-center transition text-gray-500 hover:text-gray-900 cursor-pointer">
              MARD 291
            </button>
          </div>

          <!-- 颜色上限限制控制 -->
          <div class="pt-2 space-y-1.5">
            <div class="flex justify-between items-center">
              <span class="text-gray-600">最大用色上限</span>
              <span id="maxColorsVal" class="font-mono font-medium text-gray-900">不限</span>
            </div>
            <div class="grid grid-cols-5 gap-1 text-[10px]">
              <button class="color-limit-btn py-1 rounded border border-apple-blue bg-blue-50 text-apple-blue font-medium" data-val="0">不限</button>
              <button class="color-limit-btn py-1 rounded border border-gray-200 bg-white text-gray-700 hover:bg-gray-50" data-val="16">16色</button>
              <button class="color-limit-btn py-1 rounded border border-gray-200 bg-white text-gray-700 hover:bg-gray-50" data-val="24">24色</button>
              <button class="color-limit-btn py-1 rounded border border-gray-200 bg-white text-gray-700 hover:bg-gray-50" data-val="36">36色</button>
              <button class="color-limit-btn py-1 rounded border border-gray-200 bg-white text-gray-700 hover:bg-gray-50" data-val="48">48色</button>
            </div>
            <div class="flex items-center gap-2 pt-1">
              <input type="range" id="colorLimitSlider" min="2" max="100" value="100" class="flex-1">
              <span class="text-[10px] text-gray-400 font-mono w-7 text-right" id="sliderValDisplay">全</span>
            </div>
          </div>
        </section>

        <!-- 3. 网格尺寸 -->
        <section class="space-y-2 bg-gray-50 p-3 rounded-xl border border-gray-200/60">
          <div class="flex items-center justify-between">
            <span class="font-medium text-gray-800">拼豆网格大小</span>
            <label class="text-[11px] text-gray-600 cursor-pointer flex items-center gap-1.5">
              <input type="checkbox" id="giantToggle" class="rounded border-gray-300 text-apple-blue focus:ring-0">
              <span>超大尺寸</span>
            </label>
          </div>
          <div class="flex justify-between items-center text-[11px]">
            <span class="text-gray-500">网格像素:</span>
            <span id="gridSizeLabel" class="font-mono font-bold text-apple-blue text-sm">52</span>
          </div>
          <input type="range" id="gridSizeSlider" min="20" max="104" step="1" value="52" class="w-full">
          <div class="flex justify-between text-[10px] text-gray-400 font-mono">
            <span id="minGridText">20</span>
            <span id="maxGridText">104</span>
          </div>

          <!-- 起始位置勾选与坐标输入 -->
          <div class="pt-2 border-t border-gray-200/50 space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-[11px] text-gray-700 cursor-pointer flex items-center gap-1.5 font-medium">
                <input type="checkbox" id="offsetToggle" class="rounded border-gray-300 text-apple-blue focus:ring-0">
                <span>图案位置</span>
              </label>
            </div>
            <div id="offsetInputsContainer" class="hidden grid-cols-2 gap-2 text-[11px]">
              <div class="flex items-center gap-1.5 bg-white px-2 py-1.5 rounded-lg border border-gray-200">
                <span class="text-gray-400 font-mono">X:</span>
                <input type="number" id="offsetXInput" value="0" min="0" max="500" class="w-full bg-transparent outline-none font-mono font-semibold text-gray-800">
              </div>
              <div class="flex items-center gap-1.5 bg-white px-2 py-1.5 rounded-lg border border-gray-200">
                <span class="text-gray-400 font-mono">Y:</span>
                <input type="number" id="offsetYInput" value="0" min="0" max="500" class="w-full bg-transparent outline-none font-mono font-semibold text-gray-800">
              </div>
            </div>
          </div>
        </section>

        <!-- 4. 拼板尺寸选择 -->
        <section class="space-y-1.5">
          <label class="font-medium text-gray-800">拼板尺寸</label>
          <div class="grid grid-cols-3 gap-1.5">
            <button class="board-type-btn py-2 px-1 rounded-xl border border-apple-blue bg-blue-50/50 text-apple-blue font-semibold text-center transition cursor-pointer" data-board="52">
              52 钉
            </button>
            <button class="board-type-btn py-2 px-1 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 font-semibold text-center transition cursor-pointer" data-board="78">
              78 钉
            </button>
            <button class="board-type-btn py-2 px-1 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 font-semibold text-center transition cursor-pointer" data-board="104">
              104 钉
            </button>
          </div>
        </section>

        <!-- 手动微调画笔工具 -->
        <section id="manualEditSection" class="space-y-2 bg-gray-50 p-3 rounded-xl border border-gray-200/60 transition-all duration-200">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <span class="font-medium text-gray-800">手动微调画笔</span>
              <span id="editModeIndicator" class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-gray-200 text-gray-600">已锁定</span>
            </div>
            <button id="toggleEditModeBtn" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 transition flex items-center gap-1 cursor-pointer">
              <i class="fa-solid fa-pen-to-square text-[11px]"></i>
              <span id="toggleEditBtnText">开启微调</span>
            </button>
          </div>

          <!-- 工具面板：画笔/橡皮擦/吸管 -->
          <div id="brushToolsPanel" class="space-y-2 opacity-50 pointer-events-none transition-opacity duration-200">
            <div class="flex items-center justify-between pt-1">
              <div class="grid grid-cols-3 gap-1.5 text-xs flex-1 mr-2">
                <button id="toolBrushBtn" class="py-1.5 rounded-lg border border-apple-blue bg-blue-50 text-apple-blue font-medium flex items-center justify-center gap-1.5 transition cursor-pointer">
                  <i class="fa-solid fa-paintbrush text-[11px]"></i>
                  <span>画笔</span>
                </button>
                <button id="toolEraserBtn" class="py-1.5 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 font-medium flex items-center justify-center gap-1.5 transition cursor-pointer">
                  <i class="fa-solid fa-eraser text-[11px]"></i>
                  <span>橡皮擦</span>
                </button>
                <button id="toolEyedropperBtn" class="py-1.5 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 font-medium flex items-center justify-center gap-1.5 transition cursor-pointer">
                  <i class="fa-solid fa-eye-dropper text-[11px]"></i>
                  <span>吸管</span>
                </button>
              </div>
              <button id="undoBtn" class="py-1.5 px-2 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-gray-600 text-xs flex items-center gap-1 cursor-pointer" title="撤销">
                <i class="fa-solid fa-arrow-rotate-left"></i>
              </button>
            </div>
          </div>

          <!-- 当前填色行 -->
          <div class="flex items-center justify-between pt-1 border-t border-gray-200/50">
            <div class="flex items-center gap-2">
              <span class="text-gray-500 text-[11px]">当前填色:</span>
              <button id="openPalettePickerBtn" type="button" title="点击展开完整色库选择任意颜色" 
                      class="flex items-center gap-1.5 px-2 py-1 rounded-lg border border-gray-200 bg-white hover:border-apple-blue hover:bg-blue-50/40 transition cursor-pointer shadow-2xs group">
                <div id="activeBrushSwatch" class="w-5 h-5 rounded-md border border-black/15 shadow-2xs group-hover:scale-105 transition-transform" style="background-color: #000000;"></div>
                <span id="activeBrushId" class="font-mono font-bold text-gray-900 text-xs">H7</span>
                <i class="fa-solid fa-chevron-down text-[9px] text-gray-400 group-hover:text-apple-blue"></i>
              </button>
            </div>

            <div class="relative">
              <button id="replaceColorBtn" class="px-2 py-1 rounded-md border border-gray-200 bg-white hover:bg-gray-50 text-[11px] text-gray-600 hover:text-apple-blue transition flex items-center gap-1 font-medium cursor-pointer" title="将全图中某颜色一键批量替换为当前填色">
                <i class="fa-solid fa-repeat text-[10px]"></i>
                <span>替换全图</span>
              </button>
              <div id="replaceColorDropdown" class="hidden absolute right-0 bottom-full mb-1.5 w-48 rounded-xl bg-white shadow-xl p-2 z-50 border border-apple-border text-xs">
                <div class="flex justify-between items-center pb-1 mb-1 border-b border-gray-100">
                  <span class="text-[10px] text-gray-500">选择要被替换的原色</span>
                  <button id="closeReplaceBtn" class="text-gray-400 hover:text-gray-600 text-xs px-1 cursor-pointer">✕</button>
                </div>
                <div id="replaceColorGrid" class="grid grid-cols-4 gap-1 max-h-36 overflow-y-auto p-0.5"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- 5. 图像算法与底板选项 -->
        <section class="space-y-2 pt-2 border-t border-gray-100">
          <div class="flex items-center justify-between">
            <span class="font-medium text-gray-800">黑色轮廓强制 H7 锁定</span>
            <input type="checkbox" id="h7OutlineLock" checked class="rounded border-gray-300 text-apple-blue focus:ring-0">
          </div>

          <div class="flex items-center justify-between pt-1">
            <span class="text-gray-600">显示底板分区色彩</span>
            <input type="checkbox" id="showPegboardBgToggle" checked class="rounded border-gray-300 text-apple-blue focus:ring-0">
          </div>

          <div class="flex items-center justify-between">
            <span class="text-gray-600">显示豆内色号</span>
            <input type="checkbox" id="showLabelsOnBeadsToggle" checked class="rounded border-gray-300 text-apple-blue focus:ring-0">
          </div>

          <div class="flex items-center justify-between pt-1">
            <span class="text-gray-600">水平镜像翻转 (反面烫平)</span>
            <input type="checkbox" id="mirrorToggle" class="rounded border-gray-300 text-apple-blue focus:ring-0">
          </div>
        </section>

      </div>
    </aside>

    <!-- Canvas Area -->
    <main class="flex-1 flex flex-col h-full bg-[#ECECF0] relative overflow-hidden">
      
      <!-- Top Minimal Stats Pill (支持手机端自适应水平滑动，防挤爆) -->
      <div class="absolute top-2.5 md:top-3.5 left-1/2 -translate-x-1/2 z-20 flex items-center gap-2 px-3 md:px-4 py-1.5 rounded-full glass shadow-xs text-[11px] md:text-xs font-medium text-gray-800 border border-white/60 whitespace-nowrap overflow-x-auto max-w-[95vw] scrollbar-none">
        <span id="patternDimPill" class="font-mono font-semibold text-gray-900 shrink-0">0 × 0</span>
        <span class="text-gray-300">|</span>
        <span id="patternPalettePill" class="shrink-0">Mard-221</span>
        <span class="text-gray-300">|</span>
        <span id="boardPlanPill" class="text-apple-blue font-semibold shrink-0">1 块板</span>
        <span class="text-gray-300">|</span>
        <span id="patternTotalPill" class="font-mono shrink-0">0 颗豆子</span>
        <span class="text-gray-300">|</span>
        <span id="physicalSizePill" class="font-mono text-gray-600 shrink-0 cursor-pointer hover:text-apple-blue transition" title="点击可在 2.6mm 迷你豆 与 5.0mm 标准豆 之间切换换算">2.6mm: 0×0cm (约0g)</span>
      </div>

      <!-- Viewport Navigation Floating Buttons -->
      <div class="absolute bottom-3 md:bottom-4 right-3 md:right-4 z-20 flex flex-col gap-1 bg-white p-1 rounded-xl shadow-sm border border-gray-200">
        <button id="zoomInBtn" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-700 transition" title="放大">
          <i class="fa-solid fa-plus text-xs"></i>
        </button>
        <button id="zoomOutBtn" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-700 transition" title="缩小">
          <i class="fa-solid fa-minus text-xs"></i>
        </button>
        <button id="fitViewBtn" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-700 transition" title="自适应">
          <i class="fa-solid fa-expand text-xs"></i>
        </button>
      </div>

      <!-- Canvas -->
      <div id="viewport" class="flex-1 w-full h-full relative cursor-grab active:cursor-grabbing overflow-hidden">
        <canvas id="beadCanvas" class="absolute top-0 left-0"></canvas>
      </div>

      <!-- Bottom Material Drawer (深度优化：文字绝不挤压折叠，响应式断点自适应) -->
      <div id="materialDrawer" class="h-24 md:h-26 bg-white border-t border-apple-border shrink-0 flex flex-col px-3 md:px-4 py-1.5 md:py-2 relative z-20">
        <div class="flex items-center justify-between pb-1 border-b border-gray-100 overflow-x-auto scrollbar-none gap-2">
          <!-- 左侧用料统计 (加 whitespace-nowrap 与 shrink-0 绝不被压缩) -->
          <div class="flex items-center gap-1.5 shrink-0 whitespace-nowrap">
            <span class="text-[11px] md:text-xs font-semibold text-gray-800">用料清单</span>
            <span id="materialCountLabel" class="text-[10px] text-gray-500 font-mono">0 种用色</span>
          </div>

          <!-- 右侧操作组 (加 shrink-0 绝不换行断裂) -->
          <div class="flex items-center gap-1.5 md:gap-2 text-[11px] shrink-0 whitespace-nowrap">
            <span class="text-gray-400 text-[10px] hidden sm:inline">排序:</span>
            <div class="flex bg-gray-100 p-0.5 rounded-lg border border-gray-200/60 shrink-0">
              <button id="sortQtyBtn" class="px-2 py-0.5 rounded-md font-medium text-[10px] transition bg-white text-gray-900 shadow-2xs cursor-pointer">按用量</button>
              <button id="sortSeriesBtn" class="px-2 py-0.5 rounded-md font-medium text-[10px] transition text-gray-500 hover:text-gray-800 cursor-pointer">按系列</button>
            </div>
            
            <span class="text-gray-300 mx-0.5">|</span>

            <!-- 一键复制采购单 -->
            <button id="copyPurchaseBtn" class="px-2 md:px-2.5 py-1 rounded-lg font-medium text-[10px] bg-apple-blue hover:bg-apple-hoverBlue text-white transition flex items-center gap-1 shadow-2xs active:scale-95 cursor-pointer shrink-0">
              <i class="fa-regular fa-copy"></i>
              <span>复制采购单</span>
            </button>

            <span class="text-gray-300 mx-0.5 hidden lg:inline">|</span>
            <span class="text-[10px] text-gray-400 hidden lg:inline">点击色块可单独高亮</span>
          </div>
        </div>
        <div id="materialList" class="flex-1 flex items-center gap-2 overflow-x-auto py-1 scrollbar-none"></div>
      </div>

    </main>
  </div>

  <div id="toast" class="fixed bottom-24 md:bottom-28 left-1/2 -translate-x-1/2 z-50 glass border border-white px-3.5 py-1.5 rounded-full shadow-md text-xs text-gray-800 transition-all duration-200 opacity-0 pointer-events-none translate-y-2"></div>

  <!-- 全局居中全量色库选色弹窗（Fixed Modal：在手机、平板、电脑均完美居中显示） -->
  <div id="fullPalettePickerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-xs p-3 md:p-4">
    <div class="w-88 max-w-[95vw] bg-white rounded-2xl shadow-2xl p-4 border border-apple-border flex flex-col max-h-[85vh]">
      <div class="flex items-center justify-between pb-2 mb-2 border-b border-gray-100 shrink-0">
        <span class="font-bold text-gray-800 text-sm flex items-center gap-2">
          <i class="fa-solid fa-palette text-apple-blue"></i>
          <span>挑选画笔颜色</span>
        </span>
        <button id="closePalettePickerBtn" type="button" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition cursor-pointer text-sm font-semibold">✕</button>
      </div>
      
      <!-- 搜索输入框与系列分类横条 -->
      <div class="space-y-2 mb-2 shrink-0">
        <input type="text" id="paletteSearchInput" placeholder="输入色号搜索 (如 A13, H7, F5...)" 
               class="w-full px-3 py-1.5 text-xs bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-apple-blue font-mono">
        <div id="paletteSeriesTags" class="flex items-center gap-1.5 overflow-x-auto pb-1 text-[11px] scrollbar-none"></div>
      </div>

      <!-- 颜色卡矩阵滚动区 -->
      <div id="fullPaletteGrid" class="flex-1 grid grid-cols-5 gap-1.5 overflow-y-auto p-1 min-h-[180px]"></div>
    </div>
  </div>

  <canvas id="offscreenCanvas" class="hidden"></canvas>
  <canvas id="exportCanvas" class="hidden"></canvas>

  <!-- 引入脚本 -->
  <script src="palette.js"></script>
  <script src="app.js"></script>
</body>
</html>
