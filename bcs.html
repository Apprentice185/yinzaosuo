                      </div>
                    </div>
                  `}
                </div>

                <!-- 字体、字重、字号、间距与坐标参数（默认折叠） -->
                <div class="border border-apple-border/80 rounded-xl bg-gray-50/40 overflow-hidden">
                  <button type="button" onclick="toggleTextStyleCollapse('${layer.id}')"
                    class="w-full px-3 py-2 flex items-center justify-between text-left hover:bg-gray-100/70 transition cursor-pointer">
                    <div class="flex items-center gap-1.5">
                      <i data-lucide="${isStyleCollapsed ? 'chevron-right' : 'chevron-down'}" class="w-3.5 h-3.5 text-apple-subtext"></i>
                      <span class="text-xs font-medium text-apple-text">字体与位置参数</span>
                    </div>
                    <span class="text-[11px] font-mono text-apple-subtext truncate max-w-[200px]">${escapeHtml(styleSummary)}</span>
                  </button>

                  <div class="${isStyleCollapsed ? 'hidden' : 'p-3 pt-2 border-t border-apple-border/60 space-y-2.5 bg-white'}">
                    <!-- 字体与字重 -->
                    <div class="grid grid-cols-12 gap-2">
                      <div class="col-span-7">
                        <label class="block text-[11px] text-apple-subtext mb-1">字体选择</label>
                        <select onchange="updateLayerProp('${layer.id}', 'fontFamily', this.value, false, true)"
                          class="w-full px-2 py-1.5 text-xs bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue">
                          ${FONT_OPTIONS.map(f => `<option value='${f.value}' ${layer.fontFamily === f.value ? 'selected' : ''}>${f.label}</option>`).join('')}
                        </select>
                      </div>
                      <div class="col-span-5">
                        <label class="block text-[11px] text-apple-subtext mb-1">字重</label>
                        <select onchange="updateLayerProp('${layer.id}', 'fontWeight', this.value, false, true)"
                          class="w-full px-2 py-1.5 text-xs bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue">
                          ${FONT_WEIGHTS.map(w => `<option value="${w.value}" ${layer.fontWeight === w.value ? 'selected' : ''}>${w.label}</option>`).join('')}
                        </select>
                      </div>
                    </div>

                    <!-- 自定义本地字体名称（可选） -->
                    <div>
                      <input type="text" value="${escapeHtml(layer.customFont)}" placeholder="可选：输入本机系统字体精确名称"
                        onchange="updateLayerProp('${layer.id}', 'customFont', this.value, false, true)"
                        class="w-full px-2.5 py-1 text-xs bg-gray-50/50 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                    </div>

                    <!-- 大小、字间距、行间距 -->
                    <div class="grid grid-cols-3 gap-2">
                      <div>
                        <label class="block text-[11px] text-apple-subtext mb-1">字号 (${u})</label>
                        <input type="number" step="any" min="0.5" id="input_fontSize_${layer.id}" value="${formatDisplayNum(layer.fontSizeMm, u)}"
                          onchange="updateLayerProp('${layer.id}', 'fontSizeMm', Math.max(0.5, fromDisplayUnit(this.value)), false, true)"
                          class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                      </div>
                      <div>
                        <label class="block text-[11px] text-apple-subtext mb-1">字间距 (${u})</label>
                        <input type="number" step="any" value="${formatDisplayNum(layer.letterSpacingMm, u)}"
                          onchange="updateLayerProp('${layer.id}', 'letterSpacingMm', this.value, true)"
                          class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                      </div>
                      <div>
                        <label class="block text-[11px] text-apple-subtext mb-1">行间距 (倍)</label>
                        <input type="number" step="0.05" min="0.5" max="5" value="${layer.lineHeightRatio}"
                          onchange="updateLayerProp('${layer.id}', 'lineHeightRatio', parseFloat(this.value) || 1.2)"
                          class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                      </div>
                    </div>

                    <!-- 位置 X, Y -->
                    <div class="grid grid-cols-2 gap-2">
                      <div>
                        <label class="block text-[11px] text-apple-subtext mb-1">X 坐标 (${u})</label>
                        <input type="number" step="any" id="input_x_${layer.id}" value="${formatDisplayNum(layer.xMm, u)}"
                          onchange="updateLayerProp('${layer.id}', 'xMm', this.value, true, true)"
                          class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                      </div>
                      <div>
                        <label class="block text-[11px] text-apple-subtext mb-1">Y 坐标 (${u})</label>
                        <input type="number" step="any" id="input_y_${layer.id}" value="${formatDisplayNum(layer.yMm, u)}"
                          onchange="updateLayerProp('${layer.id}', 'yMm', this.value, true, true)"
                          class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 基准点（左 / 中 / 右） -->
                <div class="bg-gray-50/80 rounded-xl p-2 border border-apple-border/80 space-y-1.5">
                  <div class="flex items-center justify-between">
                    <span class="text-[11px] font-medium text-apple-text">基准点（对齐方式）</span>
                    <span class="text-[10px] text-apple-subtext">
                      ${anchor === 'left' ? '向右延伸' : (anchor === 'center' ? '向两侧均匀延伸' : '向左延伸')}
                    </span>
                  </div>
                  <div class="grid grid-cols-3 bg-gray-200/70 p-0.5 rounded-lg gap-1">
                    <button type="button" onclick="setTextAnchor('${layer.id}', 'left')"
                      class="py-1.5 text-xs font-medium rounded-md flex items-center justify-center gap-1.5 transition cursor-pointer ${anchor === 'left' ? 'bg-apple-blue text-white shadow-xs' : 'text-apple-text hover:bg-white/70'}">
                      <i data-lucide="align-left" class="w-3.5 h-3.5"></i>
                      <span>左</span>
                    </button>
                    <button type="button" onclick="setTextAnchor('${layer.id}', 'center')"
                      class="py-1.5 text-xs font-medium rounded-md flex items-center justify-center gap-1.5 transition cursor-pointer ${anchor === 'center' ? 'bg-apple-blue text-white shadow-xs' : 'text-apple-text hover:bg-white/70'}">
                      <i data-lucide="align-center" class="w-3.5 h-3.5"></i>
                      <span>中</span>
                    </button>
                    <button type="button" onclick="setTextAnchor('${layer.id}', 'right')"
                      class="py-1.5 text-xs font-medium rounded-md flex items-center justify-center gap-1.5 transition cursor-pointer ${anchor === 'right' ? 'bg-apple-blue text-white shadow-xs' : 'text-apple-text hover:bg-white/70'}">
                      <i data-lucide="align-right" class="w-3.5 h-3.5"></i>
                      <span>右</span>
                    </button>
                  </div>
                </div>

                <!-- 限制文字对象宽高（拉伸适配） -->
                <div class="pt-1 border-t border-gray-100">
                  <label class="inline-flex items-center gap-2 text-xs font-medium text-apple-text cursor-pointer">
                    <input type="checkbox" ${layer.constrainBox ? 'checked' : ''}
                      onchange="updateLayerProp('${layer.id}', 'constrainBox', this.checked, false, true)"
                      class="rounded border-gray-300 text-apple-blue focus:ring-apple-blue" />
                    <span>限制文字对象宽高（自动拉伸适应尺寸）</span>
                  </label>
                  ${layer.constrainBox ? `
                    <div class="grid grid-cols-2 gap-2 mt-2 pl-5">
                      <div>
                        <label class="block text-[11px] text-apple-subtext mb-0.5">限定宽度 (${u})</label>
                        <input type="number" step="any" min="1" id="input_boxW_${layer.id}" value="${formatDisplayNum(layer.boxWidthMm, u)}"
                          onchange="updateLayerProp('${layer.id}', 'boxWidthMm', this.value, true)"
                          class="w-full px-2 py-1 text-xs font-mono bg-blue-50/40 border border-blue-200 rounded-lg focus:outline-none focus:border-apple-blue" />
                      </div>
                      <div>
                        <label class="block text-[11px] text-apple-subtext mb-0.5">限定高度 (${u})</label>
                        <input type="number" step="any" min="1" id="input_boxH_${layer.id}" value="${formatDisplayNum(layer.boxHeightMm, u)}"
                          onchange="updateLayerProp('${layer.id}', 'boxHeightMm', this.value, true)"
                          class="w-full px-2 py-1 text-xs font-mono bg-blue-50/40 border border-blue-200 rounded-lg focus:outline-none focus:border-apple-blue" />
                      </div>
                    </div>
                  ` : ''}
                </div>

                <!-- 文字颜色（单行可折叠色板） -->
                <div class="pt-1.5 border-t border-gray-100">
                  ${renderCompactColorPalette({
                    paletteId: `text_color_${layer.id}`,
                    label: '文字颜色',
                    currentColor: layer.color,
                    onChangeExpr: `updateLayerProp('${layer.id}', 'color', '__COLOR__', false, true)`
                  })}
                </div>

                ${renderTransformControls(layer)}
              </div>
            </div>
          `;
        }

        // 2. 图片图层
        if (layer.type === 'image') {
          const tag = layer.useVariable ? `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-emerald-100/80 text-emerald-700 shrink-0">图库 (${layer.variableImages.length})</span>` : '';
          return `
            <div onclick="selectLayer('${layer.id}', event.shiftKey)" class="bg-apple-card rounded-2xl border ${borderClass} shadow-2xs transition-all overflow-hidden">
              ${renderHeader('image', 'bg-emerald-50', 'text-emerald-600', tag)}
              <div onclick="event.stopPropagation()" class="${layer.collapsed ? 'hidden' : 'p-3.5 space-y-3'}">
                <div class="flex items-center justify-between">
                  <label class="text-xs font-medium text-apple-subtext">图片来源模式</label>
                  <label class="inline-flex items-center gap-1.5 text-xs font-medium text-emerald-600 cursor-pointer">
                    <input type="checkbox" ${layer.useVariable ? 'checked' : ''}
                      onchange="updateLayerProp('${layer.id}', 'useVariable', this.checked, false, true)"
                      class="rounded border-gray-300 text-emerald-600 focus:ring-emerald-600" />
                    <span>启用变量（批量多图）</span>
                  </label>
                </div>

                ${!layer.useVariable ? `
                  <div class="flex items-center gap-3 p-2.5 bg-gray-50/80 border border-dashed border-apple-border rounded-xl">
                    ${layer.singleImage ? `
                      <img src="${layer.singleImage.src}" class="w-12 h-12 object-contain rounded-lg bg-white border border-apple-border shrink-0" />
                    ` : `
                      <div class="w-12 h-12 rounded-lg bg-white border border-apple-border flex items-center justify-center text-apple-subtext shrink-0">
                        <i data-lucide="image" class="w-5 h-5"></i>
                      </div>
                    `}
                    <div class="flex-1 min-w-0">
                      <p class="text-xs font-medium text-apple-text truncate">${layer.singleImage ? escapeHtml(layer.singleImage.name) : '未选择图片'}</p>
                      <label class="mt-1 inline-flex items-center gap-1 px-2.5 py-1 bg-white border border-apple-border rounded-lg text-xs font-medium text-apple-text hover:bg-gray-50 cursor-pointer shadow-2xs">
                        <span>选择单张图片</span>
                        <input type="file" accept="image/*" class="hidden" onchange="handleSingleImageUpload('${layer.id}', this)" />
                      </label>
                    </div>
                  </div>
                ` : `
                  <div class="bg-gray-50/90 border border-apple-border rounded-xl p-2.5 space-y-2">
                    <div class="grid grid-cols-2 gap-2">
                      <label class="flex items-center justify-center gap-1.5 py-1.5 px-2 bg-white border border-apple-border rounded-lg text-xs font-medium text-apple-text hover:bg-emerald-50/50 hover:border-emerald-300 cursor-pointer transition shadow-2xs">
                        <i data-lucide="files" class="w-3.5 h-3.5 text-emerald-600"></i>
                        <span>选择多张图片</span>
                        <input type="file" accept="image/*" multiple class="hidden" onchange="handleBatchImagesUpload('${layer.id}', this)" />
                      </label>
                      <label class="flex items-center justify-center gap-1.5 py-1.5 px-2 bg-white border border-apple-border rounded-lg text-xs font-medium text-apple-text hover:bg-emerald-50/50 hover:border-emerald-300 cursor-pointer transition shadow-2xs">
                        <i data-lucide="folder-open" class="w-3.5 h-3.5 text-emerald-600"></i>
                        <span>选择整个文件夹</span>
                        <input type="file" accept="image/*" webkitdirectory directory multiple class="hidden" onchange="handleBatchImagesUpload('${layer.id}', this)" />
                      </label>
                    </div>
                    ${layer.variableImages.length > 0 ? `
                      <div class="max-h-40 overflow-y-auto border border-apple-border rounded-lg bg-white divide-y divide-gray-100">
                        ${layer.variableImages.map((imgItem, imgIdx) => `
                          <div class="flex items-center gap-2 px-2 py-1 text-xs">
                            <span class="w-6 font-mono text-[11px] text-apple-subtext text-center shrink-0">${imgIdx + 1}</span>
                            <img src="${imgItem.src}" class="w-6 h-6 object-cover rounded border border-gray-200 shrink-0" />
                            <span class="flex-1 truncate text-apple-text">${escapeHtml(imgItem.name)}</span>
                            <button type="button" onclick="removeVariableImageItem('${layer.id}', ${imgIdx})" class="text-gray-400 hover:text-red-500 p-0.5 cursor-pointer">
                              <i data-lucide="x" class="w-3 h-3"></i>
                            </button>
                          </div>
                        `).join('')}
                      </div>
                    ` : `<p class="text-[11px] text-center text-apple-subtext py-2">上传多文件或文件夹后自动按文件名创建变量表</p>`}
                  </div>
                `}

                <!-- 图片尺寸设置 -->
                <div class="space-y-1.5">
                  <div class="flex items-center justify-between">
                    <span class="text-[11px] font-medium text-apple-subtext">图片尺寸</span>
                    <label class="inline-flex items-center gap-1 text-[11px] text-apple-subtext cursor-pointer">
                      <input type="checkbox" ${layer.lockAspectRatio ? 'checked' : ''}
                        onchange="updateLayerProp('${layer.id}', 'lockAspectRatio', this.checked)"
                        class="rounded border-gray-300 text-apple-blue focus:ring-apple-blue" />
                      <span>锁定宽高比</span>
                    </label>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-[11px] text-apple-subtext mb-1">宽度 (${u})</label>
                      <input type="number" step="any" min="0.5" id="input_w_${layer.id}" value="${formatDisplayNum(layer.widthMm, u)}"
                        onchange="updateLayerProp('${layer.id}', 'widthMm', this.value, true)"
                        class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                    </div>
                    <div>
                      <label class="block text-[11px] text-apple-subtext mb-1">高度 (${u})</label>
                      <input type="number" step="any" min="0.5" id="input_h_${layer.id}" value="${formatDisplayNum(layer.heightMm, u)}"
                        onchange="updateLayerProp('${layer.id}', 'heightMm', this.value, true)"
                        class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                    </div>
                  </div>
                </div>

                <!-- 图片位置设置 -->
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="block text-[11px] text-apple-subtext mb-1">X 坐标 (${u})</label>
                    <input type="number" step="any" id="input_x_${layer.id}" value="${formatDisplayNum(layer.xMm, u)}"
                      onchange="updateLayerProp('${layer.id}', 'xMm', this.value, true)"
                      class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                  </div>
                  <div>
                    <label class="block text-[11px] text-apple-subtext mb-1">Y 坐标 (${u})</label>
                    <input type="number" step="any" id="input_y_${layer.id}" value="${formatDisplayNum(layer.yMm, u)}"
                      onchange="updateLayerProp('${layer.id}', 'yMm', this.value, true)"
                      class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                  </div>
                </div>

                ${renderTransformControls(layer)}
              </div>
            </div>
          `;
        }

        // 3. 几何形状图层（矩形 rect / 椭圆形 ellipse / 直线 line）
        const shapeMeta = {
          rect: { icon: 'square', bg: 'bg-amber-50', color: 'text-amber-600' },
          ellipse: { icon: 'circle', bg: 'bg-purple-50', color: 'text-purple-600' },
          line: { icon: 'minus', bg: 'bg-rose-50', color: 'text-rose-600' }
        }[layer.type];

        return `
          <div onclick="selectLayer('${layer.id}', event.shiftKey)" class="bg-apple-card rounded-2xl border ${borderClass} shadow-2xs transition-all overflow-hidden">
            ${renderHeader(shapeMeta.icon, shapeMeta.bg, shapeMeta.color)}
            <div onclick="event.stopPropagation()" class="${layer.collapsed ? 'hidden' : 'p-3.5 space-y-3'}">
              <!-- 尺寸与坐标 -->
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[11px] text-apple-subtext mb-1">${layer.type === 'line' ? `水平跨度 ΔX (${u})` : `宽度 W (${u})`}</label>
                  <input type="number" step="any" id="input_w_${layer.id}" value="${formatDisplayNum(layer.widthMm, u)}"
                    onchange="updateLayerProp('${layer.id}', 'widthMm', this.value, true)"
                    class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                </div>
                <div>
                  <label class="block text-[11px] text-apple-subtext mb-1">${layer.type === 'line' ? `垂直跨度 ΔY (${u})` : `高度 H (${u})`}</label>
                  <input type="number" step="any" id="input_h_${layer.id}" value="${formatDisplayNum(layer.heightMm, u)}"
                    onchange="updateLayerProp('${layer.id}', 'heightMm', this.value, true)"
                    class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                </div>
              </div>

              ${layer.type === 'rect' ? `
                <div>
                  <label class="block text-[11px] text-apple-subtext mb-1">圆角半径 (${u})</label>
                  <input type="number" step="any" min="0" id="input_radius_${layer.id}" value="${formatDisplayNum(layer.borderRadiusMm || 0, u)}"
                    onchange="updateLayerProp('${layer.id}', 'borderRadiusMm', Math.max(0, fromDisplayUnit(this.value)), false, true)"
                    class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                </div>
              ` : ''}

              ${layer.type === 'line' ? `
                <div>
                  <label class="block text-[11px] text-apple-subtext mb-1">对角方向</label>
                  <select onchange="updateLayerProp('${layer.id}', 'lineDirection', this.value, false, true)"
                    class="w-full px-2 py-1 text-xs bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue">
                    <option value="tl-br" ${layer.lineDirection !== 'bl-tr' ? 'selected' : ''}>左上 → 右下 (或水平/垂直)</option>
                    <option value="bl-tr" ${layer.lineDirection === 'bl-tr' ? 'selected' : ''}>左下 → 右上</option>
                  </select>
                </div>
              ` : ''}

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[11px] text-apple-subtext mb-1">X 坐标 (${u})</label>
                  <input type="number" step="any" id="input_x_${layer.id}" value="${formatDisplayNum(layer.xMm, u)}"
                    onchange="updateLayerProp('${layer.id}', 'xMm', this.value, true)"
                    class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                </div>
                <div>
                  <label class="block text-[11px] text-apple-subtext mb-1">Y 坐标 (${u})</label>
                  <input type="number" step="any" id="input_y_${layer.id}" value="${formatDisplayNum(layer.yMm, u)}"
                    onchange="updateLayerProp('${layer.id}', 'yMm', this.value, true)"
                    class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                </div>
              </div>

              <!-- 填充颜色（非直线显示，单行可折叠色板） -->
              ${layer.type !== 'line' ? `
                <div class="pt-1.5 border-t border-gray-100">
                  ${renderCompactColorPalette({
                    paletteId: `fill_color_${layer.id}`,
                    label: '填充颜色',
                    currentColor: layer.fillColor,
                    allowTransparent: true,
                    isTransparent: !!layer.fillTransparent,
                    onToggleTransparentExpr: `updateLayerProp('${layer.id}', 'fillTransparent', ${!layer.fillTransparent}, false, true)`,
                    onChangeExpr: `updateLayerProp('${layer.id}', 'fillTransparent', false); updateLayerProp('${layer.id}', 'fillColor', '__COLOR__', false, true)`
                  })}
                </div>
              ` : ''}

              <!-- 描边粗细、虚线设置与描边颜色 -->
              <div class="pt-1.5 border-t border-gray-100 space-y-2.5">
                <div class="grid grid-cols-12 gap-2 items-end">
                  <div class="col-span-6">
                    <label class="block text-[11px] text-apple-subtext mb-1">描边大小 (${u})</label>
                    <input type="number" step="any" min="0" value="${formatDisplayNum(layer.strokeWidthMm, u)}"
                      onchange="updateLayerProp('${layer.id}', 'strokeWidthMm', Math.max(0, fromDisplayUnit(this.value)))"
                      class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                  </div>
                  <div class="col-span-6 pb-1">
                    <label class="inline-flex items-center gap-1.5 text-xs font-medium text-apple-text cursor-pointer">
                      <input type="checkbox" ${layer.strokeDashed ? 'checked' : ''}
                        onchange="updateLayerProp('${layer.id}', 'strokeDashed', this.checked, false, true)"
                        class="rounded border-gray-300 text-apple-blue focus:ring-apple-blue" />
                      <span>启用虚线描边</span>
                    </label>
                  </div>
                </div>

                ${layer.strokeDashed ? `
                  <div class="grid grid-cols-2 gap-2 bg-gray-50/80 p-2 rounded-lg border border-apple-border/70">
                    <div>
                      <label class="block text-[11px] text-apple-subtext mb-0.5">虚线段长 (${u})</label>
                      <input type="number" step="any" min="0.1" value="${formatDisplayNum(layer.dashLengthMm, u)}"
                        onchange="updateLayerProp('${layer.id}', 'dashLengthMm', Math.max(0.1, fromDisplayUnit(this.value)))"
                        class="w-full px-2 py-1 text-xs font-mono bg-white border border-apple-border rounded-md focus:outline-none focus:border-apple-blue" />
                    </div>
                    <div>
                      <label class="block text-[11px] text-apple-subtext mb-0.5">虚线间隙 (${u})</label>
                      <input type="number" step="any" min="0.1" value="${formatDisplayNum(layer.dashGapMm, u)}"
                        onchange="updateLayerProp('${layer.id}', 'dashGapMm', Math.max(0.1, fromDisplayUnit(this.value)))"
                        class="w-full px-2 py-1 text-xs font-mono bg-white border border-apple-border rounded-md focus:outline-none focus:border-apple-blue" />
                    </div>
                  </div>
                ` : ''}

                <!-- 描边颜色（单行可折叠色板） -->
                ${renderCompactColorPalette({
                  paletteId: `stroke_color_${layer.id}`,
                  label: '描边颜色',
                  currentColor: layer.strokeColor,
                  onChangeExpr: `updateLayerProp('${layer.id}', 'strokeColor', '__COLOR__', false, true)`
                })}
              </div>

              ${renderTransformControls(layer)}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // =========================================================================
    // 9. 变量分页计算与翻页控制
    // =========================================================================
    function getTotalPages() {
      let maxCount = 1;
      for (const layer of state.layers) {
        if (layer.type === 'text' && layer.useVariable) {
          const validVars = layer.variables.filter((v, i) => !(layer.variables.length === 1 && v === '' && i === 0));
          maxCount = Math.max(maxCount, validVars.length || 1);
        } else if (layer.type === 'image' && layer.useVariable) {
          maxCount = Math.max(maxCount, layer.variableImages.length || 1);
        }
      }
      return maxCount;
    }

    function updatePaginationState() {
      const total = getTotalPages();
      if (state.currentPage > total) state.currentPage = total;
      if (state.currentPage < 1) state.currentPage = 1;

      document.getElementById('totalPagesLabel').textContent = total;
      document.getElementById('pageJumpInput').value = state.currentPage;
      document.getElementById('pageJumpInput').max = total;
      document.getElementById('btnPrevPage').disabled = state.currentPage <= 1;
      document.getElementById('btnNextPage').disabled = state.currentPage >= total;
    }

    function changePage(delta) {
      const total = getTotalPages();
      state.currentPage = Math.min(total, Math.max(1, state.currentPage + delta));
      updatePaginationState();
      renderPreview();
    }

    function jumpToPage(val) {
      const total = getTotalPages();
      const num = parseInt(val, 10) || 1;
      state.currentPage = Math.min(total, Math.max(1, num));
      updatePaginationState();
      renderPreview();
    }

    // =========================================================================
    // 10. 核心排版渲染引擎（预览 + 600 PPI 高清导出复用）
    // =========================================================================
    function getActiveTextForLayer(layer, pageIndex) {
      if (!layer.useVariable) return layer.text;
      if (!layer.variables || layer.variables.length === 0) return '';
      const idx = Math.min(pageIndex - 1, layer.variables.length - 1);
      return layer.variables[idx] ?? '';
    }

    function getActiveImageForLayer(layer, pageIndex) {
      if (!layer.useVariable) return layer.singleImage;
      if (!layer.variableImages || layer.variableImages.length === 0) return null;
      const idx = Math.min(pageIndex - 1, layer.variableImages.length - 1);
      return layer.variableImages[idx] ?? null;
    }

    function drawRoundedRectPath(ctx, x, y, w, h, r) {
      const radius = Math.max(0, Math.min(r || 0, Math.min(w, h) / 2));
      ctx.beginPath();
      if (radius <= 0) {
        ctx.rect(x, y, w, h);
        return;
      }
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.arcTo(x + w, y, x + w, y + radius, radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.arcTo(x + w, y + h, x + w - radius, y + h, radius);
      ctx.lineTo(x + radius, y + h);
      ctx.arcTo(x, y + h, x, y + h - radius, radius);
      ctx.lineTo(x, y + radius);
      ctx.arcTo(x, y, x + radius, y, radius);
      ctx.closePath();
    }

    function renderDesignToCanvas(canvas, pageIndex, options = {}) {
      const { isPreview = false, pixelWidth, pixelHeight } = options;
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;

      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      const scaleX = pixelWidth / mmToPx(state.canvasWidthMm);
      const scaleY = pixelHeight / mmToPx(state.canvasHeightMm);

      // 1. 绘制画布背景底色
      ctx.fillStyle = state.canvasBgColor;
      ctx.fillRect(0, 0, pixelWidth, pixelHeight);

      // 2. 绘制参考背景图（辅助对齐，导出时可自动隐藏）
      if (state.refBgImageObj && (isPreview || !state.refBgExcludeFromExport)) {
        ctx.save();
        ctx.globalAlpha = state.refBgOpacity;
        ctx.drawImage(state.refBgImageObj, 0, 0, pixelWidth, pixelHeight);
        ctx.restore();
      }

      // 3. 预览模式辅助网格
      if (isPreview && document.getElementById('showRulerCheck')?.checked) {
        ctx.save();
        ctx.strokeStyle = 'rgba(0, 113, 227, 0.08)';
        ctx.lineWidth = 1;
        const stepPx = mmToPx(10) * scaleX;
        if (stepPx >= 8) {
          for (let gx = stepPx; gx < pixelWidth; gx += stepPx) {
            ctx.beginPath();
            ctx.moveTo(gx, 0);
            ctx.lineTo(gx, pixelHeight);
            ctx.stroke();
          }
          for (let gy = stepPx; gy < pixelHeight; gy += stepPx) {
            ctx.beginPath();
            ctx.moveTo(0, gy);
            ctx.lineTo(pixelWidth, gy);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      // 清空并重新记录当前帧元素包围盒
      if (isPreview) {
        for (const k in computedBoundsMap) delete computedBoundsMap[k];
      }

      // 4. 逐层渲染内容元素
      for (const layer of state.layers) {
        ctx.save();
        let boundsMm = { xMm: layer.xMm, yMm: layer.yMm, wMm: 10, hMm: 10 };

        // 预先计算当前图层包围盒以应用旋转与镜像变换
        if (layer.type === 'image' || layer.type === 'rect' || layer.type === 'ellipse' || layer.type === 'line') {
          boundsMm = { xMm: layer.xMm, yMm: layer.yMm, wMm: layer.widthMm, hMm: layer.heightMm };
        } else if (layer.type === 'text') {
          const content = getActiveTextForLayer(layer, pageIndex);
          const anchor = layer.anchor || 'left';
          const fontStack = layer.customFont && layer.customFont.trim()
            ? `"${layer.customFont.trim()}", ${layer.fontFamily}`
            : layer.fontFamily;
          const natDims = measureTextDimensionsMm(content, layer.fontSizeMm, layer.letterSpacingMm || 0, layer.lineHeightRatio || 1.2, layer.fontWeight, fontStack);
          const targetWMm = layer.constrainBox ? layer.boxWidthMm : natDims.widthMm;
          const targetHMm = layer.constrainBox ? layer.boxHeightMm : natDims.heightMm;
          let boxLeftMm = layer.xMm;
          if (anchor === 'center') boxLeftMm = layer.xMm - targetWMm / 2;
          else if (anchor === 'right') boxLeftMm = layer.xMm - targetWMm;
          boundsMm = { xMm: boxLeftMm, yMm: layer.yMm, wMm: targetWMm, hMm: targetHMm };
        }

        const rotDeg = Number(layer.rotation || 0);
        const flipX = !!layer.flipX;
        const flipY = !!layer.flipY;
        if (rotDeg !== 0 || flipX || flipY) {
          const cxPx = mmToPx(boundsMm.xMm + boundsMm.wMm / 2) * scaleX;
          const cyPx = mmToPx(boundsMm.yMm + boundsMm.hMm / 2) * scaleY;
          ctx.translate(cxPx, cyPx);
          if (rotDeg !== 0) ctx.rotate((rotDeg * Math.PI) / 180);
          if (flipX || flipY) ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
          ctx.translate(-cxPx, -cyPx);
        }

        if (layer.type === 'image') {
          const x = mmToPx(layer.xMm) * scaleX;
          const y = mmToPx(layer.yMm) * scaleY;
          const w = mmToPx(layer.widthMm) * scaleX;
          const h = mmToPx(layer.heightMm) * scaleY;

          const imgData = getActiveImageForLayer(layer, pageIndex);
          if (imgData && imgData.imgElement) {
            ctx.drawImage(imgData.imgElement, x, y, w, h);
          } else if (isPreview) {
            ctx.fillStyle = 'rgba(16, 185, 129, 0.08)';
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.5)';
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(x, y, w, h);
            ctx.setLineDash([]);
            ctx.fillStyle = '#059669';
            ctx.font = `${Math.max(11, 12 * scaleX)}px Inter, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('图片占位区', x + w / 2, y + h / 2);
          }
        } else if (layer.type === 'rect' || layer.type === 'ellipse' || layer.type === 'line') {
          const x = mmToPx(layer.xMm) * scaleX;
          const y = mmToPx(layer.yMm) * scaleY;
          const w = mmToPx(layer.widthMm) * scaleX;
          const h = mmToPx(layer.heightMm) * scaleY;
          const strokeW = mmToPx(layer.strokeWidthMm) * scaleX;

          if (layer.strokeDashed) {
            const dLen = Math.max(1, mmToPx(layer.dashLengthMm) * scaleX);
            const dGap = Math.max(1, mmToPx(layer.dashGapMm) * scaleX);
            ctx.setLineDash([dLen, dGap]);
          } else {
            ctx.setLineDash([]);
          }

          ctx.lineWidth = strokeW;
          ctx.strokeStyle = layer.strokeColor;
          ctx.fillStyle = layer.fillColor;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          if (layer.type === 'rect') {
            const radiusPx = mmToPx(layer.borderRadiusMm || 0) * scaleX;
            drawRoundedRectPath(ctx, x, y, w, h, radiusPx);
            if (!layer.fillTransparent) ctx.fill();
            if (strokeW > 0) ctx.stroke();
          } else if (layer.type === 'ellipse') {
            ctx.beginPath();
            ctx.ellipse(x + w / 2, y + h / 2, Math.abs(w) / 2, Math.abs(h) / 2, 0, 0, Math.PI * 2);
            if (!layer.fillTransparent) ctx.fill();
            if (strokeW > 0) ctx.stroke();
          } else if (layer.type === 'line') {
            ctx.beginPath();
            if (layer.lineDirection === 'bl-tr') {
              ctx.moveTo(x, y + h);
              ctx.lineTo(x + w, y);
            } else {
              ctx.moveTo(x, y);
              ctx.lineTo(x + w, y + h);
            }
            if (strokeW > 0) ctx.stroke();
          }
        } else if (layer.type === 'text') {
          const content = getActiveTextForLayer(layer, pageIndex);
          const anchor = layer.anchor || 'left';
          const fontSizePx = mmToPx(layer.fontSizeMm) * scaleY;
          const letterSpacingPx = mmToPx(layer.letterSpacingMm) * scaleX;
          const lineHeightPx = fontSizePx * (layer.lineHeightRatio || 1.2);
          const fontStack = layer.customFont && layer.customFont.trim()
            ? `"${layer.customFont.trim()}", ${layer.fontFamily}`
            : layer.fontFamily;

          ctx.font = `${layer.fontWeight} ${fontSizePx}px ${fontStack}`;
          ctx.fillStyle = layer.color;
          ctx.textBaseline = 'top';
          ctx.textAlign = 'left';

          const lines = (content || '').split('\n');
          let naturalWidthPx = 0;
          const measuredLines = lines.map(line => {
            const chars = Array.from(line);
            let lineW = 0;
            chars.forEach((ch, idx) => {
              lineW += ctx.measureText(ch).width;
              if (idx < chars.length - 1) lineW += letterSpacingPx;
            });
            if (lineW > naturalWidthPx) naturalWidthPx = lineW;
            return { chars, width: lineW };
          });

          const naturalHeightPx = Math.max(fontSizePx, lines.length * lineHeightPx);
          naturalWidthPx = Math.max(4 * scaleX, naturalWidthPx);

          const naturalWidthMm = pxToMm(naturalWidthPx / scaleX);
          const naturalHeightMm = pxToMm(naturalHeightPx / scaleY);
          const targetWMm = layer.constrainBox ? layer.boxWidthMm : naturalWidthMm;
          const targetHMm = layer.constrainBox ? layer.boxHeightMm : naturalHeightMm;

          let boxLeftMm = layer.xMm;
          if (anchor === 'center') boxLeftMm = layer.xMm - targetWMm / 2;
          else if (anchor === 'right') boxLeftMm = layer.xMm - targetWMm;

          const boxLeftPx = mmToPx(boxLeftMm) * scaleX;
          const boxTopPx = mmToPx(layer.yMm) * scaleY;
          const stretchX = naturalWidthPx > 0 ? (mmToPx(targetWMm) * scaleX) / naturalWidthPx : 1;
          const stretchY = naturalHeightPx > 0 ? (mmToPx(targetHMm) * scaleY) / naturalHeightPx : 1;

          ctx.translate(boxLeftPx, boxTopPx);
          if (layer.constrainBox) {
            ctx.scale(stretchX, stretchY);
          }

          measuredLines.forEach((lineObj, lineIdx) => {
            let cursorX = 0;
            if (anchor === 'center') cursorX = (naturalWidthPx - lineObj.width) / 2;
            else if (anchor === 'right') cursorX = naturalWidthPx - lineObj.width;
            const cursorY = lineIdx * lineHeightPx;

            lineObj.chars.forEach(ch => {
              ctx.fillText(ch, cursorX, cursorY);
              cursorX += ctx.measureText(ch).width + letterSpacingPx;
            });
          });
        }

        ctx.restore();

        if (isPreview) {
          computedBoundsMap[layer.id] = boundsMm;
        }
      }

      // 5. 预览选中高亮框、基准参考线与 8 向控制手柄（支持多选框显示）
      if (isPreview && state.selectedLayerIds.length > 0) {
        state.selectedLayerIds.forEach(selId => {
          const b = computedBoundsMap[selId];
          if (!b) return;
          const selLayer = state.layers.find(l => l.id === selId);
          const isPrimary = selId === state.selectedLayerId;
          const bx = mmToPx(b.xMm) * scaleX;
          const by = mmToPx(b.yMm) * scaleY;
          const bw = mmToPx(b.wMm) * scaleX;
          const bh = mmToPx(b.hMm) * scaleY;

          ctx.save();
          ctx.strokeStyle = isPrimary ? '#0071E3' : 'rgba(0, 113, 227, 0.65)';
          ctx.lineWidth = isPrimary ? 1.5 : 1;
          if (!isPrimary) ctx.setLineDash([4, 3]);
          ctx.strokeRect(bx, by, bw, bh);
          ctx.setLineDash([]);

          // 主选文字锚点基准垂直指示线
          if (isPrimary && selLayer && selLayer.type === 'text') {
            const anchorX = mmToPx(selLayer.xMm) * scaleX;
            ctx.save();
            ctx.strokeStyle = '#0071E3';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(anchorX, Math.max(0, by - 14));
            ctx.lineTo(anchorX, Math.min(pixelHeight, by + bh + 14));
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#0071E3';
            ctx.beginPath();
            ctx.arc(anchorX, by - 6, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // 主选图层的 8 个控制手柄
          if (isPrimary) {
            const handles = getHandlePositionsPx(bx, by, bw, bh);
            handles.forEach(h => {
              ctx.fillStyle = '#FFFFFF';
              ctx.strokeStyle = '#0071E3';
              ctx.lineWidth = 1.5;
              ctx.fillRect(h.x - 4, h.y - 4, 8, 8);
              ctx.strokeRect(h.x - 4, h.y - 4, 8, 8);
            });
          }
          ctx.restore();
        });
      }
    }

    function getHandlePositionsPx(bx, by, bw, bh) {
      return [
        { id: 'nw', x: bx, y: by, cursor: 'nwse-resize' },
        { id: 'n', x: bx + bw / 2, y: by, cursor: 'ns-resize' },
        { id: 'ne', x: bx + bw, y: by, cursor: 'nesw-resize' },
        { id: 'e', x: bx + bw, y: by + bh / 2, cursor: 'ew-resize' },
        { id: 'se', x: bx + bw, y: by + bh, cursor: 'nwse-resize' },
        { id: 's', x: bx + bw / 2, y: by + bh, cursor: 'ns-resize' },
        { id: 'sw', x: bx, y: by + bh, cursor: 'nesw-resize' },
        { id: 'w', x: bx, y: by + bh / 2, cursor: 'ew-resize' }
      ];
    }

    function renderPreview() {
      const viewport = document.getElementById('previewViewport');
      const canvas = document.getElementById('previewCanvas');
      if (!viewport || !canvas) return;

      const availW = Math.max(200, viewport.clientWidth - 64);
      const availH = Math.max(200, viewport.clientHeight - 64);

      const fullPxW = mmToPx(state.canvasWidthMm);
      const fullPxH = mmToPx(state.canvasHeightMm);

      const fitScale = Math.min(availW / fullPxW, availH / fullPxH, 1.5);
      const dpr = window.devicePixelRatio || 1;
      const cssW = Math.round(fullPxW * fitScale);
      const cssH = Math.round(fullPxH * fitScale);

      canvas.style.width = `${cssW}px`;
      canvas.style.height = `${cssH}px`;

      interactState.previewScale = (cssW * dpr) / fullPxW;

      document.getElementById('zoomScaleBadge').textContent = `${Math.round(fitScale * 100)}%`;

      renderDesignToCanvas(canvas, state.currentPage, {
        isPreview: true,
        pixelWidth: Math.round(cssW * dpr),
        pixelHeight: Math.round(cssH * dpr)
      });
    }

    // =========================================================================
    // 11. 画布对象交互（支持多选、拖拽定位 + 8 向控制手柄实时缩放尺寸）
    // =========================================================================
    function setupCanvasInteractions() {
      const canvas = document.getElementById('previewCanvas');

      const getMousePosMmAndPx = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const normX = (clientX - rect.left) / rect.width;
        const normY = (clientY - rect.top) / rect.height;
        return {
          xMm: normX * state.canvasWidthMm,
          yMm: normY * state.canvasHeightMm,
          pxX: normX * canvas.width,
          pxY: normY * canvas.height
        };
      };

      const hitTestHandle = (pxX, pxY) => {
        if (!state.selectedLayerId) return null;
        const b = computedBoundsMap[state.selectedLayerId];
        if (!b) return null;
        const bx = mmToPx(b.xMm) * interactState.previewScale;
        const by = mmToPx(b.yMm) * interactState.previewScale;
        const bw = mmToPx(b.wMm) * interactState.previewScale;
        const bh = mmToPx(b.hMm) * interactState.previewScale;
        const handles = getHandlePositionsPx(bx, by, bw, bh);
        const tol = 8;
        for (const h of handles) {
          if (Math.abs(pxX - h.x) <= tol && Math.abs(pxY - h.y) <= tol) {
            return h;
          }
        }
        return null;
      };

      canvas.addEventListener('mousedown', (e) => {
        const { xMm, yMm, pxX, pxY } = getMousePosMmAndPx(e);

        const hitH = hitTestHandle(pxX, pxY);
        if (hitH && state.selectedLayerId) {
          const layer = state.layers.find(l => l.id === state.selectedLayerId);
          const b = computedBoundsMap[layer.id];
          if (layer && b) {
            interactState.mode = 'resize';
            interactState.handle = hitH.id;
            interactState.layerId = layer.id;
            interactState.startMouseXMm = xMm;
            interactState.startMouseYMm = yMm;
            interactState.origXMm = layer.xMm;
            interactState.origYMm = layer.yMm;
            interactState.origWMm = b.wMm;
            interactState.origHMm = b.hMm;
            interactState.origFontSizeMm = layer.fontSizeMm || 8;
            return;
          }
        }

        let hitLayerId = null;
        for (let i = state.layers.length - 1; i >= 0; i--) {
          const l = state.layers[i];
          const b = computedBoundsMap[l.id];
          if (!b) continue;
          const pad = 2.5;
          const minX = Math.min(b.xMm, b.xMm + b.wMm) - pad;
          const maxX = Math.max(b.xMm, b.xMm + b.wMm) + pad;
          const minY = Math.min(b.yMm, b.yMm + b.hMm) - pad;
          const maxY = Math.max(b.yMm, b.yMm + b.hMm) + pad;
          if (xMm >= minX && xMm <= maxX && yMm >= minY && yMm <= maxY) {
            hitLayerId = l.id;
            break;
          }
        }

        if (hitLayerId) {
          if (e.shiftKey) {
            selectLayer(hitLayerId, true);
          } else if (!state.selectedLayerIds.includes(hitLayerId)) {
            selectLayer(hitLayerId, false);
          } else {
            state.selectedLayerId = hitLayerId;
            renderLayersUI();
            renderPreview();
          }
          const layer = state.layers.find(l => l.id === hitLayerId);
          interactState.mode = 'move';
          interactState.layerId = layer.id;
          interactState.startMouseXMm = xMm;
          interactState.startMouseYMm = yMm;
          interactState.origXMm = layer.xMm;
          interactState.origYMm = layer.yMm;
          interactState.multiOrigPositions = {};
          state.selectedLayerIds.forEach(sid => {
            const sl = state.layers.find(item => item.id === sid);
            if (sl) interactState.multiOrigPositions[sid] = { xMm: sl.xMm, yMm: sl.yMm };
          });
        } else {
          state.selectedLayerId = null;
          state.selectedLayerIds = [];
          updateAlignToolbarState();
          renderLayersUI();
          renderPreview();
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (interactState.mode === 'none') {
          if (e.target === canvas) {
            const { pxX, pxY } = getMousePosMmAndPx(e);
            const hitH = hitTestHandle(pxX, pxY);
            canvas.style.cursor = hitH ? hitH.cursor : 'default';
          }
          return;
        }

        const { xMm, yMm } = getMousePosMmAndPx(e);
        const dx = xMm - interactState.startMouseXMm;
        const dy = yMm - interactState.startMouseYMm;

        if (interactState.mode === 'move') {
          state.selectedLayerIds.forEach(sid => {
            const sl = state.layers.find(item => item.id === sid);
            const orig = interactState.multiOrigPositions[sid];
            if (sl && orig) {
              sl.xMm = Number((orig.xMm + dx).toFixed(2));
              sl.yMm = Number((orig.yMm + dy).toFixed(2));
              syncLayerNumericInputs(sl);
            }
          });
          renderPreview();
        } else if (interactState.mode === 'resize') {
          const layer = state.layers.find(l => l.id === interactState.layerId);
          if (!layer) return;

          const h = interactState.handle;
          let newX = interactState.origXMm;
          let newY = interactState.origYMm;
          let newW = interactState.origWMm;
          let newH = interactState.origHMm;

          if (h.includes('e')) newW = interactState.origWMm + dx;
          if (h.includes('s')) newH = interactState.origHMm + dy;
          if (h.includes('w')) {
            newW = interactState.origWMm - dx;
            newX = interactState.origXMm + dx;
          }
          if (h.includes('n')) {
            newH = interactState.origHMm - dy;
            newY = interactState.origYMm + dy;
          }

          if (layer.type !== 'line') {
            newW = Math.max(1, newW);
            newH = Math.max(1, newH);
          }

          if (e.shiftKey && layer.type !== 'line' && interactState.origHMm > 0) {
            const ratio = interactState.origWMm / interactState.origHMm;
            if (h === 'n' || h === 's') {
              newW = newH * ratio;
            } else {
              newH = newW / ratio;
            }
          }

          if (layer.type === 'text') {
            if (layer.constrainBox) {
              layer.xMm = Number(newX.toFixed(2));
              layer.yMm = Number(newY.toFixed(2));
              layer.boxWidthMm = Number(newW.toFixed(2));
              layer.boxHeightMm = Number(newH.toFixed(2));
            } else {
              const scaleRatio = interactState.origHMm > 0 ? (newH / interactState.origHMm) : 1;
              layer.fontSizeMm = Math.max(1, Number((interactState.origFontSizeMm * scaleRatio).toFixed(2)));
              layer.yMm = Number(newY.toFixed(2));
              if ((layer.anchor || 'left') === 'left') {
                layer.xMm = Number(newX.toFixed(2));
              }
            }
          } else {
            layer.xMm = Number(newX.toFixed(2));
            layer.yMm = Number(newY.toFixed(2));
            layer.widthMm = Number(newW.toFixed(2));
            layer.heightMm = Number(newH.toFixed(2));
          }

          syncLayerNumericInputs(layer);
          renderPreview();
        }
      });

      window.addEventListener('mouseup', () => {
        if (interactState.mode !== 'none') {
          interactState.mode = 'none';
          interactState.handle = null;
          canvas.style.cursor = 'default';
          renderLayersUI();
        }
      });
    }

    function syncLayerNumericInputs(layer) {
      const u = state.unit;
      const elX = document.getElementById(`input_x_${layer.id}`);
      const elY = document.getElementById(`input_y_${layer.id}`);
      if (elX) elX.value = formatDisplayNum(layer.xMm, u);
      if (elY) elY.value = formatDisplayNum(layer.yMm, u);

      const elW = document.getElementById(`input_w_${layer.id}`);
      const elH = document.getElementById(`input_h_${layer.id}`);
      if (elW) elW.value = formatDisplayNum(layer.widthMm, u);
      if (elH) elH.value = formatDisplayNum(layer.heightMm, u);

      const elBoxW = document.getElementById(`input_boxW_${layer.id}`);
      const elBoxH = document.getElementById(`input_boxH_${layer.id}`);
      if (elBoxW) elBoxW.value = formatDisplayNum(layer.boxWidthMm, u);
      if (elBoxH) elBoxH.value = formatDisplayNum(layer.boxHeightMm, u);

      const elFont = document.getElementById(`input_fontSize_${layer.id}`);
      if (elFont) elFont.value = formatDisplayNum(layer.fontSizeMm, u);
    }

    // =========================================================================
    // 12. 导出与导入模板配置（JSON 文件）
    // =========================================================================
    function exportTemplateConfig() {
      try {
        const serializedLayers = state.layers.map(layer => {
          const copy = { ...layer };
          if (layer.type === 'image') {
            copy.singleImage = layer.singleImage ? {
              name: layer.singleImage.name,
              src: layer.singleImage.src,
              width: layer.singleImage.width,
              height: layer.singleImage.height
            } : null;
            copy.variableImages = (layer.variableImages || []).map(item => ({
              name: item.name,
              src: item.src,
              width: item.width,
              height: item.height
            }));
          }
          return copy;
        });

        const templateData = {
          app: '批量图文排版',
          version: '2.1',
          exportedAt: new Date().toISOString(),
          projectName: state.projectName,
          unit: state.unit,
          canvasWidthMm: state.canvasWidthMm,
          canvasHeightMm: state.canvasHeightMm,
          canvasBgColor: state.canvasBgColor,
          refBgImageSrc: state.refBgImageSrc,
          refBgFileName: state.refBgFileName,
          refBgOpacity: state.refBgOpacity,
          refBgExcludeFromExport: state.refBgExcludeFromExport,
          layers: serializedLayers
        };

        const jsonStr = JSON.stringify(templateData, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
        const safeName = sanitizeFilename(state.projectName || '未命名项目');
        triggerDownload(blob, `${safeName}_模板.json`);
        showToast(`模板已导出：${safeName}_模板.json`, 'success');
      } catch (err) {
        console.error('导出模板失败:', err);
        showToast('导出模板失败：' + err.message, 'error');
      }
    }

    function handleImportTemplate(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (!data || !Array.isArray(data.layers)) {
            throw new Error('无效的模板文件格式');
          }

          state.projectName = data.projectName || '导入项目';
          state.canvasWidthMm = Number(data.canvasWidthMm) || 150;
          state.canvasHeightMm = Number(data.canvasHeightMm) || 100;
          state.canvasBgColor = data.canvasBgColor || '#FFFFFF';
          state.refBgOpacity = typeof data.refBgOpacity === 'number' ? data.refBgOpacity : 0.4;
          state.refBgExcludeFromExport = data.refBgExcludeFromExport !== false;
          state.refBgFileName = data.refBgFileName || '';

          if (data.refBgImageSrc) {
            state.refBgImageSrc = data.refBgImageSrc;
            state.refBgImageObj = await loadImageFromDataUrl(data.refBgImageSrc);
          } else {
            state.refBgImageSrc = null;
            state.refBgImageObj = null;
          }

          const restoredLayers = [];
          for (const rawLayer of data.layers) {
            const l = { ...rawLayer };
            if (!l.id) l.id = 'layer_' + (layerIdCounter++);
            if (l.type === 'text' && !l.anchor) l.anchor = 'left';
            if (l.type === 'text' && l.styleCollapsed === undefined) l.styleCollapsed = true;
            if (l.rotation === undefined) l.rotation = 0;
            if (l.flipX === undefined) l.flipX = false;
            if (l.flipY === undefined) l.flipY = false;
            if (l.type === 'image') {
              if (l.singleImage && l.singleImage.src) {
                const imgEl = await loadImageFromDataUrl(l.singleImage.src);
                l.singleImage = { ...l.singleImage, imgElement: imgEl };
              }
              if (Array.isArray(l.variableImages)) {
                const restoredVarImgs = [];
                for (const vImg of l.variableImages) {
                  if (vImg && vImg.src) {
                    const imgEl = await loadImageFromDataUrl(vImg.src);
                    restoredVarImgs.push({ ...vImg, imgElement: imgEl });
                  }
                }
                l.variableImages = restoredVarImgs;
              }
            }
            restoredLayers.push(l);
          }

          state.layers = restoredLayers;
          state.selectedLayerId = restoredLayers.length ? restoredLayers[0].id : null;
          state.selectedLayerIds = state.selectedLayerId ? [state.selectedLayerId] : [];
          state.currentPage = 1;

          if (data.unit && (data.unit === 'mm' || data.unit === 'pt')) {
            switchUnit(data.unit);
          } else {
            syncCanvasInputs();
          }
          renderCanvasBgPaletteUI();
          syncRefBgUI();
          updateAlignToolbarState();
          renderLayersUI();
          updatePaginationState();
          renderPreview();
          showToast(`已成功导入模板：${file.name}`, 'success');
        } catch (err) {
          console.error('导入模板失败:', err);
          showToast('导入模板失败：' + err.message, 'error');
        }
      };
      reader.readAsText(file);
      input.value = '';
    }

    function loadImageFromDataUrl(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    // =========================================================================
    // 13. 批量导出引擎（600 PPI 超清 JPG/PNG + 真矢量轮廓 PDF）
    // =========================================================================
    let cachedVectorFont = null;
    let vectorFontLoadPromise = null;

    async function ensureVectorFontLoaded() {
      if (cachedVectorFont) return cachedVectorFont;
      if (vectorFontLoadPromise) return vectorFontLoadPromise;
      if (typeof opentype === 'undefined') return null;

      vectorFontLoadPromise = (async () => {
        const fontUrls = [
          'https://cdn.jsdelivr.net/gh/googlefonts/noto-cjk@main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf',
          'https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.0.19/files/noto-sans-sc-chinese-simplified-400-normal.woff'
        ];
        for (const url of fontUrls) {
          try {
            const res = await fetch(url, { mode: 'cors' });
            if (!res.ok) continue;
            const buf = await res.arrayBuffer();
            const parsed = opentype.parse(buf);
            if (parsed && parsed.charToGlyph) {
              cachedVectorFont = parsed;
              return parsed;
            }
          } catch (e) {
            console.warn('字体矢量化源尝试跳过:', url, e);
          }
        }
        return null;
      })();

      return vectorFontLoadPromise;
    }

    function hexToRgb(hex) {
      const clean = (hex || '#000000').replace('#', '');
      const full = clean.length === 3
        ? clean.split('').map(c => c + c).join('')
        : clean.padEnd(6, '0');
      const num = parseInt(full, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function drawOpenTypePathToPdf(doc, otPath, fillRgb) {
      const cmds = otPath.commands || [];
      if (cmds.length === 0) return;

      const ops = [];
      let startX = 0;
      let startY = 0;
      let curX = 0;
      let curY = 0;

      for (const cmd of cmds) {
        if (cmd.type === 'M') {
          ops.push({ op: 'm', c: [cmd.x, cmd.y] });
          startX = curX = cmd.x;
          startY = curY = cmd.y;
        } else if (cmd.type === 'L') {
          ops.push({ op: 'l', c: [cmd.x, cmd.y] });
          curX = cmd.x;
          curY = cmd.y;
        } else if (cmd.type === 'Q') {
          const cp1x = curX + (2 / 3) * (cmd.x1 - curX);
          const cp1y = curY + (2 / 3) * (cmd.y1 - curY);
          const cp2x = cmd.x + (2 / 3) * (cmd.x1 - cmd.x);
          const cp2y = cmd.y + (2 / 3) * (cmd.y1 - cmd.y);
          ops.push({ op: 'c', c: [cp1x, cp1y, cp2x, cp2y, cmd.x, cmd.y] });
          curX = cmd.x;
          curY = cmd.y;
        } else if (cmd.type === 'C') {
          ops.push({ op: 'c', c: [cmd.x1, cmd.y1, cmd.x2, cmd.y2, cmd.x, cmd.y] });
          curX = cmd.x;
          curY = cmd.y;
        } else if (cmd.type === 'Z') {
          ops.push({ op: 'h', c: [] });
          curX = startX;
          curY = startY;
        }
      }

      doc.setFillColor(fillRgb.r, fillRgb.g, fillRgb.b);
      doc.path(ops);
      doc.fill();
    }

    async function exportVectorPdfDirect(totalPages, safeProjectName, statusText) {
      statusText.textContent = '正在加载真矢量字体引擎...';
      const vectorFont = await ensureVectorFontLoaded();

      const { jsPDF } = window.jspdf;
      const wMm = state.canvasWidthMm;
      const hMm = state.canvasHeightMm;
      const orientation = wMm >= hMm ? 'l' : 'p';

      const doc = new jsPDF({
        orientation,
        unit: 'mm',
        format: [wMm, hMm],
        compress: true
      });

      const bgRgb = hexToRgb(state.canvasBgColor);

      for (let page = 1; page <= totalPages; page++) {
        statusText.textContent = `正在生成真矢量 PDF (${page}/${totalPages})...`;
        await new Promise(r => setTimeout(r, 8));

        if (page > 1) {
          doc.addPage([wMm, hMm], orientation);
        }

        // 1. 矢量画布底色
        doc.setFillColor(bgRgb.r, bgRgb.g, bgRgb.b);
        doc.rect(0, 0, wMm, hMm, 'F');

        // 2. 参考背景图（若未勾选导出隐藏）
        if (state.refBgImageSrc && !state.refBgExcludeFromExport) {
          const fmt = state.refBgImageSrc.startsWith('data:image/jpeg') ? 'JPEG' : 'PNG';
          doc.addImage(state.refBgImageSrc, fmt, 0, 0, wMm, hMm, undefined, 'NONE');
        }

        // 3. 逐层写入原生矢量图形、原图无损图片与真矢量文字
        for (const layer of state.layers) {
          const rotDeg = Number(layer.rotation || 0);
          const flipX = !!layer.flipX;
          const flipY = !!layer.flipY;
          const hasTransform = rotDeg !== 0 || flipX || flipY;

          // 计算当前图层在 PDF 中的包围盒（用于旋转/镜像或文字偏移计算）
          let layerBoxMm = { xMm: layer.xMm, yMm: layer.yMm, wMm: layer.widthMm || 0, hMm: layer.heightMm || 0 };
          let cachedTextMeta = null;
          if (layer.type === 'text') {
            const content = getActiveTextForLayer(layer, page);
            if (!content) continue;
            const anchor = layer.anchor || 'left';
            const fontStack = layer.customFont && layer.customFont.trim()
              ? `"${layer.customFont.trim()}", ${layer.fontFamily}`
              : layer.fontFamily;
            const natDims = measureTextDimensionsMm(content, layer.fontSizeMm, layer.letterSpacingMm || 0, layer.lineHeightRatio || 1.2, layer.fontWeight, fontStack);
            const targetWMm = layer.constrainBox ? layer.boxWidthMm : natDims.widthMm;
            const targetHMm = layer.constrainBox ? layer.boxHeightMm : natDims.heightMm;
            let boxLeftMm = layer.xMm;
            if (anchor === 'center') boxLeftMm = layer.xMm - targetWMm / 2;
            else if (anchor === 'right') boxLeftMm = layer.xMm - targetWMm;
            layerBoxMm = { xMm: boxLeftMm, yMm: layer.yMm, wMm: targetWMm, hMm: targetHMm };
            cachedTextMeta = { content, anchor, fontStack, natDims, targetWMm, targetHMm, boxLeftMm };
          }

          if (hasTransform) {
            doc.saveGraphicsState();
            const cxMm = layerBoxMm.xMm + layerBoxMm.wMm / 2;
            const cyMm = layerBoxMm.yMm + layerBoxMm.hMm / 2;
            const rad = (-rotDeg * Math.PI) / 180; // PDF Y轴向上，旋转符号取反
            const sx = flipX ? -1 : 1;
            const sy = flipY ? -1 : 1;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);
            // 组合矩阵：平移到中心 -> 旋转 -> 镜像 -> 平移回原点（在 PDF 底部原点坐标系下变换）
            const pageH = hMm;
            const pdfCx = cxMm;
            const pdfCy = pageH - cyMm;
            const a = cos * sx;
            const b = sin * sx;
            const c = -sin * sy;
            const d = cos * sy;
            const e = pdfCx - (a * pdfCx + c * pdfCy);
            const f = pdfCy - (b * pdfCx + d * pdfCy);
            if (typeof doc.Matrix === 'function' && typeof doc.setCurrentTransformationMatrix === 'function') {
              doc.setCurrentTransformationMatrix(new doc.Matrix(a, b, c, d, e, f));
            }
          }

          if (layer.type === 'image') {
            const imgData = getActiveImageForLayer(layer, page);
            if (imgData && imgData.src) {
              const imgFmt = imgData.src.startsWith('data:image/jpeg') ? 'JPEG' : 'PNG';
              doc.addImage(imgData.src, imgFmt, layer.xMm, layer.yMm, layer.widthMm, layer.heightMm, undefined, 'NONE');
            }
          } else if (layer.type === 'rect' || layer.type === 'ellipse' || layer.type === 'line') {
            const hasFill = layer.type !== 'line' && !layer.fillTransparent;
            const hasStroke = (layer.strokeWidthMm || 0) > 0;
            if (!hasFill && !hasStroke) {
              if (hasTransform) doc.restoreGraphicsState();
              continue;
            }

            if (hasFill) {
              const fRgb = hexToRgb(layer.fillColor);
              doc.setFillColor(fRgb.r, fRgb.g, fRgb.b);
            }
            if (hasStroke) {
              const sRgb = hexToRgb(layer.strokeColor);
              doc.setDrawColor(sRgb.r, sRgb.g, sRgb.b);
              doc.setLineWidth(layer.strokeWidthMm);
              doc.setLineCap('round');
              doc.setLineJoin('round');
              if (layer.strokeDashed) {
                doc.setLineDashPattern([Math.max(0.1, layer.dashLengthMm), Math.max(0.1, layer.dashGapMm)], 0);
              } else {
                doc.setLineDashPattern([], 0);
              }
            }

            const styleFlag = hasFill && hasStroke ? 'FD' : (hasFill ? 'F' : 'S');
            if (layer.type === 'rect') {
              const rawRadiusMm = layer.borderRadiusMm || 0;
              const maxRadiusMm = Math.min(layer.widthMm, layer.heightMm) / 2;
              const rMm = Math.max(0, Math.min(rawRadiusMm, maxRadiusMm));
              if (rMm > 0 && typeof doc.roundedRect === 'function') {
                doc.roundedRect(layer.xMm, layer.yMm, layer.widthMm, layer.heightMm, rMm, rMm, styleFlag);
              } else {
                doc.rect(layer.xMm, layer.yMm, layer.widthMm, layer.heightMm, styleFlag);
              }
            } else if (layer.type === 'ellipse') {
              const rx = Math.max(0.05, layer.widthMm / 2);
              const ry = Math.max(0.05, layer.heightMm / 2);
              doc.ellipse(layer.xMm + rx, layer.yMm + ry, rx, ry, styleFlag);
            } else if (layer.type === 'line') {
              if (layer.lineDirection === 'bl-tr') {
                doc.line(layer.xMm, layer.yMm + layer.heightMm, layer.xMm + layer.widthMm, layer.yMm);
              } else {
                doc.line(layer.xMm, layer.yMm, layer.xMm + layer.widthMm, layer.yMm + layer.heightMm);
              }
            }
            doc.setLineDashPattern([], 0);
          } else if (layer.type === 'text' && cachedTextMeta) {
            const { content, anchor, fontStack, natDims, targetWMm, targetHMm, boxLeftMm } = cachedTextMeta;
            const textRgb = hexToRgb(layer.color);

            const lines = content.split('\n');
            const lineHeightMm = layer.fontSizeMm * (layer.lineHeightRatio || 1.2);
            const stretchX = (layer.constrainBox && natDims.widthMm > 0) ? (targetWMm / natDims.widthMm) : 1;
            const stretchY = (layer.constrainBox && natDims.heightMm > 0) ? (targetHMm / natDims.heightMm) : 1;

            // 优先使用 OpenType 真矢量轮廓曲线直接写入 PDF（任意放大 1000% 绝对锐利，支持全中文）
            if (vectorFont && typeof doc.path === 'function') {
              const unitsPerEm = vectorFont.unitsPerEm || 1000;
              const ascenderRatio = (vectorFont.ascender || 880) / unitsPerEm;

              lines.forEach((line, lineIdx) => {
                const chars = Array.from(line);
                let lineWMm = 0;
                const charWidthsMm = chars.map((ch, cIdx) => {
                  const glyph = vectorFont.charToGlyph(ch);
                  const adv = ((glyph.advanceWidth || unitsPerEm * 0.5) / unitsPerEm) * layer.fontSizeMm;
                  const sp = cIdx < chars.length - 1 ? (layer.letterSpacingMm || 0) : 0;
                  lineWMm += adv + sp;
                  return adv;
                });

                let cursorXMm = 0;
                if (anchor === 'center') cursorXMm = (natDims.widthMm - lineWMm) / 2;
                else if (anchor === 'right') cursorXMm = natDims.widthMm - lineWMm;

                const baselineYMm = lineIdx * lineHeightMm + layer.fontSizeMm * ascenderRatio;

                chars.forEach((ch, cIdx) => {
                  const glyph = vectorFont.charToGlyph(ch);
                  const rawPath = glyph.getPath(0, 0, layer.fontSizeMm);
                  rawPath.commands.forEach(cmd => {
                    if (cmd.x !== undefined) cmd.x = boxLeftMm + (cursorXMm + cmd.x) * stretchX;
                    if (cmd.y !== undefined) cmd.y = layer.yMm + (baselineYMm + cmd.y) * stretchY;
                    if (cmd.x1 !== undefined) cmd.x1 = boxLeftMm + (cursorXMm + cmd.x1) * stretchX;
                    if (cmd.y1 !== undefined) cmd.y1 = layer.yMm + (baselineYMm + cmd.y1) * stretchY;
                    if (cmd.x2 !== undefined) cmd.x2 = boxLeftMm + (cursorXMm + cmd.x2) * stretchX;
                    if (cmd.y2 !== undefined) cmd.y2 = layer.yMm + (baselineYMm + cmd.y2) * stretchY;
                  });
                  drawOpenTypePathToPdf(doc, rawPath, textRgb);

                  if (Number(layer.fontWeight) >= 700) {
                    doc.setDrawColor(textRgb.r, textRgb.g, textRgb.b);
                    doc.setLineWidth(layer.fontSizeMm * 0.032);
                    doc.stroke();
                  }

                  cursorXMm += charWidthsMm[cIdx] + (layer.letterSpacingMm || 0);
                });
              });
            } else {
              // 离线无网络兜底：以 1200 DPI 超高清单图层透明通道输出
              const hiScale = 1200 / MM_PER_INCH;
              const tmpW = Math.max(4, Math.ceil(targetWMm * hiScale) + 8);
              const tmpH = Math.max(4, Math.ceil(targetHMm * hiScale) + 8);
              const tCanvas = document.createElement('canvas');
              tCanvas.width = tmpW;
              tCanvas.height = tmpH;
              const tCtx = tCanvas.getContext('2d');
              const fontSizePx = layer.fontSizeMm * hiScale;
              const letterSpPx = (layer.letterSpacingMm || 0) * hiScale;
              const lineHPx = fontSizePx * (layer.lineHeightRatio || 1.2);
              tCtx.font = `${layer.fontWeight} ${fontSizePx}px ${fontStack}`;
              tCtx.fillStyle = layer.color;
              tCtx.textBaseline = 'top';
              if (layer.constrainBox) tCtx.scale(stretchX, stretchY);
              lines.forEach((line, idx) => {
                let cx = 0;
                const chars = Array.from(line);
                const lw = chars.reduce((acc, ch, i) => acc + tCtx.measureText(ch).width + (i < chars.length - 1 ? letterSpPx : 0), 0);
                if (anchor === 'center') cx = (natDims.widthMm * hiScale - lw) / 2;
                else if (anchor === 'right') cx = natDims.widthMm * hiScale - lw;
                chars.forEach(ch => {
                  tCtx.fillText(ch, cx, idx * lineHPx);
                  cx += tCtx.measureText(ch).width + letterSpPx;
                });
              });
              doc.addImage(tCanvas.toDataURL('image/png'), 'PNG', boxLeftMm, layer.yMm, tmpW / hiScale, tmpH / hiScale, undefined, 'NONE');
            }
          }

          if (hasTransform) {
            doc.restoreGraphicsState();
          }
        }
      }

      const pdfBlob = doc.output('blob');
      triggerDownload(pdfBlob, `${safeProjectName}.pdf`);
      showToast(`已生成真矢量 PDF 文件：${safeProjectName}.pdf（共 ${totalPages} 页）`, 'success');
    }

    async function handleBatchExport(format) {
      const totalPages = getTotalPages();
      const safeProjectName = sanitizeFilename(state.projectName || '未命名项目');

      const statusBadge = document.getElementById('exportStatusBadge');
      const statusText = document.getElementById('exportStatusText');
      const btns = ['btnExportJpg', 'btnExportPng', 'btnExportPdf'].map(id => document.getElementById(id));

      btns.forEach(b => { if (b) b.disabled = true; });
      statusBadge.classList.remove('hidden');

      try {
        if (format === 'pdf') {
          await exportVectorPdfDirect(totalPages, safeProjectName, statusText);
        } else {
          // 600 PPI 超清位图渲染
          const exportPpi = 600;
          const exportW = Math.max(1, Math.round(mmToPx(state.canvasWidthMm, exportPpi)));
          const exportH = Math.max(1, Math.round(mmToPx(state.canvasHeightMm, exportPpi)));
          const offscreenCanvas = document.createElement('canvas');

          const zip = new JSZip();
          const padLen = Math.max(2, String(totalPages).length);
          const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
          const ext = format === 'jpg' ? 'jpg' : 'png';

          for (let page = 1; page <= totalPages; page++) {
            statusText.textContent = `正在生成超清 ${ext.toUpperCase()} (${page}/${totalPages})...`;
            await new Promise(r => setTimeout(r, 8));

            renderDesignToCanvas(offscreenCanvas, page, {
              isPreview: false,
              pixelWidth: exportW,
              pixelHeight: exportH
            });

            const seqStr = String(page).padStart(padLen, '0');
            const fileName = `${safeProjectName}_${seqStr}.${ext}`;
            const blob = await canvasToBlobAsync(offscreenCanvas, mimeType, 1.0);
            zip.file(fileName, blob);
          }

          statusText.textContent = '正在打包 ZIP 压缩包...';
          const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 3 } });
          triggerDownload(zipBlob, `${safeProjectName}.zip`);
          showToast(`已成功导出 600 PPI 超清压缩包：${safeProjectName}.zip（共 ${totalPages} 张）`, 'success');
        }
      } catch (err) {
        console.error('导出失败:', err);
        showToast('导出过程中发生错误：' + err.message, 'error');
      } finally {
        btns.forEach(b => { if (b) b.disabled = false; });
        statusBadge.classList.add('hidden');
      }
    }

    function canvasToBlobAsync(canvas, mimeType, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error('Canvas 图像生成失败'));
        }, mimeType, quality);
      });
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    function sanitizeFilename(name) {
      return name.replace(/[\\/:*?"<>|]/g, '_').trim() || '未命名项目';
    }

    // =========================================================================
    // 14. 轻提示通知组件（替代 alert）
    // =========================================================================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-gray-900/95 text-white border-gray-800',
        error: 'bg-red-600/95 text-white border-red-500',
        info: 'bg-white/95 text-apple-text border-apple-border'
      };
      toast.className = `px-4 py-2.5 rounded-xl border shadow-lg text-xs font-medium backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 ${colors[type] || colors.info}`;
      toast.textContent = message;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    // 启动初始化
    window.addEventListener('DOMContentLoaded', () => {
      initApp();
      lucide.createIcons();
    });
  </script>
</body>
</html>
