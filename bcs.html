<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>批量图文排版 · 300 PPI 批量引擎</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip & jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- OpenType.js (用于将任意中文/英文字体直接解析为真矢量贝塞尔轮廓路径写入 PDF) -->
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Inter & Noto Sans SC & Noto Serif SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans SC', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            apple: {
              bg: '#F5F5F7',
              card: '#FFFFFF',
              border: '#E5E5EA',
              text: '#1D1D1F',
              subtext: '#86868B',
              blue: '#0071E3',
              blueHover: '#0077ED',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F5F5F7;
      color: #1D1D1F;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #D1D1D6;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #AEAEB2;
    }

    /* 瑞士网格背景 */
    .canvas-workspace-bg {
      background-color: #EAEAEF;
      background-image: 
        linear-gradient(to right, rgba(0,0,0,0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.035) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 6px;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

  <!-- 顶部导航栏 -->
  <header class="h-14 bg-white/90 backdrop-blur-md border-b border-apple-border px-3 lg:px-5 flex items-center justify-between shrink-0 z-30 gap-2">
    <!-- 左侧：中文工作台名称 -->
    <div class="flex items-center gap-2.5 shrink-0">
      <div class="w-8 h-8 rounded-lg bg-[#1D1D1F] text-white flex items-center justify-center shadow-sm">
        <i data-lucide="layers" class="w-4 h-4"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-sm font-bold tracking-tight text-apple-text">批量图文排版</h1>
          <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-apple-bg text-apple-subtext border border-apple-border hidden sm:inline-block">300 PPI 批量引擎</span>
        </div>
        <p class="text-[11px] text-apple-subtext hidden md:block">左上角原点 (0,0) · 画布实时拖拽缩放 · 离线高清输出</p>
      </div>
    </div>

    <!-- 最右侧：模板导入导出 + 三个图像/PDF导出按钮 -->
    <div class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto py-1">
      <!-- 模板操作区 -->
      <label class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-gray-100/80 hover:bg-gray-200/70 text-apple-text border border-apple-border transition active:scale-[0.98] cursor-pointer shrink-0" title="从 JSON 文件恢复全部排版设定">
        <i data-lucide="folder-up" class="w-3.5 h-3.5 text-indigo-600"></i>
        <span>导入模板</span>
        <input type="file" id="importTemplateInput" accept=".json,application/json" class="hidden" onchange="importTemplate(this)" />
      </label>

      <button type="button" onclick="exportTemplate()" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-gray-100/80 hover:bg-gray-200/70 text-apple-text border border-apple-border transition active:scale-[0.98] cursor-pointer shrink-0" title="将当前所有设定与变量数据保存为 JSON 模板">
        <i data-lucide="save" class="w-3.5 h-3.5 text-indigo-600"></i>
        <span>导出模板</span>
      </button>

      <div class="h-4 w-px bg-apple-border mx-0.5 shrink-0"></div>

      <!-- 批量输出区 -->
      <button type="button" onclick="exportBatch('jpg')" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white hover:bg-gray-50 text-apple-text border border-apple-border shadow-2xs transition active:scale-[0.98] cursor-pointer shrink-0">
        <i data-lucide="file-image" class="w-3.5 h-3.5 text-amber-600"></i>
        <span>导出 JPG</span>
      </button>
      <button type="button" onclick="exportBatch('png')" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white hover:bg-gray-50 text-apple-text border border-apple-border shadow-2xs transition active:scale-[0.98] cursor-pointer shrink-0">
        <i data-lucide="image" class="w-3.5 h-3.5 text-emerald-600"></i>
        <span>导出 PNG</span>
      </button>
      <button type="button" onclick="exportBatch('pdf')" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium bg-apple-blue hover:bg-apple-blueHover text-white shadow-xs transition active:scale-[0.98] cursor-pointer shrink-0">
        <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
        <span>导出 PDF</span>
      </button>
    </div>
  </header>

  <!-- 主界面双栏结构 -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    
    <!-- 左侧编辑面板 -->
    <aside class="w-full lg:w-[450px] xl:w-[490px] bg-apple-bg border-b lg:border-b-0 lg:border-r border-apple-border flex flex-col h-[52vh] lg:h-full shrink-0">
      <div class="flex-1 overflow-y-auto p-3.5 space-y-3.5 select-text" id="editorScrollArea">
        
        <!-- 卡片 1：基础画布设置 -->
        <section class="bg-apple-card rounded-2xl border border-apple-border p-4 shadow-2xs space-y-3.5">
          <div class="flex items-center justify-between border-b border-gray-100 pb-2">
            <div class="flex items-center gap-2">
              <i data-lucide="sliders-horizontal" class="w-4 h-4 text-apple-blue"></i>
              <h2 class="text-xs font-semibold uppercase tracking-wider text-apple-text">基础画布设置</h2>
            </div>
            <span id="pixelResolutionBadge" class="text-[11px] font-mono bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md">1772 × 1181 px</span>
          </div>

          <!-- 项目名称 -->
          <div>
            <label class="block text-xs font-medium text-apple-subtext mb-1">项目名称（导出文件名、ZIP 及模板命名）</label>
            <input type="text" id="projectNameInput" value="未命名项目" placeholder="请输入项目名称..."
              oninput="updateProjectName(this.value)"
              class="w-full px-3 py-1.5 text-sm bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:ring-2 focus:ring-apple-blue/20 focus:border-apple-blue transition" />
          </div>

          <!-- 计量单位与画布尺寸 -->
          <div class="grid grid-cols-12 gap-2.5 items-end">
            <div class="col-span-4">
              <label class="block text-xs font-medium text-apple-subtext mb-1">全局单位</label>
              <div class="grid grid-cols-2 bg-gray-100 p-0.5 rounded-lg border border-apple-border">
                <button type="button" id="unitBtnMm" onclick="switchUnit('mm')" class="py-1 text-xs font-semibold rounded-md bg-white text-apple-text shadow-2xs transition cursor-pointer">mm</button>
                <button type="button" id="unitBtnPt" onclick="switchUnit('pt')" class="py-1 text-xs font-medium rounded-md text-apple-subtext hover:text-apple-text transition cursor-pointer">pt</button>
              </div>
            </div>

            <div class="col-span-4">
              <label class="block text-xs font-medium text-apple-subtext mb-1">宽度 (<span class="unit-label">mm</span>)</label>
              <input type="number" step="any" id="canvasWidthInput" value="150"
                onchange="updateCanvasSize('width', this.value)"
                class="w-full px-2.5 py-1.5 text-sm font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:ring-2 focus:ring-apple-blue/20 focus:border-apple-blue" />
            </div>

            <div class="col-span-4">
              <label class="block text-xs font-medium text-apple-subtext mb-1">高度 (<span class="unit-label">mm</span>)</label>
              <input type="number" step="any" id="canvasHeightInput" value="100"
                onchange="updateCanvasSize('height', this.value)"
                class="w-full px-2.5 py-1.5 text-sm font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:ring-2 focus:ring-apple-blue/20 focus:border-apple-blue" />
            </div>
          </div>

          <!-- 画布背景色（单行可折叠色板） -->
          <div class="pt-2 border-t border-gray-100" id="canvasBgPaletteContainer"></div>

          <!-- 参考背景图（辅助对齐） -->
          <div class="pt-2 border-t border-gray-100 space-y-2.5">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-1.5">
                <i data-lucide="image-down" class="w-3.5 h-3.5 text-apple-subtext"></i>
                <span class="text-xs font-medium text-apple-text">参考背景图（辅助对齐）</span>
              </div>
              <div class="flex items-center gap-1.5">
                <label class="px-2.5 py-1 bg-gray-100 hover:bg-gray-200/80 text-apple-text border border-apple-border rounded-lg text-[11px] font-medium cursor-pointer transition">
                  <span id="refBgUploadBtnText">上传参考图</span>
                  <input type="file" accept="image/*" class="hidden" onchange="handleRefBgUpload(this)" />
                </label>
                <button type="button" id="clearRefBgBtn" onclick="clearRefBgImage()" class="hidden px-2 py-1 text-[11px] text-red-600 hover:bg-red-50 rounded-lg border border-red-200 transition cursor-pointer">清除</button>
              </div>
            </div>

            <!-- 参考图参数控制面板（仅当已上传参考图时展开） -->
            <div id="refBgControlsPanel" class="hidden p-2.5 bg-gray-50/90 rounded-xl border border-apple-border space-y-2.5">
              <div class="flex items-center gap-2.5">
                <img id="refBgThumb" src="" class="w-10 h-10 object-cover rounded-lg border border-gray-200 bg-white shrink-0" />
                <div class="flex-1 min-w-0">
                  <p id="refBgFileName" class="text-xs font-medium text-apple-text truncate">reference.png</p>
                  <div class="flex items-center gap-2 mt-1">
                    <span class="text-[11px] text-apple-subtext shrink-0">透明度</span>
                    <input type="range" id="refBgOpacityRange" min="0" max="100" value="40"
                      oninput="updateRefBgOpacity(this.value)"
                      class="flex-1 h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-apple-blue" />
                    <span id="refBgOpacityLabel" class="text-[11px] font-mono font-medium text-apple-text w-9 text-right">40%</span>
                  </div>
                </div>
              </div>

              <div class="flex items-center justify-between pt-1 border-t border-gray-200/70">
                <label class="inline-flex items-center gap-1.5 text-[11px] font-medium text-apple-text cursor-pointer">
                  <input type="checkbox" id="refBgHideOnExportCheck" checked onchange="updateRefBgHideOnExport(this.checked)"
                    class="rounded border-gray-300 text-apple-blue focus:ring-apple-blue" />
                  <span>导出时隐藏参考背景图</span>
                </label>
                <select id="refBgFitModeSelect" onchange="updateRefBgFitMode(this.value)"
                  class="text-[11px] bg-white border border-apple-border rounded-md px-1.5 py-0.5 text-apple-text focus:outline-none">
                  <option value="stretch">铺满画布</option>
                  <option value="contain">等比居中</option>
                </select>
              </div>
            </div>
          </div>
        </section>

        <!-- 卡片 2：内容元素（图层列表与添加按钮栏） -->
        <section class="space-y-3">
          <div class="bg-apple-card rounded-2xl border border-apple-border p-3 shadow-2xs space-y-2.5">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-1.5">
                <i data-lucide="layers-2" class="w-4 h-4 text-apple-text"></i>
                <h2 class="text-xs font-semibold uppercase tracking-wider text-apple-text">添加内容元素</h2>
              </div>
              <span id="layerCountBadge" class="text-[11px] font-mono text-apple-subtext">0 个图层</span>
            </div>

            <!-- 5 种元素快捷添加按钮组 -->
            <div class="grid grid-cols-5 gap-1.5">
              <button type="button" onclick="addTextLayer()" class="flex flex-col items-center justify-center gap-1 py-2 px-1 rounded-xl text-[11px] font-medium bg-gray-50 hover:bg-blue-50/70 hover:text-apple-blue hover:border-blue-200 text-apple-text border border-apple-border transition active:scale-95 cursor-pointer">
                <i data-lucide="type" class="w-4 h-4 text-apple-blue"></i>
                <span>+ 文字</span>
              </button>
              <button type="button" onclick="addImageLayer()" class="flex flex-col items-center justify-center gap-1 py-2 px-1 rounded-xl text-[11px] font-medium bg-gray-50 hover:bg-emerald-50/70 hover:text-emerald-700 hover:border-emerald-200 text-apple-text border border-apple-border transition active:scale-95 cursor-pointer">
                <i data-lucide="image-plus" class="w-4 h-4 text-emerald-600"></i>
                <span>+ 图片</span>
              </button>
              <button type="button" onclick="addShapeLayer('rect')" class="flex flex-col items-center justify-center gap-1 py-2 px-1 rounded-xl text-[11px] font-medium bg-gray-50 hover:bg-amber-50/70 hover:text-amber-700 hover:border-amber-200 text-apple-text border border-apple-border transition active:scale-95 cursor-pointer">
                <i data-lucide="square" class="w-4 h-4 text-amber-600"></i>
                <span>+ 矩形</span>
              </button>
              <button type="button" onclick="addShapeLayer('ellipse')" class="flex flex-col items-center justify-center gap-1 py-2 px-1 rounded-xl text-[11px] font-medium bg-gray-50 hover:bg-purple-50/70 hover:text-purple-700 hover:border-purple-200 text-apple-text border border-apple-border transition active:scale-95 cursor-pointer">
                <i data-lucide="circle" class="w-4 h-4 text-purple-600"></i>
                <span>+ 椭圆形</span>
              </button>
              <button type="button" onclick="addShapeLayer('line')" class="flex flex-col items-center justify-center gap-1 py-2 px-1 rounded-xl text-[11px] font-medium bg-gray-50 hover:bg-rose-50/70 hover:text-rose-700 hover:border-rose-200 text-apple-text border border-apple-border transition active:scale-95 cursor-pointer">
                <i data-lucide="minus" class="w-4 h-4 text-rose-600"></i>
                <span>+ 直线</span>
              </button>
            </div>
          </div>

          <!-- 图层列表容器 -->
          <div id="layersContainer" class="space-y-3 pb-8"></div>
        </section>

      </div>
    </aside>

    <!-- 右侧实时预览界面 -->
    <section class="flex-1 flex flex-col h-[48vh] lg:h-full canvas-workspace-bg relative overflow-hidden">
      
      <!-- 预览顶部浮动工具条 -->
      <div class="px-4 py-2 flex items-center justify-between bg-white/80 backdrop-blur-md border-b border-apple-border/80 z-10 gap-2">
        <div class="flex items-center gap-2.5 text-xs text-apple-subtext truncate">
          <span class="inline-flex items-center gap-1.5 font-medium text-apple-text shrink-0">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            实时预览画布
          </span>
          <span class="hidden sm:inline text-gray-300">|</span>
          <span class="hidden sm:inline truncate">点击选中对象，拖拽移动或拉动蓝色控制点缩放（按住 Shift 等比）</span>
        </div>

        <div class="flex items-center gap-3 shrink-0">
          <label class="inline-flex items-center gap-1.5 text-xs text-apple-text cursor-pointer">
            <input type="checkbox" id="showRulerCheck" checked onchange="renderPreview()" class="rounded border-gray-300 text-apple-blue focus:ring-apple-blue" />
            <span>坐标网格与辅助框</span>
          </label>
          <span id="zoomScaleBadge" class="text-[11px] font-mono px-2 py-0.5 rounded bg-white border border-apple-border text-apple-subtext">100%</span>
        </div>
      </div>

      <!-- 画布居中展示区 -->
      <div id="canvasViewport" class="flex-1 flex items-center justify-center p-6 overflow-hidden relative">
        <div id="canvasWrapper" class="relative shadow-[0_12px_40px_rgba(0,0,0,0.12)] bg-white transition-shadow">
          <canvas id="previewCanvas" class="block"></canvas>
        </div>
      </div>

      <!-- 底部翻页控制器 -->
      <div class="h-14 bg-white/90 backdrop-blur-md border-t border-apple-border px-4 flex items-center justify-between shrink-0 z-10">
        <div class="text-xs text-apple-subtext flex items-center gap-2 truncate">
          <i data-lucide="database" class="w-3.5 h-3.5 text-apple-blue shrink-0"></i>
          <span id="variableSummaryText" class="truncate">当前无批量变量（共 1 页静态预览）</span>
        </div>

        <!-- 翻页按钮组 -->
        <div class="flex items-center gap-2 shrink-0">
          <button type="button" id="prevPageBtn" onclick="changePage(-1)" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium bg-white hover:bg-gray-50 disabled:opacity-40 disabled:pointer-events-none text-apple-text border border-apple-border shadow-2xs transition cursor-pointer">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
            <span>上一页</span>
          </button>

          <div class="flex items-center gap-1.5 bg-gray-100 px-2.5 py-1 rounded-lg border border-apple-border text-xs font-mono">
            <span>第</span>
            <input type="number" id="currentPageInput" value="1" min="1" onchange="jumpToPage(this.value)"
              class="w-10 text-center bg-white border border-gray-300 rounded px-1 py-0.5 text-xs font-semibold text-apple-text focus:outline-none focus:border-apple-blue" />
            <span>/ <span id="totalPagesLabel">1</span> 页</span>
          </div>

          <button type="button" id="nextPageBtn" onclick="changePage(1)" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium bg-white hover:bg-gray-50 disabled:opacity-40 disabled:pointer-events-none text-apple-text border border-apple-border shadow-2xs transition cursor-pointer">
            <span>下一页</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- 导出进度遮罩模态框 -->
  <div id="exportModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-apple-border shadow-2xl max-w-md w-full p-6 space-y-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-blue-50 text-apple-blue flex items-center justify-center shrink-0">
          <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
        </div>
        <div>
          <h3 id="exportModalTitle" class="text-sm font-semibold text-apple-text">正在生成 300 PPI 高清批量文件...</h3>
          <p id="exportModalDesc" class="text-xs text-apple-subtext mt-0.5">请勿关闭页面，正在渲染第 1 / 1 张</p>
        </div>
      </div>

      <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden border border-gray-200">
        <div id="exportProgressBar" class="bg-apple-blue h-full rounded-full transition-all duration-150" style="width: 0%"></div>
      </div>

      <div class="flex justify-between text-[11px] font-mono text-apple-subtext">
        <span id="exportProgressPercent">0%</span>
        <span id="exportResolutionInfo">300 PPI · 物理精确尺寸</span>
      </div>
    </div>
  </div>

  <!-- 轻量级提示 Toast -->
  <div id="toastContainer" class="fixed bottom-16 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    /**
     * ============================================================================
     * 1. 核心常量与物理单位换算工具 (300 PPI 标准)
     * ============================================================================
     */
    const PPI = 300;
    const MM_PER_INCH = 25.4;
    const PT_PER_INCH = 72;

    // 24种常用印刷与设计推荐色（前8个作为单行默认精简推荐色）
    const PRESET_COLORS = [
      '#FFFFFF', '#000000', '#1D1D1F', '#8E8E93', '#FF3B30', '#007AFF', '#34C759', '#FF9500',
      '#F5F5F7', '#E5E5EA', '#3A3A3C', '#FFCC00', '#00C7BE', '#30B0C7', '#5856D6', '#AF52DE',
      '#FF2D55', '#A2845E', '#FFF8E7', '#E8F4FD', '#EAFBF0', '#FDF2F2', '#1B365D', '#8B0000'
    ];

    const FONT_OPTIONS = [
      { label: '思源黑体 / Noto Sans SC', value: '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif' },
      { label: '思源宋体 / Noto Serif SC', value: '"Noto Serif SC", "Songti SC", "SimSun", serif' },
      { label: '苹方 / PingFang SC', value: '"PingFang SC", "Noto Sans SC", sans-serif' },
      { label: '微软雅黑 / Microsoft YaHei', value: '"Microsoft YaHei", "Noto Sans SC", sans-serif' },
      { label: '黑体 / SimHei', value: '"SimHei", "Noto Sans SC", sans-serif' },
      { label: '楷体 / KaiTi', value: '"KaiTi", "STKaiti", serif' },
      { label: 'Inter (现代无衬线)', value: '"Inter", "Helvetica Neue", Arial, sans-serif' },
      { label: 'Helvetica / Arial', value: 'Helvetica, Arial, sans-serif' },
      { label: 'Times New Roman', value: '"Times New Roman", Times, serif' },
      { label: 'Courier New (等宽)', value: '"Courier New", Courier, monospace' }
    ];

    function mmToPx(mm) {
      return (mm / MM_PER_INCH) * PPI;
    }

    function pxToMm(px) {
      return (px / PPI) * MM_PER_INCH;
    }

    function mmToUnit(mm, unit) {
      return unit === 'pt' ? (mm / MM_PER_INCH) * PT_PER_INCH : mm;
    }

    function unitToMm(val, unit) {
      const num = parseFloat(val);
      if (isNaN(num)) return 0;
      return unit === 'pt' ? (num / PT_PER_INCH) * MM_PER_INCH : num;
    }

    function formatDisplayNum(mmVal, unit) {
      const converted = mmToUnit(mmVal, unit);
      return Number(converted.toFixed(2));
    }

    /**
     * ============================================================================
     * 2. 全局状态定义
     * ============================================================================
     */
    const state = {
      projectName: '未命名项目',
      unit: 'mm', // 'mm' | 'pt'
      canvasWidthMm: 150,
      canvasHeightMm: 100,
      canvasBgColor: '#FFFFFF',
      // 参考背景图配置
      refBgImage: null, // { name, src, imgObj, naturalWidth, naturalHeight }
      refBgOpacity: 0.4,
      refBgHideOnExport: true,
      refBgFitMode: 'stretch', // 'stretch' | 'contain'

      currentPage: 1,
      selectedLayerId: null,
      layers: []
    };

    // 记录各色板的展开/收起状态（默认全部折叠为单行）
    const paletteExpandedMap = {};

    // 画布交互（移动 + 8向手柄缩放）状态
    const interactState = {
      mode: 'none', // 'none' | 'move' | 'resize'
      handle: null, // 'nw' | 'n' | 'ne' | 'e' | 'se' | 's' | 'sw' | 'w'
      layerId: null,
      startMouseXMm: 0,
      startMouseYMm: 0,
      origXMm: 0,
      origYMm: 0,
      origWMm: 0,
      origHMm: 0,
      origFontSizeMm: 0,
      previewScale: 1
    };

    // 缓存当前页各图层的实时计算包围盒（用于精确点击命中与渲染缩放手柄）
    const computedBoundsMap = {};

    let layerIdCounter = 1;

    /**
     * ============================================================================
     * 3. 单行可折叠色板全局组件 (保证所有位置默认严格单行显示)
     * ============================================================================
     */
    function renderCompactColorPalette({ paletteId, label, currentColor, onChangeExpr, allowTransparent = false, isTransparent = false, onToggleTransparentExpr = '' }) {
      const isExpanded = !!paletteExpandedMap[paletteId];
      const topRowColors = PRESET_COLORS.slice(0, 8);

      return `
        <div class="space-y-1.5">
          <!-- 单行核心区：标签 + 当前色指示 + 8个高频色块 + 展开按钮 -->
          <div class="flex items-center justify-between gap-1.5">
            <div class="flex items-center gap-1.5 shrink-0">
              <span class="text-[11px] font-medium text-apple-subtext">${label}</span>
              ${allowTransparent ? `
                <label class="inline-flex items-center gap-1 text-[10px] text-apple-subtext cursor-pointer bg-gray-100 px-1.5 py-0.5 rounded border border-gray-200">
                  <input type="checkbox" ${isTransparent ? 'checked' : ''} onchange="${onToggleTransparentExpr}" class="rounded text-apple-blue w-3 h-3" />
                  <span>无填充</span>
                </label>
              ` : ''}
            </div>

            <div class="flex items-center gap-1 ${isTransparent ? 'opacity-40 pointer-events-none' : ''}">
              <!-- 当前颜色预览小圆点 -->
              <span class="w-4 h-4 rounded-full border border-black/20 shrink-0 mr-0.5 shadow-2xs" style="background-color: ${currentColor};" title="当前颜色: ${currentColor}"></span>
              
              <!-- 单行 8 个高频色块 -->
              <div class="flex items-center gap-1">
                ${topRowColors.map(hex => `
                  <button type="button" onclick="${onChangeExpr.replace('__COLOR__', hex)}"
                    style="background-color: ${hex};"
                    title="${hex}"
                    class="w-4 h-4 rounded-[4px] border ${currentColor.toUpperCase() === hex ? 'border-apple-blue ring-1 ring-apple-blue scale-110' : 'border-black/15'} hover:scale-110 transition-transform cursor-pointer shrink-0"></button>
                `).join('')}
              </div>

              <!-- 展开/收起按钮 -->
              <button type="button" onclick="toggleColorPalette('${paletteId}')"
                title="${isExpanded ? '收起完整色板' : '展开完整色板与色环'}"
                class="ml-0.5 px-1.5 h-5 rounded bg-gray-100 hover:bg-gray-200/80 border border-apple-border text-[10px] text-apple-subtext hover:text-apple-text flex items-center justify-center transition cursor-pointer shrink-0">
                <span>${isExpanded ? '▲' : '▼'}</span>
              </button>
            </div>
          </div>

          <!-- 展开面板：完整 24 色 + 原生色环 + HEX 输入 -->
          ${isExpanded && !isTransparent ? `
            <div class="p-2.5 bg-gray-50/90 rounded-xl border border-apple-border space-y-2 transition-all">
              <div class="grid grid-cols-12 gap-1">
                ${PRESET_COLORS.map(hex => `
                  <button type="button" onclick="${onChangeExpr.replace('__COLOR__', hex)}"
                    style="background-color: ${hex};"
                    title="${hex}"
                    class="w-full aspect-square rounded-[4px] border ${currentColor.toUpperCase() === hex ? 'border-apple-blue ring-1 ring-apple-blue' : 'border-black/15'} hover:scale-110 transition-transform cursor-pointer"></button>
                `).join('')}
              </div>
              <div class="flex items-center justify-between pt-1.5 border-t border-gray-200/70">
                <span class="text-[11px] text-apple-subtext">自定义色环 / 色值：</span>
                <div class="flex items-center gap-1.5">
                  <input type="color" value="${currentColor}"
                    oninput="${onChangeExpr.replace('__COLOR__', "' + this.value.toUpperCase() + '")}"
                    class="w-6 h-5 rounded cursor-pointer" title="打开系统色环" />
                  <input type="text" value="${currentColor}" maxlength="7"
                    onchange="${onChangeExpr.replace('__COLOR__', "' + this.value.toUpperCase() + '")}"
                    class="w-20 px-2 py-0.5 text-[11px] font-mono uppercase bg-white border border-apple-border rounded focus:outline-none focus:border-apple-blue" />
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function toggleColorPalette(paletteId) {
      paletteExpandedMap[paletteId] = !paletteExpandedMap[paletteId];
      renderCanvasBgPaletteUI();
      renderLayersUI();
    }

    function renderCanvasBgPaletteUI() {
      const container = document.getElementById('canvasBgPaletteContainer');
      if (!container) return;
      container.innerHTML = renderCompactColorPalette({
        paletteId: 'canvas_bg',
        label: '画布背景色',
        currentColor: state.canvasBgColor,
        onChangeExpr: `updateCanvasBgColor('__COLOR__')`
      });
    }

    /**
     * ============================================================================
     * 4. 初始化与默认示例数据
     * ============================================================================
     */
    function measureTextDimensionsMm(text, fontSizeMm, letterSpacingMm, lineHeightRatio, fontWeight, fontFamily) {
      const tempCanvas = document.createElement('canvas');
      const ctx = tempCanvas.getContext('2d');
      const fontSizePx = mmToPx(fontSizeMm);
      const letterSpacingPx = mmToPx(letterSpacingMm);
      const lineHeightPx = fontSizePx * (lineHeightRatio || 1.2);

      ctx.font = `${fontWeight} ${fontSizePx}px ${fontFamily}`;
      const lines = (text || '').split('\n');
      let maxWidthPx = 0;

      lines.forEach(line => {
        const chars = Array.from(line);
        let lineW = 0;
        chars.forEach((ch, idx) => {
          lineW += ctx.measureText(ch).width + (idx < chars.length - 1 ? letterSpacingPx : 0);
        });
        maxWidthPx = Math.max(maxWidthPx, lineW);
      });

      const totalHeightPx = Math.max(fontSizePx, lines.length * lineHeightPx);
      return {
        widthMm: pxToMm(maxWidthPx),
        heightMm: pxToMm(totalHeightPx)
      };
    }

    function initApp() {
      renderCanvasBgPaletteUI();

      // 计算主标题与副标题在 150×100mm 画布上的居中坐标
      const mainTitleText = '名称';
      const mainTitleFontSizeMm = 14; // 约 40pt，醒目主标题字号
      const mainTitleLetterSpacingMm = 1.5;
      const mainTitleFont = FONT_OPTIONS[0].value;
      const mainDims = measureTextDimensionsMm(
        mainTitleText,
        mainTitleFontSizeMm,
        mainTitleLetterSpacingMm,
        1.2,
        '700',
        mainTitleFont
      );

      const subTitleText = '编号123456789';
      const subTitleFontSizeMm = 6.5; // 约 18.5pt，清晰副标题字号
      const subTitleLetterSpacingMm = 0.5;
      const subTitleFont = FONT_OPTIONS[0].value;
      const subDims = measureTextDimensionsMm(
        subTitleText,
        subTitleFontSizeMm,
        subTitleLetterSpacingMm,
        1.2,
        '500',
        subTitleFont
      );

      // 垂直组合整体居中（主副标题间距 5mm）
      const verticalGapMm = 5;
      const totalGroupHeightMm = mainDims.heightMm + verticalGapMm + subDims.heightMm;
      const groupStartYMm = (state.canvasHeightMm - totalGroupHeightMm) / 2;

      const mainTitleLayer = {
        id: 'layer_' + (layerIdCounter++),
        type: 'text',
        name: '主标题',
        collapsed: false,
        styleCollapsed: true,
        text: mainTitleText,
        useVariable: false,
        variables: [''],
        fontFamily: mainTitleFont,
        customFont: '',
        fontWeight: '700',
        fontSizeMm: mainTitleFontSizeMm,
        letterSpacingMm: mainTitleLetterSpacingMm,
        lineHeightRatio: 1.2,
        color: '#1D1D1F',
        anchor: 'center', // 'left' | 'center' | 'right'
        xMm: Number((state.canvasWidthMm / 2).toFixed(2)),
        yMm: Number(groupStartYMm.toFixed(2)),
        constrainBox: false,
        boxWidthMm: 90,
        boxHeightMm: 22
      };

      const subTitleLayer = {
        id: 'layer_' + (layerIdCounter++),
        type: 'text',
        name: '副标题',
        collapsed: false,
        styleCollapsed: true,
        text: subTitleText,
        useVariable: false,
        variables: [''],
        fontFamily: subTitleFont,
        customFont: '',
        fontWeight: '500',
        fontSizeMm: subTitleFontSizeMm,
        letterSpacingMm: subTitleLetterSpacingMm,
        lineHeightRatio: 1.2,
        color: '#515154',
        anchor: 'center', // 'left' | 'center' | 'right'
        xMm: Number((state.canvasWidthMm / 2).toFixed(2)),
        yMm: Number((groupStartYMm + mainDims.heightMm + verticalGapMm).toFixed(2)),
        constrainBox: false,
        boxWidthMm: 90,
        boxHeightMm: 14
      };

      state.layers = [mainTitleLayer, subTitleLayer];
      state.selectedLayerId = mainTitleLayer.id;

      syncCanvasInputs();
      syncRefBgUI();
      renderLayersUI();
      updatePaginationState();
      setupCanvasInteractions();
      renderPreview();

      window.addEventListener('resize', renderPreview);
    }

    /**
     * ============================================================================
     * 5. 画布基础设置、参考背景图及 Toast 提示逻辑
     * ============================================================================
     */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      const colorMap = {
        success: 'bg-[#1D1D1F] text-white border-emerald-500/40',
        error: 'bg-red-600 text-white border-red-400',
        info: 'bg-[#1D1D1F] text-white border-gray-700'
      };
      toast.className = `px-3.5 py-2.5 rounded-xl text-xs font-medium shadow-lg border backdrop-blur-md transition-all duration-200 ${colorMap[type] || colorMap.info}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        setTimeout(() => toast.remove(), 220);
      }, 2800);
    }

    function updateProjectName(val) {
      state.projectName = val;
    }

    function switchUnit(newUnit) {
      if (state.unit === newUnit) return;
      state.unit = newUnit;
      const btnMm = document.getElementById('unitBtnMm');
      const btnPt = document.getElementById('unitBtnPt');
      if (newUnit === 'mm') {
        btnMm.className = 'py-1 text-xs font-semibold rounded-md bg-white text-apple-text shadow-2xs transition cursor-pointer';
        btnPt.className = 'py-1 text-xs font-medium rounded-md text-apple-subtext hover:text-apple-text transition cursor-pointer';
      } else {
        btnPt.className = 'py-1 text-xs font-semibold rounded-md bg-white text-apple-text shadow-2xs transition cursor-pointer';
        btnMm.className = 'py-1 text-xs font-medium rounded-md text-apple-subtext hover:text-apple-text transition cursor-pointer';
      }
      document.querySelectorAll('.unit-label').forEach(el => el.textContent = newUnit);
      syncCanvasInputs();
      renderLayersUI();
    }

    function syncCanvasInputs() {
      const wInput = document.getElementById('canvasWidthInput');
      const hInput = document.getElementById('canvasHeightInput');
      if (wInput) wInput.value = formatDisplayNum(state.canvasWidthMm, state.unit);
      if (hInput) hInput.value = formatDisplayNum(state.canvasHeightMm, state.unit);

      const physW = Math.max(1, Math.round(mmToPx(state.canvasWidthMm)));
      const physH = Math.max(1, Math.round(mmToPx(state.canvasHeightMm)));
      const badge = document.getElementById('pixelResolutionBadge');
      if (badge) badge.textContent = `${physW} × ${physH} px`;
    }

    function updateCanvasSize(dim, val) {
      const mmVal = Math.max(1, unitToMm(val, state.unit));
      if (dim === 'width') state.canvasWidthMm = Number(mmVal.toFixed(2));
      else state.canvasHeightMm = Number(mmVal.toFixed(2));
      syncCanvasInputs();
      renderPreview();
    }

    function updateCanvasBgColor(hex) {
      if (!/^#[0-9A-Fa-f]{6}$/.test(hex)) return;
      state.canvasBgColor = hex.toUpperCase();
      renderCanvasBgPaletteUI();
      renderPreview();
    }

    function loadImageFromDataUrl(src, name) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          resolve({
            name: name || 'image.png',
            src,
            imgObj: img,
            naturalWidth: img.naturalWidth,
            naturalHeight: img.naturalHeight
          });
        };
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handleRefBgUpload(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      try {
        const dataUrl = await readFileAsDataUrl(file);
        const loaded = await loadImageFromDataUrl(dataUrl, file.name);
        if (loaded) {
          state.refBgImage = loaded;
          syncRefBgUI();
          renderPreview();
          showToast(`已载入参考背景图：${file.name}`, 'success');
        }
      } catch (e) {
        showToast('参考背景图读取失败', 'error');
      } finally {
        input.value = '';
      }
    }

    function clearRefBgImage() {
      state.refBgImage = null;
      syncRefBgUI();
      renderPreview();
    }

    function updateRefBgOpacity(val) {
      state.refBgOpacity = Math.min(1, Math.max(0, Number(val) / 100));
      const label = document.getElementById('refBgOpacityLabel');
      if (label) label.textContent = `${Math.round(state.refBgOpacity * 100)}%`;
      renderPreview();
    }

    function updateRefBgHideOnExport(checked) {
      state.refBgHideOnExport = !!checked;
    }

    function updateRefBgFitMode(mode) {
      state.refBgFitMode = mode;
      renderPreview();
    }

    function syncRefBgUI() {
      const panel = document.getElementById('refBgControlsPanel');
      const clearBtn = document.getElementById('clearRefBgBtn');
      const uploadBtnText = document.getElementById('refBgUploadBtnText');
      if (!panel) return;

      if (state.refBgImage) {
        panel.classList.remove('hidden');
        clearBtn.classList.remove('hidden');
        uploadBtnText.textContent = '更换参考图';
        document.getElementById('refBgThumb').src = state.refBgImage.src;
        document.getElementById('refBgFileName').textContent = state.refBgImage.name;
        const pct = Math.round(state.refBgOpacity * 100);
        document.getElementById('refBgOpacityRange').value = pct;
        document.getElementById('refBgOpacityLabel').textContent = `${pct}%`;
        document.getElementById('refBgHideOnExportCheck').checked = state.refBgHideOnExport;
        document.getElementById('refBgFitModeSelect').value = state.refBgFitMode;
      } else {
        panel.classList.add('hidden');
        clearBtn.classList.add('hidden');
        uploadBtnText.textContent = '上传参考图';
      }
    }

    /**
     * ============================================================================
     * 6. 图层增删改查与变量数据处理
     * ============================================================================
     */
    function addTextLayer() {
      const count = state.layers.filter(l => l.type === 'text').length + 1;
      const newLayer = {
        id: 'layer_' + (layerIdCounter++),
        type: 'text',
        name: `文字图层 ${count}`,
        collapsed: false,
        styleCollapsed: true,
        text: '双击或在此输入文字',
        useVariable: false,
        variables: [''],
        fontFamily: FONT_OPTIONS[0].value,
        customFont: '',
        fontWeight: '400',
        fontSizeMm: 8,
        letterSpacingMm: 0,
        lineHeightRatio: 1.2,
        color: '#1D1D1F',
        anchor: 'left',
        xMm: 15,
        yMm: 15 + (count - 1) * 8,
        constrainBox: false,
        boxWidthMm: 60,
        boxHeightMm: 15
      };
      state.layers.push(newLayer);
      state.selectedLayerId = newLayer.id;
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function addImageLayer() {
      const count = state.layers.filter(l => l.type === 'image').length + 1;
      const newLayer = {
        id: 'layer_' + (layerIdCounter++),
        type: 'image',
        name: `图片图层 ${count}`,
        collapsed: false,
        useVariable: false,
        singleImage: null,
        variableImages: [],
        widthMm: 40,
        heightMm: 40,
        lockAspectRatio: true,
        xMm: 20,
        yMm: 20
      };
      state.layers.push(newLayer);
      state.selectedLayerId = newLayer.id;
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function addShapeLayer(shapeType) {
      const labelMap = { rect: '矩形', ellipse: '椭圆形', line: '直线' };
      const count = state.layers.filter(l => l.type === shapeType).length + 1;
      const newLayer = {
        id: 'layer_' + (layerIdCounter++),
        type: shapeType,
        name: `${labelMap[shapeType]} ${count}`,
        collapsed: false,
        xMm: 25,
        yMm: 25,
        widthMm: shapeType === 'line' ? 60 : 45,
        heightMm: shapeType === 'line' ? 0 : 30,
        lineDirection: 'tl-br',
        fillColor: '#E8F4FD',
        fillTransparent: shapeType === 'line',
        strokeColor: '#1D1D1F',
        strokeWidthMm: 0.5,
        strokeDashed: false,
        dashLengthMm: 2,
        dashGapMm: 1.5
      };
      state.layers.push(newLayer);
      state.selectedLayerId = newLayer.id;
      renderLayersUI();
      renderPreview();
    }

    function toggleLayerCollapse(id) {
      const layer = state.layers.find(l => l.id === id);
      if (layer) {
        layer.collapsed = !layer.collapsed;
        renderLayersUI();
      }
    }

    function toggleTextStyleCollapse(id) {
      const layer = state.layers.find(l => l.id === id);
      if (layer) {
        layer.styleCollapsed = layer.styleCollapsed === false ? true : false;
        renderLayersUI();
      }
    }

    function selectLayer(id) {
      if (state.selectedLayerId !== id) {
        state.selectedLayerId = id;
        renderLayersUI();
        renderPreview();
      }
    }

    function moveLayer(id, direction) {
      const idx = state.layers.findIndex(l => l.id === id);
      if (idx === -1) return;
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= state.layers.length) return;
      const [item] = state.layers.splice(idx, 1);
      state.layers.splice(targetIdx, 0, item);
      renderLayersUI();
      renderPreview();
    }

    function duplicateLayer(id) {
      const layer = state.layers.find(l => l.id === id);
      if (!layer) return;
      const copy = JSON.parse(JSON.stringify(layer));
      copy.id = 'layer_' + (layerIdCounter++);
      copy.name = layer.name + ' 副本';
      copy.xMm = Number((layer.xMm + 5).toFixed(2));
      copy.yMm = Number((layer.yMm + 5).toFixed(2));
      if (layer.type === 'image') {
        copy.singleImage = layer.singleImage ? { ...layer.singleImage } : null;
        copy.variableImages = (layer.variableImages || []).map(v => ({ ...v }));
      }
      state.layers.push(copy);
      state.selectedLayerId = copy.id;
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function deleteLayer(id) {
      state.layers = state.layers.filter(l => l.id !== id);
      if (state.selectedLayerId === id) {
        state.selectedLayerId = state.layers.length ? state.layers[state.layers.length - 1].id : null;
      }
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function setLinePresetOrientation(id, orientation) {
      const layer = state.layers.find(l => l.id === id);
      if (!layer || layer.type !== 'line') return;
      if (orientation === 'horizontal') {
        if (layer.widthMm < 5) layer.widthMm = Math.max(20, layer.heightMm || 50);
        layer.heightMm = 0;
      } else if (orientation === 'vertical') {
        if (layer.heightMm < 5) layer.heightMm = Math.max(20, layer.widthMm || 40);
        layer.widthMm = 0;
      }
      renderLayersUI();
      renderPreview();
    }

    function setTextAnchor(id, newAnchor) {
      const layer = state.layers.find(l => l.id === id);
      if (!layer || layer.type !== 'text') return;
      const oldAnchor = layer.anchor || 'left';
      if (oldAnchor === newAnchor) return;

      const b = computedBoundsMap[layer.id];
      if (b && typeof b.wMm === 'number') {
        const leftEdge = b.xMm;
        const w = b.wMm;
        let nextX = leftEdge;
        if (newAnchor === 'center') nextX = leftEdge + w / 2;
        else if (newAnchor === 'right') nextX = leftEdge + w;
        layer.xMm = Number(nextX.toFixed(2));
      }

      layer.anchor = newAnchor;
      renderLayersUI();
      renderPreview();
    }

    function updateLayerProp(id, prop, value, convertFromUnit = false, forceRerender = false) {
      const layer = state.layers.find(l => l.id === id);
      if (!layer) return;

      let parsedVal = value;
      if (convertFromUnit) {
        parsedVal = Number(unitToMm(value, state.unit).toFixed(3));
        if (['fontSizeMm', 'widthMm', 'heightMm', 'boxWidthMm', 'boxHeightMm'].includes(prop)) {
          const minAllowed = layer.type === 'line' ? 0 : 0.5;
          parsedVal = Math.max(minAllowed, parsedVal);
        }
        if (prop === 'strokeWidthMm') parsedVal = Math.max(0, parsedVal);
      }

      if (layer.type === 'image' && layer.lockAspectRatio && (prop === 'widthMm' || prop === 'heightMm')) {
        const activeImg = getActiveImageForLayer(layer, state.currentPage);
        const ratio = activeImg && activeImg.naturalHeight > 0
          ? activeImg.naturalWidth / activeImg.naturalHeight
          : (layer.heightMm > 0 ? layer.widthMm / layer.heightMm : 1);

        if (prop === 'widthMm' && parsedVal > 0) {
          layer.widthMm = parsedVal;
          layer.heightMm = Number((parsedVal / ratio).toFixed(2));
          forceRerender = true;
        } else if (prop === 'heightMm' && parsedVal > 0) {
          layer.heightMm = parsedVal;
          layer.widthMm = Number((parsedVal * ratio).toFixed(2));
          forceRerender = true;
        }
      } else {
        layer[prop] = parsedVal;
      }

      let rerenderUI = forceRerender;
      if (prop === 'useVariable') {
        if (value === true && layer.type === 'text') {
          const hasMeaningfulVars = Array.isArray(layer.variables) && layer.variables.some(v => v && v.trim() !== '');
          if (!hasMeaningfulVars) {
            layer.variables = [''];
          }
        }
        updatePaginationState();
        rerenderUI = true;
      }
      if (rerenderUI) {
        renderLayersUI();
      }
      renderPreview();
    }

    // 变量文本表格操作
    function addVariableRow(layerId) {
      const layer = state.layers.find(l => l.id === layerId);
      if (!layer) return;
      layer.variables.push('');
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function removeVariableRow(layerId, index) {
      const layer = state.layers.find(l => l.id === layerId);
      if (!layer) return;
      layer.variables.splice(index, 1);
      if (layer.variables.length === 0) layer.variables.push('');
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function clearVariableRows(layerId) {
      const layer = state.layers.find(l => l.id === layerId);
      if (!layer) return;
      layer.variables = [''];
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function updateVariableRow(layerId, index, val) {
      const layer = state.layers.find(l => l.id === layerId);
      if (!layer) return;
      layer.variables[index] = val;
      renderPreview();
    }

    function handleVariablePaste(event, layerId, startIndex) {
      const pasteText = (event.clipboardData || window.clipboardData).getData('text');
      if (!pasteText || (!pasteText.includes('\n') && !pasteText.includes('\r'))) {
        return; // 单行普通粘贴交由默认输入框处理
      }
      event.preventDefault();
      const layer = state.layers.find(l => l.id === layerId);
      if (!layer) return;

      const rows = pasteText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      if (rows.length > 1 && rows[rows.length - 1] === '') {
        rows.pop();
      }
      if (rows.length === 0) return;

      rows.forEach((cellVal, offset) => {
        const cleanCell = cellVal.split('\t')[0];
        layer.variables[startIndex + offset] = cleanCell;
      });

      renderLayersUI();
      updatePaginationState();
      renderPreview();
      showToast(`已从剪贴板导入 ${rows.length} 条变量数据`, 'success');
    }

    // 图片上传与变量图库操作
    async function handleSingleImageUpload(input, layerId) {
      const file = input.files && input.files[0];
      const layer = state.layers.find(l => l.id === layerId);
      if (!file || !layer) return;

      try {
        const dataUrl = await readFileAsDataUrl(file);
        const loaded = await loadImageFromDataUrl(dataUrl, file.name);
        if (loaded) {
          layer.singleImage = loaded;
          if (loaded.naturalWidth > 0 && loaded.naturalHeight > 0) {
            const aspect = loaded.naturalWidth / loaded.naturalHeight;
            layer.heightMm = Number((layer.widthMm / aspect).toFixed(2));
          }
          renderLayersUI();
          renderPreview();
        }
      } finally {
        input.value = '';
      }
    }

    async function handleBatchImagesUpload(input, layerId) {
      const files = Array.from(input.files || []).filter(f => f.type.startsWith('image/'));
      const layer = state.layers.find(l => l.id === layerId);
      if (!layer || files.length === 0) {
        input.value = '';
        return;
      }

      files.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true }));

      const loadedList = [];
      for (const file of files) {
        const dataUrl = await readFileAsDataUrl(file);
        const loaded = await loadImageFromDataUrl(dataUrl, file.name);
        if (loaded) loadedList.push(loaded);
      }

      if (loadedList.length > 0) {
        layer.variableImages = loadedList;
        const first = loadedList[0];
        if (first.naturalWidth > 0 && first.naturalHeight > 0 && layer.lockAspectRatio) {
          const aspect = first.naturalWidth / first.naturalHeight;
          layer.heightMm = Number((layer.widthMm / aspect).toFixed(2));
        }
        renderLayersUI();
        updatePaginationState();
        renderPreview();
        showToast(`已批量导入 ${loadedList.length} 张变量图片`, 'success');
      }
      input.value = '';
    }

    function removeVariableImage(layerId, idx) {
      const layer = state.layers.find(l => l.id === layerId);
      if (!layer) return;
      layer.variableImages.splice(idx, 1);
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

     * ============================================================================

                              class="flex-1 px-2 py-1 text-xs bg-transparent focus:outline-none focus:bg-blue-50/30" />
                            <button type="button" onclick="removeVariableRow('${layer.id}', ${rIdx})" class="px-2 py-1 text-gray-300 hover:text-red-500 cursor-pointer">×</button>
                          </div>

                      </div>
                    </div>
                  `}
                </div>

                <!-- 可折叠子面板：字体、字号、间距与坐标参数（默认折叠） -->

                  <button type="button" onclick="toggleTextStyleCollapse('${layer.id}')"
                    class="w-full px-2.5 py-2 flex items-center justify-between gap-2 text-left hover:bg-gray-100/70 transition cursor-pointer">
                    <div class="flex items-center gap-1.5 shrink-0">
                      <i data-lucide="${isStyleCollapsed ? 'chevron-right' : 'chevron-down'}" class="w-3.5 h-3.5 text-apple-subtext"></i>
                      <span class="text-[11px] font-medium text-apple-text">字体与位置参数</span>
                    </div>
                    <span class="text-[11px] font-mono text-apple-subtext truncate">${escapeHtml(styleSummary)}</span>
                  </button>

                  <div class="${isStyleCollapsed ? 'hidden' : 'p-2.5 pt-2 border-t border-apple-border/80 bg-white space-y-2.5'}">
                    <!-- 字体与字重 -->
                    <div class="grid grid-cols-12 gap-2">
                      <div class="col-span-7">
                        <label class="block text-[11px] text-apple-subtext mb-1">字体选择</label>

                          class="w-full px-2 py-1.5 text-xs bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue">
                          ${FONT_OPTIONS.map(f => `<option value='${f.value}' ${layer.fontFamily === f.value ? 'selected' : ''}>${f.label}</option>`).join('')}
                        </select>
                      </div>
                      <div class="col-span-5">
                        <label class="block text-[11px] text-apple-subtext mb-1">字重</label>
                        <select onchange="updateLayerProp('${layer.id}', 'fontWeight', this.value)"
                          class="w-full px-2 py-1.5 text-xs bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue">
                          <option value="400" ${layer.fontWeight === '400' ? 'selected' : ''}>Regular (400)</option>
                          <option value="500" ${layer.fontWeight === '500' ? 'selected' : ''}>Medium (500)</option>
                          <option value="700" ${layer.fontWeight === '700' ? 'selected' : ''}>Bold (700)</option>
                          <option value="900" ${layer.fontWeight === '900' ? 'selected' : ''}>Heavy (900)</option>
                        </select>
                      </div>
                    </div>

                    <input type="text" value="${escapeHtml(layer.customFont)}" placeholder="可选：输入本机系统字体精确名称"

                <!-- 基准点（左 / 中 / 右）显性分段控制器 -->

                  <div class="flex items-center justify-between">
                    <span class="text-[11px] font-medium text-apple-text">基准点（对齐方式）</span>
                    <span class="text-[10px] text-apple-subtext">${(layer.anchor || 'left') === 'center' ? '向两侧均匀延伸' : (layer.anchor === 'right' ? '向左侧延伸' : '向右侧延伸')}</span>

                    <button type="button" onclick="setTextAnchor('${layer.id}', 'left')"
                      class="flex items-center justify-center gap-1 py-1 text-xs font-medium rounded-md transition cursor-pointer ${(layer.anchor || 'left') === 'left' ? 'bg-apple-blue text-white shadow-2xs' : 'text-apple-text hover:bg-white/70'}">

                    <button type="button" onclick="setTextAnchor('${layer.id}', 'center')"

                    <span>限制文字对象宽高（自动拉伸适应尺寸）</span>
                  </label>

                  ${layer.constrainBox ? `
                    <div class="grid grid-cols-2 gap-2 mt-2 pl-5">
                      <div>
                        <label class="block text-[11px] text-apple-subtext mb-1">限定宽度 (${u})</label>
                        <input type="number" step="any" id="input_boxw_${layer.id}" value="${formatDisplayNum(layer.boxWidthMm, u)}"
                          onchange="updateLayerProp('${layer.id}', 'boxWidthMm', this.value, true)"
                          class="w-full px-2 py-1 text-xs font-mono bg-blue-50/30 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
