<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>批量图文排版 - 高清矢量与批量排版工作台</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- JSZip & FileSaver for Batch ZIP Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- jsPDF for Multi-page Vector PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- OpenType.js for True Vector Glyph Paths in PDF -->
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '"Noto Sans SC"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            serif: ['"Noto Serif SC"', 'Georgia', 'serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          },
          colors: {
            apple: {
              bg: '#F5F5F7',
              card: '#FFFFFF',
              border: '#E5E5EA',
              text: '#1D1D1F',
              subtext: '#86868B',
              blue: '#0071E3',
              blueHover: '#0077ED'
            }
          }
        }
      }
    };
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #F5F5F7;
      color: #1D1D1F;
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.16);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.28);
    }

    /* 棋盘格透明/工作台背景 */
    .workspace-grid {
      background-color: #EBEBEF;
      background-image:
        linear-gradient(45deg, #E2E2E7 25%, transparent 25%),
        linear-gradient(-45deg, #E2E2E7 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #E2E2E7 75%),
        linear-gradient(-45deg, transparent 75%, #E2E2E7 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    /* 隐藏原生 color input 外框并保持可点击 */
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      padding: 0;
      background: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 6px;
    }

    /* 滑块样式 */
    input[type="range"] {
      accent-color: #0071E3;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

  <!-- 顶部导航栏 -->
  <header class="h-14 bg-white/85 backdrop-blur-md border-b border-apple-border px-4 lg:px-6 flex items-center justify-between shrink-0 z-20 gap-2">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-sm shrink-0">
        <i data-lucide="layers" class="w-4 h-4"></i>
      </div>
      <div class="truncate">
        <h1 class="text-sm font-semibold tracking-tight text-apple-text leading-tight truncate">批量图文排版</h1>
        <p class="text-[11px] text-apple-subtext hidden sm:block">300–600 PPI 超清位图 &amp; 真矢量 PDF 排版工作台</p>
      </div>
    </div>

    <!-- 最右侧：模板导入导出 & 批量导出按钮组 -->
    <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
      <div id="exportStatusBadge" class="hidden md:flex items-center gap-1.5 text-xs text-apple-blue bg-blue-50 px-2.5 py-1 rounded-full font-medium">
        <span class="w-2 h-2 rounded-full bg-apple-blue animate-pulse"></span>
        <span id="exportStatusText">正在处理...</span>
      </div>

      <!-- 导入模板 -->
      <input type="file" id="templateFileInput" accept=".json,application/json" class="hidden" onchange="handleImportTemplate(this)" />
      <button id="btnImportTemplate" onclick="document.getElementById('templateFileInput').click()"
        title="导入之前保存的 JSON 模板文件恢复全部设定"
        class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-gray-100/90 border border-apple-border text-apple-text hover:bg-gray-200/70 active:scale-[0.99] transition shadow-2xs cursor-pointer">
        <i data-lucide="folder-open" class="w-3.5 h-3.5 text-amber-600"></i>
        <span class="hidden sm:inline">导入模板</span>
      </button>

      <!-- 导出设定模板 -->
      <button id="btnExportTemplate" onclick="exportTemplateConfig()"
        title="将当前画布设置、图层参数与变量数据导出为模板文件"
        class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-gray-100/90 border border-apple-border text-apple-text hover:bg-gray-200/70 active:scale-[0.99] transition shadow-2xs cursor-pointer">
        <i data-lucide="save" class="w-3.5 h-3.5 text-indigo-600"></i>
        <span class="hidden sm:inline">导出模板</span>
      </button>

      <div class="h-4 w-px bg-apple-border mx-0.5"></div>

      <button id="btnExportJpg" onclick="handleBatchExport('jpg')"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-white border border-apple-border text-apple-text hover:bg-gray-50 active:scale-[0.99] transition shadow-2xs cursor-pointer">
        <i data-lucide="file-image" class="w-3.5 h-3.5 text-apple-subtext"></i>
        <span>导出 JPG</span>
      </button>

      <button id="btnExportPng" onclick="handleBatchExport('png')"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-white border border-apple-border text-apple-text hover:bg-gray-50 active:scale-[0.99] transition shadow-2xs cursor-pointer">
        <i data-lucide="image" class="w-3.5 h-3.5 text-apple-subtext"></i>
        <span>导出 PNG</span>
      </button>

      <button id="btnExportPdf" onclick="handleBatchExport('pdf')"
        class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-medium bg-apple-blue text-white hover:bg-apple-blueHover active:scale-[0.99] transition shadow-sm cursor-pointer">
        <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
        <span>导出 PDF</span>
      </button>
    </div>
  </header>

  <!-- 主体左右分栏 -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">

    <!-- 左侧：编辑控制面板 -->
    <aside class="w-full lg:w-[440px] xl:w-[470px] bg-apple-bg border-b lg:border-b-0 lg:border-r border-apple-border flex flex-col h-[50vh] lg:h-full shrink-0">
      <div class="flex-1 overflow-y-auto p-4 space-y-4">

        <!-- 卡片 1：项目与画布设置 -->
        <section class="bg-apple-card rounded-2xl border border-apple-border p-4 shadow-2xs space-y-3.5">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="sliders" class="w-4 h-4 text-apple-blue"></i>
              <h2 class="text-xs font-semibold uppercase tracking-wider text-apple-text">基础画布设置</h2>
            </div>
            <span id="pixelInfoBadge" class="text-[11px] font-mono text-apple-subtext bg-gray-100 px-2 py-0.5 rounded-md">
              1772 × 1181 px @ 300 PPI
            </span>
          </div>

          <!-- 项目名称 & 全局单位 -->
          <div class="grid grid-cols-12 gap-2.5">
            <div class="col-span-7">
              <label class="block text-xs font-medium text-apple-subtext mb-1">项目名称</label>
              <input type="text" id="projectNameInput" value="批量设计项目" placeholder="输入项目名称"
                oninput="state.projectName = this.value.trim() || '未命名项目'"
                class="w-full px-3 py-1.5 text-sm bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:bg-white focus:border-apple-blue transition" />
            </div>
            <div class="col-span-5">
              <label class="block text-xs font-medium text-apple-subtext mb-1">全局计量单位</label>
              <div class="grid grid-cols-2 bg-gray-100 p-0.5 rounded-lg border border-apple-border/60">
                <button type="button" id="unitBtnMm" onclick="switchUnit('mm')"
                  class="py-1 text-xs font-medium rounded-md bg-white text-apple-text shadow-2xs transition cursor-pointer">
                  毫米 (mm)
                </button>
                <button type="button" id="unitBtnPt" onclick="switchUnit('pt')"
                  class="py-1 text-xs font-medium rounded-md text-apple-subtext hover:text-apple-text transition cursor-pointer">
                  磅值 (pt)
                </button>
              </div>
            </div>
          </div>

          <!-- 画布宽度与高度（先宽后高） -->
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-xs font-medium text-apple-subtext mb-1">
                画布宽度 (<span class="unit-label">mm</span>)
              </label>
              <input type="number" id="canvasWidthInput" step="any" min="1" value="150"
                onchange="handleCanvasSizeChange('width', this.value)"
                class="w-full px-3 py-1.5 text-sm font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:bg-white focus:border-apple-blue transition" />
            </div>
            <div>
              <label class="block text-xs font-medium text-apple-subtext mb-1">
                画布高度 (<span class="unit-label">mm</span>)
              </label>
              <input type="number" id="canvasHeightInput" step="any" min="1" value="100"
                onchange="handleCanvasSizeChange('height', this.value)"
                class="w-full px-3 py-1.5 text-sm font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:bg-white focus:border-apple-blue transition" />
            </div>
          </div>

          <!-- 画布背景颜色（严格单行色板，点击可展开全部24色与色环） -->
          <div id="canvasBgPaletteContainer" class="pt-1 border-t border-gray-100"></div>

          <!-- 参考背景图（辅助排版，可调节透明度） -->
          <div class="pt-2 border-t border-gray-100 space-y-2">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-1.5">
                <i data-lucide="image-plus" class="w-3.5 h-3.5 text-apple-subtext"></i>
                <span class="text-xs font-medium text-apple-subtext">参考背景图（辅助对齐）</span>
              </div>
              <div class="flex items-center gap-1.5">
                <input type="file" id="refBgFileInput" accept="image/*" class="hidden" onchange="handleRefBgUpload(this)" />
                <button type="button" onclick="document.getElementById('refBgFileInput').click()"
                  class="px-2.5 py-1 text-[11px] font-medium bg-gray-100 hover:bg-gray-200/80 text-apple-text rounded-md border border-apple-border transition cursor-pointer">
                  <span id="refBgBtnText">上传参考图</span>
                </button>
                <button type="button" id="btnRemoveRefBg" onclick="removeRefBgImage()"
                  class="hidden p-1 text-red-500 hover:bg-red-50 rounded-md transition cursor-pointer" title="移除参考图">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>

            <div id="refBgControls" class="hidden bg-gray-50/90 rounded-xl p-2.5 border border-apple-border/80 space-y-2">
              <div class="flex items-center justify-between gap-2">
                <span class="text-[11px] text-apple-subtext shrink-0">参考图透明度</span>
                <input type="range" id="refBgOpacityRange" min="0" max="100" value="40"
                  oninput="handleRefBgOpacityChange(this.value)"
                  class="flex-1 h-1.5 bg-gray-200 rounded-lg cursor-pointer" />
                <span id="refBgOpacityLabel" class="text-[11px] font-mono text-apple-text w-9 text-right">40%</span>
              </div>
              <div class="flex items-center justify-between">
                <label class="inline-flex items-center gap-1.5 text-[11px] text-apple-text cursor-pointer">
                  <input type="checkbox" id="refBgExcludeExportCheck" checked
                    onchange="state.refBgExcludeFromExport = this.checked"
                    class="rounded border-gray-300 text-apple-blue focus:ring-apple-blue" />
                  <span>导出成品时自动隐藏此参考图</span>
                </label>
                <span id="refBgFileName" class="text-[10px] text-apple-subtext truncate max-w-[120px]"></span>
              </div>
            </div>
          </div>
        </section>

        <!-- 卡片 2：添加内容元素（图层入口） -->
        <section class="bg-apple-card rounded-2xl border border-apple-border p-3.5 shadow-2xs space-y-2.5">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="layers-3" class="w-4 h-4 text-apple-blue"></i>
              <h2 class="text-xs font-semibold uppercase tracking-wider text-apple-text">添加内容元素</h2>
            </div>
            <span id="layerCountBadge" class="text-[11px] text-apple-subtext">2 个图层</span>
          </div>

          <div class="grid grid-cols-5 gap-1.5">
            <button type="button" onclick="addTextLayer()"
              class="flex flex-col items-center justify-center gap-1 py-2 px-1 rounded-xl border border-apple-border bg-gray-50/70 hover:bg-blue-50/70 hover:border-apple-blue/40 hover:text-apple-blue text-xs font-medium text-apple-text transition cursor-pointer">
              <i data-lucide="type" class="w-4 h-4 text-apple-blue"></i>
              <span class="text-[11px]">+ 文字</span>
            </button>
            <button type="button" onclick="addImageLayer()"
              class="flex flex-col items-center justify-center gap-1 py-2 px-1 rounded-xl border border-apple-border bg-gray-50/70 hover:bg-emerald-50/70 hover:border-emerald-500/40 hover:text-emerald-700 text-xs font-medium text-apple-text transition cursor-pointer">
              <i data-lucide="image-plus" class="w-4 h-4 text-emerald-600"></i>
              <span class="text-[11px]">+ 图片</span>
            </button>
            <button type="button" onclick="addShapeLayer('rect')"
              class="flex flex-col items-center justify-center gap-1 py-2 px-1 rounded-xl border border-apple-border bg-gray-50/70 hover:bg-amber-50/70 hover:border-amber-500/40 hover:text-amber-700 text-xs font-medium text-apple-text transition cursor-pointer">
              <i data-lucide="square" class="w-4 h-4 text-amber-600"></i>
              <span class="text-[11px]">+ 矩形</span>
            </button>
            <button type="button" onclick="addShapeLayer('ellipse')"
              class="flex flex-col items-center justify-center gap-1 py-2 px-1 rounded-xl border border-apple-border bg-gray-50/70 hover:bg-purple-50/70 hover:border-purple-500/40 hover:text-purple-700 text-xs font-medium text-apple-text transition cursor-pointer">
              <i data-lucide="circle" class="w-4 h-4 text-purple-600"></i>
              <span class="text-[11px]">+ 椭圆形</span>
            </button>
            <button type="button" onclick="addShapeLayer('line')"
              class="flex flex-col items-center justify-center gap-1 py-2 px-1 rounded-xl border border-apple-border bg-gray-50/70 hover:bg-rose-50/70 hover:border-rose-500/40 hover:text-rose-700 text-xs font-medium text-apple-text transition cursor-pointer">
              <i data-lucide="minus" class="w-4 h-4 text-rose-600"></i>
              <span class="text-[11px]">+ 直线</span>
            </button>
          </div>
        </section>

        <!-- 图层列表容器 -->
        <div id="layersContainer" class="space-y-3 pb-6"></div>

      </div>
    </aside>

    <!-- 右侧：实时预览工作台 -->
    <section class="flex-1 flex flex-col workspace-grid relative overflow-hidden">

      <!-- 预览顶部浮动工具条 -->
      <div class="px-3 py-1.5 flex flex-wrap items-center justify-between bg-white/90 backdrop-blur-md border-b border-apple-border/80 z-10 gap-2">
        <!-- 左侧：多元素/画布对齐分布工具栏 -->
        <div class="flex items-center gap-1 flex-wrap">
          <span id="alignScopeBadge" class="text-[11px] font-medium px-2 py-0.5 rounded bg-gray-100 text-apple-subtext border border-apple-border/70 mr-1">对齐画布</span>
          <div class="inline-flex items-center bg-gray-100/90 p-0.5 rounded-lg border border-apple-border/80">
            <button type="button" onclick="alignSelectedLayers('left')" title="左对齐" class="p-1.5 rounded-md hover:bg-white text-apple-text transition cursor-pointer">
              <i data-lucide="align-horizontal-justify-start" class="w-3.5 h-3.5"></i>
            </button>
            <button type="button" onclick="alignSelectedLayers('centerH')" title="水平居中对齐" class="p-1.5 rounded-md hover:bg-white text-apple-text transition cursor-pointer">
              <i data-lucide="align-horizontal-justify-center" class="w-3.5 h-3.5"></i>
            </button>
            <button type="button" onclick="alignSelectedLayers('right')" title="右对齐" class="p-1.5 rounded-md hover:bg-white text-apple-text transition cursor-pointer">
              <i data-lucide="align-horizontal-justify-end" class="w-3.5 h-3.5"></i>
            </button>
            <div class="w-px h-3.5 bg-gray-300 mx-0.5"></div>
            <button type="button" onclick="alignSelectedLayers('top')" title="顶对齐" class="p-1.5 rounded-md hover:bg-white text-apple-text transition cursor-pointer">
              <i data-lucide="align-vertical-justify-start" class="w-3.5 h-3.5"></i>
            </button>
            <button type="button" onclick="alignSelectedLayers('centerV')" title="垂直居中对齐" class="p-1.5 rounded-md hover:bg-white text-apple-text transition cursor-pointer">
              <i data-lucide="align-vertical-justify-center" class="w-3.5 h-3.5"></i>
            </button>
            <button type="button" onclick="alignSelectedLayers('bottom')" title="底对齐" class="p-1.5 rounded-md hover:bg-white text-apple-text transition cursor-pointer">
              <i data-lucide="align-vertical-justify-end" class="w-3.5 h-3.5"></i>
            </button>
            <div class="w-px h-3.5 bg-gray-300 mx-0.5"></div>
            <button type="button" onclick="distributeSelectedLayers('horizontal')" title="水平等距分布（需选中至少 3 个元素）" class="p-1.5 rounded-md hover:bg-white text-apple-text transition cursor-pointer">
              <i data-lucide="align-horizontal-space-around" class="w-3.5 h-3.5"></i>
            </button>
            <button type="button" onclick="distributeSelectedLayers('vertical')" title="垂直等距分布（需选中至少 3 个元素）" class="p-1.5 rounded-md hover:bg-white text-apple-text transition cursor-pointer">
              <i data-lucide="align-vertical-space-around" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <span class="hidden xl:inline text-[11px] text-apple-subtext ml-1.5">按住 Shift 可多选元素</span>
        </div>

        <div class="flex items-center gap-2.5 shrink-0">
          <label class="inline-flex items-center gap-1.5 text-xs text-apple-text cursor-pointer">
            <input type="checkbox" id="showRulerCheck" checked onchange="renderPreview()" class="rounded border-gray-300 text-apple-blue focus:ring-apple-blue" />
            <span>网格与辅助框</span>
          </label>
          <span id="zoomScaleBadge" class="text-[11px] font-mono px-2 py-0.5 rounded bg-white border border-apple-border text-apple-subtext">100%</span>
        </div>
      </div>

      <!-- 画布居中展示区 -->
      <div id="previewViewport" class="flex-1 flex items-center justify-center p-6 sm:p-10 overflow-hidden relative">
        <div id="canvasWrapper" class="relative shadow-[0_14px_40px_rgba(0,0,0,0.12)] rounded-xs transition-shadow duration-200 bg-white">
          <canvas id="previewCanvas" class="block cursor-default"></canvas>
        </div>
      </div>

      <!-- 底部变量翻页控制条 -->
      <div class="h-14 bg-white/90 backdrop-blur-md border-t border-apple-border px-4 flex items-center justify-center shrink-0 z-10">
        <div class="inline-flex items-center gap-2 bg-gray-100/90 p-1 rounded-xl border border-apple-border/80 shadow-2xs">
          <button type="button" id="btnPrevPage" onclick="changePage(-1)"
            class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium bg-white text-apple-text border border-apple-border/60 hover:bg-gray-50 disabled:opacity-40 disabled:pointer-events-none transition cursor-pointer">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
            <span>上一条</span>
          </button>

          <div class="px-3 flex items-center gap-1.5 text-xs font-medium text-apple-text">
            <span class="text-apple-subtext">变量预览</span>
            <input type="number" id="pageJumpInput" min="1" value="1" onchange="jumpToPage(this.value)"
              class="w-12 text-center font-mono py-0.5 bg-white border border-apple-border rounded-md text-xs focus:outline-none focus:border-apple-blue" />
            <span class="text-apple-subtext">/ <strong id="totalPagesLabel" class="text-apple-text font-mono">1</strong></span>
          </div>

          <button type="button" id="btnNextPage" onclick="changePage(1)"
            class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium bg-white text-apple-text border border-apple-border/60 hover:bg-gray-50 disabled:opacity-40 disabled:pointer-events-none transition cursor-pointer">
            <span>下一条</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- 全局轻提示 Toast 容器 -->
  <div id="toastContainer" class="fixed bottom-16 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    // =========================================================================
    // 1. 物理单位换算常量与核心状态定义 (300 PPI 导出基准)
    // =========================================================================
    const PPI = 300;
    const MM_PER_INCH = 25.4;
    const PT_PER_INCH = 72;

    // 24 种常用精选设计色板
    const PRESET_24_COLORS = [
      '#FFFFFF', '#F5F5F7', '#E5E5EA', '#AEAEB2', '#636366', '#1D1D1F',
      '#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#00C7BE', '#30B0C7',
      '#0071E3', '#5856D6', '#AF52DE', '#FF2D55', '#A2845E', '#8E8E93',
      '#FFE5E5', '#FFF3E0', '#E8F5E9', '#E0F7FA', '#E8F0FE', '#F3E5F5'
    ];

    // 常用字体列表
    const FONT_OPTIONS = [
      { label: '思源黑体 / Noto Sans SC', value: '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif' },
      { label: '思源宋体 / Noto Serif SC', value: '"Noto Serif SC", "Songti SC", "SimSun", serif' },
      { label: '苹方 / PingFang SC', value: '"PingFang SC", "Noto Sans SC", sans-serif' },
      { label: '微软雅黑 / Microsoft YaHei', value: '"Microsoft YaHei", "Noto Sans SC", sans-serif' },
      { label: '黑体 / SimHei', value: '"SimHei", "Noto Sans SC", sans-serif' },
      { label: '楷体 / KaiTi', value: '"KaiTi", "STKaiti", serif' },
      { label: 'Inter (现代无衬线英文)', value: 'Inter, "Noto Sans SC", sans-serif' },
      { label: '等宽代码字体 / Monospace', value: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' }
    ];

    const FONT_WEIGHTS = [
      { label: 'Light (300)', value: '300' },
      { label: 'Regular (400)', value: '400' },
      { label: 'Medium (500)', value: '500' },
      { label: 'Bold (700)', value: '700' }
    ];

    // 全局应用状态（内部全部以 mm 存储物理尺寸，确保切换单位零精度损失）
    const state = {
      projectName: '批量设计项目',
      unit: 'mm', // 'mm' | 'pt'
      canvasWidthMm: 150,
      canvasHeightMm: 100,
      canvasBgColor: '#FFFFFF',
      refBgImageSrc: null,
      refBgImageObj: null,
      refBgFileName: '',
      refBgOpacity: 0.4,
      refBgExcludeFromExport: true,
      currentPage: 1,
      selectedLayerId: null,
      selectedLayerIds: [],
      layers: []
    };

    // 记录各色板的展开/收起状态（默认全部折叠为单行）
    const paletteExpandedMap = {};

    // 画布交互（移动 + 8向手柄缩放）状态
    const interactState = {
      mode: 'none', // 'none' | 'move' | 'resize'
      handle: null, // 'nw' | 'n' | 'ne' | 'e' | 'se' | 's' | 'sw' | 'w'
      layerId: null,
      startMouseXMm: 0,
      startMouseYMm: 0,
      origXMm: 0,
      origYMm: 0,
      origWMm: 0,
      origHMm: 0,
      origFontSizeMm: 0,
      multiOrigPositions: {},
      previewScale: 1
    };

    // 缓存当前页各图层的实时计算包围盒（用于精确点击命中与渲染缩放手柄）
    const computedBoundsMap = {};

    let layerIdCounter = 1;

    // 单位换算辅助函数
    function mmToPt(mm) {
      return (mm * PT_PER_INCH) / MM_PER_INCH;
    }
    function ptToMm(pt) {
      return (pt * MM_PER_INCH) / PT_PER_INCH;
    }
    function mmToPx(mm, targetPpi = PPI) {
      return (mm / MM_PER_INCH) * targetPpi;
    }
    function pxToMm(px, targetPpi = PPI) {
      return (px * MM_PER_INCH) / targetPpi;
    }
    function toDisplayUnit(mmVal, unit = state.unit) {
      const val = unit === 'pt' ? mmToPt(mmVal) : mmVal;
      return Number(val.toFixed(2));
    }
    function fromDisplayUnit(displayVal, unit = state.unit) {
      const num = parseFloat(displayVal);
      if (isNaN(num)) return 0;
      return unit === 'pt' ? ptToMm(num) : num;
    }
    function formatDisplayNum(mmVal, unit = state.unit) {
      const val = unit === 'pt' ? mmToPt(mmVal) : mmVal;
      return parseFloat(val.toFixed(2)).toString();
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 精确测量文本在给定字号与字间距下的物理宽高（mm），用于默认居中排版
    function measureTextDimensionsMm(text, fontSizeMm, letterSpacingMm, lineHeightRatio, fontWeight, fontFamily) {
      const tmpCanvas = document.createElement('canvas');
      const ctx = tmpCanvas.getContext('2d');
      const fontSizePx = mmToPx(fontSizeMm);
      const letterSpacingPx = mmToPx(letterSpacingMm || 0);
      const lineHeightPx = fontSizePx * (lineHeightRatio || 1.2);
      ctx.font = `${fontWeight || '400'} ${fontSizePx}px ${fontFamily}`;

      const lines = (text || ' ').split('\n');
      let maxW = 0;
      lines.forEach(line => {
        const chars = Array.from(line);
        let w = 0;
        chars.forEach((ch, idx) => {
          w += ctx.measureText(ch).width;
          if (idx < chars.length - 1) w += letterSpacingPx;
        });
        if (w > maxW) maxW = w;
      });
      const totalH = lines.length * lineHeightPx;
      return {
        widthMm: Math.max(1, pxToMm(maxW)),
        heightMm: Math.max(1, pxToMm(totalH))
      };
    }

    // =========================================================================
    // 2. 初始化默认图层（仅保留居中放置的主标题与副标题，默认折叠）
    // =========================================================================
    function initApp() {
      renderCanvasBgPaletteUI();

      const mainTitleText = '名称';
      const mainTitleFontSizeMm = 14;
      const mainTitleLetterSpacingMm = 1.5;
      const mainTitleFont = FONT_OPTIONS[0].value;

      const subTitleText = '编号123456789';
      const subTitleFontSizeMm = 6.5;
      const subTitleLetterSpacingMm = 0.6;
      const subTitleFont = FONT_OPTIONS[0].value;

      const mainDims = measureTextDimensionsMm(mainTitleText, mainTitleFontSizeMm, mainTitleLetterSpacingMm, 1.2, '700', mainTitleFont);
      const subDims = measureTextDimensionsMm(subTitleText, subTitleFontSizeMm, subTitleLetterSpacingMm, 1.2, '500', subTitleFont);

      const verticalGapMm = 6;
      const totalGroupHeightMm = mainDims.heightMm + verticalGapMm + subDims.heightMm;
      const groupStartYMm = (state.canvasHeightMm - totalGroupHeightMm) / 2;

      const mainTitleLayer = {
        id: 'layer_' + (layerIdCounter++),
        type: 'text',
        name: '主标题',
        collapsed: true,
        styleCollapsed: true,
        text: mainTitleText,
        useVariable: false,
        variables: [''],
        fontFamily: mainTitleFont,
        customFont: '',
        fontWeight: '700',
        fontSizeMm: mainTitleFontSizeMm,
        letterSpacingMm: mainTitleLetterSpacingMm,
        lineHeightRatio: 1.2,
        color: '#1D1D1F',
        anchor: 'center', // 'left' | 'center' | 'right'
        xMm: Number((state.canvasWidthMm / 2).toFixed(2)),
        yMm: Number(groupStartYMm.toFixed(2)),
        rotation: 0,
        flipX: false,
        flipY: false,
        constrainBox: false,
        boxWidthMm: 90,
        boxHeightMm: 22
      };

      const subTitleLayer = {
        id: 'layer_' + (layerIdCounter++),
        type: 'text',
        name: '副标题',
        collapsed: true,
        styleCollapsed: true,
        text: subTitleText,
        useVariable: false,
        variables: [''],
        fontFamily: subTitleFont,
        customFont: '',
        fontWeight: '500',
        fontSizeMm: subTitleFontSizeMm,
        letterSpacingMm: subTitleLetterSpacingMm,
        lineHeightRatio: 1.2,
        color: '#515154',
        anchor: 'center', // 'left' | 'center' | 'right'
        xMm: Number((state.canvasWidthMm / 2).toFixed(2)),
        yMm: Number((groupStartYMm + mainDims.heightMm + verticalGapMm).toFixed(2)),
        rotation: 0,
        flipX: false,
        flipY: false,
        constrainBox: false,
        boxWidthMm: 90,
        boxHeightMm: 14
      };

      state.layers = [mainTitleLayer, subTitleLayer];
      state.selectedLayerId = mainTitleLayer.id;
      state.selectedLayerIds = [mainTitleLayer.id];

      syncCanvasInputs();
      syncRefBgUI();
      updateAlignToolbarState();
      renderLayersUI();
      updatePaginationState();
      setupCanvasInteractions();
      renderPreview();

      window.addEventListener('resize', renderPreview);
    }

    // =========================================================================
    // 3. 通用单行可折叠色板组件（确保默认严格单行显示，多余折叠）
    // =========================================================================
    function renderCompactColorPalette({ paletteId, label, currentColor, onChangeExpr, allowTransparent = false, isTransparent = false, onToggleTransparentExpr = '' }) {
      const isExpanded = !!paletteExpandedMap[paletteId];
      const singleRowColors = PRESET_24_COLORS.slice(0, 8);
      const normalizedCur = (currentColor || '#000000').toUpperCase();

      return `
        <div class="space-y-2">
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs font-medium text-apple-subtext shrink-0">${label}</span>
            <div class="flex items-center gap-1 flex-nowrap overflow-hidden">
              ${allowTransparent ? `
                <button type="button"
                  onclick="${onToggleTransparentExpr}"
                  title="无填充（透明）"
                  class="w-5 h-5 rounded-md border flex items-center justify-center shrink-0 transition cursor-pointer ${isTransparent ? 'ring-2 ring-apple-blue border-white bg-white' : 'border-black/15 bg-white opacity-75 hover:opacity-100'}">
                  <span class="w-4 h-0.5 bg-red-500 -rotate-45 block"></span>
                </button>
              ` : ''}
              ${singleRowColors.map(hex => {
                const active = !isTransparent && normalizedCur === hex.toUpperCase();
                return `
                  <button type="button"
                    onclick="${onChangeExpr.replace('__COLOR__', hex)}"
                    title="${hex}"
                    style="background-color: ${hex};"
                    class="w-5 h-5 rounded-md border shrink-0 transition cursor-pointer ${active ? 'ring-2 ring-apple-blue ring-offset-1 border-white scale-105' : 'border-black/15 hover:scale-105'}">
                  </button>
                `;
              }).join('')}
              <button type="button"
                onclick="togglePaletteExpand('${paletteId}')"
                title="${isExpanded ? '收起色板' : '展开全部24色与色环'}"
                class="w-5 h-5 rounded-md border border-apple-border bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-apple-subtext shrink-0 transition cursor-pointer">
                <i data-lucide="${isExpanded ? 'chevron-up' : 'chevron-down'}" class="w-3 h-3"></i>
              </button>
            </div>
          </div>

          ${isExpanded ? `
            <div class="p-2.5 bg-gray-50/90 rounded-xl border border-apple-border/80 space-y-2">
              <div class="grid grid-cols-12 gap-1.5">
                ${PRESET_24_COLORS.map(hex => {
                  const active = !isTransparent && normalizedCur === hex.toUpperCase();
                  return `
                    <button type="button"
                      onclick="${onChangeExpr.replace('__COLOR__', hex)}"
                      title="${hex}"
                      style="background-color: ${hex};"
                      class="w-full aspect-square rounded-md border transition cursor-pointer ${active ? 'ring-2 ring-apple-blue ring-offset-1 border-white scale-105' : 'border-black/15 hover:scale-105'}">
                    </button>
                  `;
                }).join('')}
              </div>
              <div class="flex items-center gap-2 pt-1 border-t border-gray-200/70">
                <label class="relative w-7 h-7 rounded-md overflow-hidden border border-apple-border shrink-0 cursor-pointer" title="打开色环/调色盘">
                  <input type="color" value="${currentColor || '#000000'}"
                    oninput="${onChangeExpr.replace('__COLOR__', 'this.value')}"
                    class="w-9 h-9 -m-1 cursor-pointer" />
                </label>
                <div class="flex-1 flex items-center bg-white border border-apple-border rounded-lg px-2 py-1">
                  <span class="text-[11px] font-mono text-apple-subtext mr-1">HEX</span>
                  <input type="text" value="${normalizedCur}" maxlength="7"
                    onchange="${onChangeExpr.replace('__COLOR__', 'normalizeHexColor(this.value)')}"
                    class="w-full text-xs font-mono bg-transparent focus:outline-none uppercase" />
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function togglePaletteExpand(paletteId) {
      paletteExpandedMap[paletteId] = !paletteExpandedMap[paletteId];
      if (paletteId === 'canvas_bg') {
        renderCanvasBgPaletteUI();
      } else {
        renderLayersUI();
      }
      lucide.createIcons();
    }

    function normalizeHexColor(val) {
      let v = (val || '').trim();
      if (!v.startsWith('#')) v = '#' + v;
      if (/^#[0-9A-Fa-f]{6}$/.test(v)) return v.toUpperCase();
      return '#000000';
    }

    // =========================================================================
    // 4. 画布基础配置与参考背景图控制
    // =========================================================================
    function renderCanvasBgPaletteUI() {
      const container = document.getElementById('canvasBgPaletteContainer');
      if (!container) return;
      container.innerHTML = renderCompactColorPalette({
        paletteId: 'canvas_bg',
        label: '画布背景颜色',
        currentColor: state.canvasBgColor,
        onChangeExpr: `setCanvasBgColor(__COLOR__)`
      });
      lucide.createIcons();
    }

    function setCanvasBgColor(hex) {
      state.canvasBgColor = hex;
      renderCanvasBgPaletteUI();
      renderPreview();
    }

    function switchUnit(newUnit) {
      if (state.unit === newUnit) return;
      state.unit = newUnit;

      const btnMm = document.getElementById('unitBtnMm');
      const btnPt = document.getElementById('unitBtnPt');
      if (newUnit === 'mm') {
        btnMm.className = 'py-1 text-xs font-medium rounded-md bg-white text-apple-text shadow-2xs transition cursor-pointer';
        btnPt.className = 'py-1 text-xs font-medium rounded-md text-apple-subtext hover:text-apple-text transition cursor-pointer';
      } else {
        btnPt.className = 'py-1 text-xs font-medium rounded-md bg-white text-apple-text shadow-2xs transition cursor-pointer';
        btnMm.className = 'py-1 text-xs font-medium rounded-md text-apple-subtext hover:text-apple-text transition cursor-pointer';
      }

      document.querySelectorAll('.unit-label').forEach(el => {
        el.textContent = newUnit;
      });

      syncCanvasInputs();
      renderLayersUI();
      renderPreview();
    }

    function syncCanvasInputs() {
      document.getElementById('projectNameInput').value = state.projectName;
      document.getElementById('canvasWidthInput').value = formatDisplayNum(state.canvasWidthMm);
      document.getElementById('canvasHeightInput').value = formatDisplayNum(state.canvasHeightMm);
      document.querySelectorAll('.unit-label').forEach(el => {
        el.textContent = state.unit;
      });
      updatePixelBadge();
    }

    function handleCanvasSizeChange(dim, rawValue) {
      const mmVal = Math.max(1, fromDisplayUnit(rawValue));
      if (dim === 'width') {
        state.canvasWidthMm = mmVal;
      } else {
        state.canvasHeightMm = mmVal;
      }
      syncCanvasInputs();
      renderPreview();
    }

    function updatePixelBadge() {
      const pxW = Math.round(mmToPx(state.canvasWidthMm));
      const pxH = Math.round(mmToPx(state.canvasHeightMm));
      document.getElementById('pixelInfoBadge').textContent = `${pxW} × ${pxH} px @ 300 PPI`;
    }

    // 参考背景图上传与透明度调节
    function handleRefBgUpload(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const src = e.target.result;
        const img = new Image();
        img.onload = () => {
          state.refBgImageSrc = src;
          state.refBgImageObj = img;
          state.refBgFileName = file.name;
          syncRefBgUI();
          renderPreview();
          showToast('参考背景图已加载', 'success');
        };
        img.src = src;
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    function removeRefBgImage() {
      state.refBgImageSrc = null;
      state.refBgImageObj = null;
      state.refBgFileName = '';
      syncRefBgUI();
      renderPreview();
      showToast('已移除参考背景图', 'info');
    }

    function handleRefBgOpacityChange(val) {
      const pct = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
      state.refBgOpacity = pct / 100;
      document.getElementById('refBgOpacityLabel').textContent = `${pct}%`;
      renderPreview();
    }

    function syncRefBgUI() {
      const hasRef = !!state.refBgImageSrc;
      const controls = document.getElementById('refBgControls');
      const btnRemove = document.getElementById('btnRemoveRefBg');
      const btnText = document.getElementById('refBgBtnText');
      if (hasRef) {
        controls.classList.remove('hidden');
        btnRemove.classList.remove('hidden');
        btnText.textContent = '更换参考图';
        document.getElementById('refBgFileName').textContent = state.refBgFileName || '参考图';
        const pct = Math.round(state.refBgOpacity * 100);
        document.getElementById('refBgOpacityRange').value = pct;
        document.getElementById('refBgOpacityLabel').textContent = `${pct}%`;
        document.getElementById('refBgExcludeExportCheck').checked = state.refBgExcludeFromExport;
      } else {
        controls.classList.add('hidden');
        btnRemove.classList.add('hidden');
        btnText.textContent = '上传参考图';
      }
    }

    // =========================================================================
    // 5. 图层管理（文字、图片、矩形、椭圆形、直线）
    // =========================================================================
    function addTextLayer() {
      const count = state.layers.filter(l => l.type === 'text').length + 1;
      const newLayer = {
        id: 'layer_' + (layerIdCounter++),
        type: 'text',
        name: `文字图层 ${count}`,
        collapsed: false,
        styleCollapsed: true,
        text: '新建文本内容',
        useVariable: false,
        variables: [''],
        fontFamily: FONT_OPTIONS[0].value,
        customFont: '',
        fontWeight: '400',
        fontSizeMm: 8,
        letterSpacingMm: 0.5,
        lineHeightRatio: 1.2,
        color: '#1D1D1F',
        anchor: 'left',
        xMm: 15,
        yMm: 15 + (count - 1) * 8,
        rotation: 0,
        flipX: false,
        flipY: false,
        constrainBox: false,
        boxWidthMm: 60,
        boxHeightMm: 15
      };
      state.layers.push(newLayer);
      state.selectedLayerId = newLayer.id;
      state.selectedLayerIds = [newLayer.id];
      updateAlignToolbarState();
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function addImageLayer() {
      const count = state.layers.filter(l => l.type === 'image').length + 1;
      const newLayer = {
        id: 'layer_' + (layerIdCounter++),
        type: 'image',
        name: `图片图层 ${count}`,
        collapsed: false,
        useVariable: false,
        singleImage: null,
        variableImages: [],
        widthMm: 40,
        heightMm: 40,
        lockAspectRatio: true,
        xMm: 20,
        yMm: 20,
        rotation: 0,
        flipX: false,
        flipY: false
      };
      state.layers.push(newLayer);
      state.selectedLayerId = newLayer.id;
      state.selectedLayerIds = [newLayer.id];
      updateAlignToolbarState();
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function addShapeLayer(shapeType) {
      const labelMap = { rect: '矩形', ellipse: '椭圆形', line: '直线' };
      const count = state.layers.filter(l => l.type === shapeType).length + 1;
      const newLayer = {
        id: 'layer_' + (layerIdCounter++),
        type: shapeType,
        name: `${labelMap[shapeType]} ${count}`,
        collapsed: false,
        xMm: 25,
        yMm: 25,
        widthMm: shapeType === 'line' ? 60 : 45,
        heightMm: shapeType === 'line' ? 0 : 30,
        borderRadiusMm: 0,
        rotation: 0,
        flipX: false,
        flipY: false,
        lineDirection: 'tl-br',
        fillColor: '#E8F4FD',
        fillTransparent: shapeType === 'line',
        strokeColor: '#1D1D1F',
        strokeWidthMm: 0.5,
        strokeDashed: false,
        dashLengthMm: 2,
        dashGapMm: 1.5
      };
      state.layers.push(newLayer);
      state.selectedLayerId = newLayer.id;
      state.selectedLayerIds = [newLayer.id];
      updateAlignToolbarState();
      renderLayersUI();
      renderPreview();
    }

    function toggleLayerCollapse(id) {
      const layer = state.layers.find(l => l.id === id);
      if (layer) {
        layer.collapsed = !layer.collapsed;
        renderLayersUI();
      }
    }

    function toggleTextStyleCollapse(id) {
      const layer = state.layers.find(l => l.id === id);
      if (layer) {
        layer.styleCollapsed = layer.styleCollapsed === false ? true : false;
        renderLayersUI();
      }
    }

    function selectLayer(id, additive = false) {
      if (additive) {
        const exists = state.selectedLayerIds.includes(id);
        if (exists) {
          state.selectedLayerIds = state.selectedLayerIds.filter(item => item !== id);
          state.selectedLayerId = state.selectedLayerIds[state.selectedLayerIds.length - 1] || null;
        } else {
          state.selectedLayerIds.push(id);
          state.selectedLayerId = id;
        }
      } else {
        state.selectedLayerId = id;
        state.selectedLayerIds = id ? [id] : [];
      }
      updateAlignToolbarState();
      renderLayersUI();
      renderPreview();
    }

    function updateAlignToolbarState() {
      const badge = document.getElementById('alignScopeBadge');
      if (!badge) return;
      const count = state.selectedLayerIds.length;
      if (count >= 2) {
        badge.textContent = `已选 ${count} 项 · 多元素对齐`;
        badge.className = 'text-[11px] font-medium px-2 py-0.5 rounded bg-blue-50 text-apple-blue border border-blue-200 mr-1';
      } else if (count === 1) {
        badge.textContent = '已选 1 项 · 对齐画布';
        badge.className = 'text-[11px] font-medium px-2 py-0.5 rounded bg-gray-100 text-apple-text border border-apple-border/70 mr-1';
      } else {
        badge.textContent = '对齐画布';
        badge.className = 'text-[11px] font-medium px-2 py-0.5 rounded bg-gray-100 text-apple-subtext border border-apple-border/70 mr-1';
      }
    }

    function getLayerBoundsOrEstimate(layer) {
      if (computedBoundsMap[layer.id]) return { ...computedBoundsMap[layer.id] };
      if (layer.type === 'text') {
        const content = getActiveTextForLayer(layer, state.currentPage);
        const fontStack = layer.customFont && layer.customFont.trim()
          ? `"${layer.customFont.trim()}", ${layer.fontFamily}`
          : layer.fontFamily;
        const dims = measureTextDimensionsMm(content, layer.fontSizeMm, layer.letterSpacingMm || 0, layer.lineHeightRatio || 1.2, layer.fontWeight, fontStack);
        const w = layer.constrainBox ? layer.boxWidthMm : dims.widthMm;
        const h = layer.constrainBox ? layer.boxHeightMm : dims.heightMm;
        let left = layer.xMm;
        if (layer.anchor === 'center') left = layer.xMm - w / 2;
        else if (layer.anchor === 'right') left = layer.xMm - w;
        return { xMm: left, yMm: layer.yMm, wMm: w, hMm: h };
      }
      return { xMm: layer.xMm, yMm: layer.yMm, wMm: layer.widthMm || 0, hMm: layer.heightMm || 0 };
    }

    function setLayerLeftTopMm(layer, targetLeftMm, targetTopMm, bounds) {
      const b = bounds || getLayerBoundsOrEstimate(layer);
      if (layer.type === 'text') {
        const anchor = layer.anchor || 'left';
        if (anchor === 'center') layer.xMm = Number((targetLeftMm + b.wMm / 2).toFixed(2));
        else if (anchor === 'right') layer.xMm = Number((targetLeftMm + b.wMm).toFixed(2));
        else layer.xMm = Number(targetLeftMm.toFixed(2));
      } else {
        layer.xMm = Number(targetLeftMm.toFixed(2));
      }
      layer.yMm = Number(targetTopMm.toFixed(2));
    }

    function alignSelectedLayers(type) {
      const ids = state.selectedLayerIds.length > 0 ? state.selectedLayerIds : (state.selectedLayerId ? [state.selectedLayerId] : []);
      if (ids.length === 0) {
        showToast('请先选择至少一个图层元素', 'info');
        return;
      }
      const targets = ids.map(id => state.layers.find(l => l.id === id)).filter(Boolean);
      const items = targets.map(l => ({ layer: l, b: getLayerBoundsOrEstimate(l) }));

      let refMinX = 0, refMaxX = state.canvasWidthMm, refMinY = 0, refMaxY = state.canvasHeightMm;
      if (items.length >= 2) {
        refMinX = Math.min(...items.map(i => i.b.xMm));
        refMaxX = Math.max(...items.map(i => i.b.xMm + i.b.wMm));
        refMinY = Math.min(...items.map(i => i.b.yMm));
        refMaxY = Math.max(...items.map(i => i.b.yMm + i.b.hMm));
      }
      const refCenterX = (refMinX + refMaxX) / 2;
      const refCenterY = (refMinY + refMaxY) / 2;

      items.forEach(({ layer, b }) => {
        let newLeft = b.xMm;
        let newTop = b.yMm;
        if (type === 'left') newLeft = refMinX;
        else if (type === 'centerH') newLeft = refCenterX - b.wMm / 2;
        else if (type === 'right') newLeft = refMaxX - b.wMm;
        else if (type === 'top') newTop = refMinY;
        else if (type === 'centerV') newTop = refCenterY - b.hMm / 2;
        else if (type === 'bottom') newTop = refMaxY - b.hMm;
        setLayerLeftTopMm(layer, newLeft, newTop, b);
      });

      renderLayersUI();
      renderPreview();
    }

    function distributeSelectedLayers(axis) {
      if (state.selectedLayerIds.length < 3) {
        showToast('等距分布需要按住 Shift 选中至少 3 个元素', 'info');
        return;
      }
      const items = state.selectedLayerIds
        .map(id => state.layers.find(l => l.id === id))
        .filter(Boolean)
        .map(l => ({ layer: l, b: getLayerBoundsOrEstimate(l) }));

      if (axis === 'horizontal') {
        items.sort((a, b) => a.b.xMm - b.b.xMm);
        const minX = items[0].b.xMm;
        const maxRight = items[items.length - 1].b.xMm + items[items.length - 1].b.wMm;
        const totalW = items.reduce((sum, i) => sum + i.b.wMm, 0);
        const gap = (maxRight - minX - totalW) / (items.length - 1);
        let curX = minX;
        items.forEach(({ layer, b }) => {
          setLayerLeftTopMm(layer, curX, b.yMm, b);
          curX += b.wMm + gap;
        });
      } else {
        items.sort((a, b) => a.b.yMm - b.b.yMm);
        const minY = items[0].b.yMm;
        const maxBottom = items[items.length - 1].b.yMm + items[items.length - 1].b.hMm;
        const totalH = items.reduce((sum, i) => sum + i.b.hMm, 0);
        const gap = (maxBottom - minY - totalH) / (items.length - 1);
        let curY = minY;
        items.forEach(({ layer, b }) => {
          setLayerLeftTopMm(layer, b.xMm, curY, b);
          curY += b.hMm + gap;
        });
      }

      renderLayersUI();
      renderPreview();
    }

    function renderTransformControls(layer) {
      const rot = Number(layer.rotation || 0);
      const flipX = !!layer.flipX;
      const flipY = !!layer.flipY;
      return `
        <div class="pt-2 border-t border-gray-100 space-y-1.5">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-medium text-apple-subtext">旋转与镜像翻转</span>
            <button type="button" onclick="updateLayerProp('${layer.id}', 'rotation', 0, false, true); updateLayerProp('${layer.id}', 'flipX', false, false, true); updateLayerProp('${layer.id}', 'flipY', false, false, true);"
              class="text-[10px] text-apple-subtext hover:text-apple-blue cursor-pointer">重置变换</button>
          </div>
          <div class="grid grid-cols-12 gap-1.5 items-center">
            <div class="col-span-5 flex items-center bg-gray-50/80 border border-apple-border rounded-lg px-2 py-1">
              <i data-lucide="rotate-cw" class="w-3 h-3 text-apple-subtext mr-1 shrink-0"></i>
              <input type="number" step="1" value="${rot}"
                onchange="updateLayerProp('${layer.id}', 'rotation', ((parseFloat(this.value) || 0) % 360), false, true)"
                class="w-full text-xs font-mono bg-transparent focus:outline-none text-right" />
              <span class="text-[11px] text-apple-subtext ml-0.5">°</span>
            </div>
            <div class="col-span-3 grid grid-cols-2 gap-1">
              <button type="button" onclick="updateLayerProp('${layer.id}', 'rotation', ${((rot - 90 + 360) % 360)}, false, true)"
                title="逆时针旋转 90°"
                class="py-1 text-[11px] font-mono bg-gray-50 hover:bg-gray-100 border border-apple-border rounded-lg text-apple-text cursor-pointer">-90°</button>
              <button type="button" onclick="updateLayerProp('${layer.id}', 'rotation', ${((rot + 90) % 360)}, false, true)"
                title="顺时针旋转 90°"
                class="py-1 text-[11px] font-mono bg-gray-50 hover:bg-gray-100 border border-apple-border rounded-lg text-apple-text cursor-pointer">+90°</button>
            </div>
            <div class="col-span-4 grid grid-cols-2 gap-1">
              <button type="button" onclick="updateLayerProp('${layer.id}', 'flipX', ${!flipX}, false, true)"
                title="水平镜像翻转"
                class="flex items-center justify-center gap-0.5 py-1 text-[11px] rounded-lg border transition cursor-pointer ${flipX ? 'bg-blue-50 border-blue-200 text-apple-blue font-medium' : 'bg-gray-50 border-apple-border text-apple-text hover:bg-gray-100'}">
                <i data-lucide="flip-horizontal-2" class="w-3.5 h-3.5"></i>
                <span>水平</span>
              </button>
              <button type="button" onclick="updateLayerProp('${layer.id}', 'flipY', ${!flipY}, false, true)"
                title="垂直镜像翻转"
                class="flex items-center justify-center gap-0.5 py-1 text-[11px] rounded-lg border transition cursor-pointer ${flipY ? 'bg-blue-50 border-blue-200 text-apple-blue font-medium' : 'bg-gray-50 border-apple-border text-apple-text hover:bg-gray-100'}">
                <i data-lucide="flip-vertical-2" class="w-3.5 h-3.5"></i>
                <span>垂直</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function moveLayer(id, direction) {
      const idx = state.layers.findIndex(l => l.id === id);
      if (idx === -1) return;
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= state.layers.length) return;
      const temp = state.layers[idx];
      state.layers[idx] = state.layers[targetIdx];
      state.layers[targetIdx] = temp;
      renderLayersUI();
      renderPreview();
    }

    function duplicateLayer(id) {
      const orig = state.layers.find(l => l.id === id);
      if (!orig) return;
      const clone = JSON.parse(JSON.stringify(orig));
      clone.id = 'layer_' + (layerIdCounter++);
      clone.name = orig.name + ' 副本';
      clone.xMm = Number((orig.xMm + 5).toFixed(2));
      clone.yMm = Number((orig.yMm + 5).toFixed(2));
      if (orig.type === 'image') {
        clone.singleImage = orig.singleImage ? { ...orig.singleImage } : null;
        clone.variableImages = orig.variableImages.map(item => ({ ...item }));
      }
      state.layers.push(clone);
      state.selectedLayerId = clone.id;
      state.selectedLayerIds = [clone.id];
      updateAlignToolbarState();
      renderLayersUI();
      updatePaginationState();
      renderPreview();
      showToast(`已复制图层：${clone.name}`, 'info');
    }

    function deleteLayer(id) {
      state.layers = state.layers.filter(l => l.id !== id);
      state.selectedLayerIds = state.selectedLayerIds.filter(item => item !== id);
      if (state.selectedLayerId === id) {
        state.selectedLayerId = state.selectedLayerIds.length
          ? state.selectedLayerIds[state.selectedLayerIds.length - 1]
          : (state.layers.length ? state.layers[state.layers.length - 1].id : null);
        if (state.selectedLayerId && !state.selectedLayerIds.includes(state.selectedLayerId)) {
          state.selectedLayerIds = [state.selectedLayerId];
        }
      }
      updateAlignToolbarState();
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function updateLayerProp(id, prop, value, isPhysicalUnit = false, rerenderUI = false) {
      const layer = state.layers.find(l => l.id === id);
      if (!layer) return;

      if (isPhysicalUnit) {
        const mmVal = fromDisplayUnit(value);
        if (prop === 'widthMm' && layer.type === 'image' && layer.lockAspectRatio && layer.heightMm > 0) {
          const ratio = layer.widthMm / layer.heightMm;
          layer.widthMm = Math.max(0.5, mmVal);
          layer.heightMm = Math.max(0.5, Number((layer.widthMm / ratio).toFixed(3)));
          rerenderUI = true;
        } else if (prop === 'heightMm' && layer.type === 'image' && layer.lockAspectRatio && layer.widthMm > 0) {
          const ratio = layer.widthMm / layer.heightMm;
          layer.heightMm = Math.max(0.5, mmVal);
          layer.widthMm = Math.max(0.5, Number((layer.heightMm * ratio).toFixed(3)));
          rerenderUI = true;
        } else {
          layer[prop] = mmVal;
        }
      } else {
        layer[prop] = value;
      }

      if (rerenderUI) renderLayersUI();
      if (prop === 'useVariable') updatePaginationState();
      renderPreview();
    }

    // 切换文字水平基准点（左 / 中 / 右），并自动保持当前视觉位置不跳动
    function setTextAnchor(id, newAnchor) {
      const layer = state.layers.find(l => l.id === id && l.type === 'text');
      if (!layer) return;
      const oldAnchor = layer.anchor || 'left';
      if (oldAnchor === newAnchor) return;

      const b = computedBoundsMap[id];
      if (b && b.wMm > 0) {
        if (newAnchor === 'left') {
          layer.xMm = Number(b.xMm.toFixed(2));
        } else if (newAnchor === 'center') {
          layer.xMm = Number((b.xMm + b.wMm / 2).toFixed(2));
        } else if (newAnchor === 'right') {
          layer.xMm = Number((b.xMm + b.wMm).toFixed(2));
        }
      }
      layer.anchor = newAnchor;
      renderLayersUI();
      renderPreview();
    }

    // =========================================================================
    // 6. 文本变量 & Excel 竖列粘贴核心逻辑
    // =========================================================================
    function toggleTextVariable(id, checked) {
      const layer = state.layers.find(l => l.id === id);
      if (!layer) return;
      layer.useVariable = checked;
      if (checked) {
        if (!Array.isArray(layer.variables) || layer.variables.length === 0) {
          layer.variables = [''];
        }
      }
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function updateTextVariableItem(id, index, val) {
      const layer = state.layers.find(l => l.id === id);
      if (!layer) return;
      layer.variables[index] = val;
      renderPreview();
    }

    function addTextVariableRow(id) {
      const layer = state.layers.find(l => l.id === id);
      if (!layer) return;
      layer.variables.push('');
      renderLayersUI();
      updatePaginationState();
    }

    function removeTextVariableRow(id, index) {
      const layer = state.layers.find(l => l.id === id);
      if (!layer) return;
      layer.variables.splice(index, 1);
      if (layer.variables.length === 0) {
        layer.variables.push('');
      }
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function clearTextVariables(id) {
      const layer = state.layers.find(l => l.id === id);
      if (!layer) return;
      layer.variables = [''];
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function handleVariableExcelPaste(event, id, startIndex) {
      const clipboardData = event.clipboardData || window.clipboardData;
      if (!clipboardData) return;
      const pastedText = clipboardData.getData('text');
      if (!pastedText) return;

      const normalized = pastedText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      if (normalized.includes('\n')) {
        event.preventDefault();
        const rows = normalized.split('\n');
        if (rows.length > 1 && rows[rows.length - 1] === '') {
          rows.pop();
        }
        const cleanedRows = rows.map(row => row.split('\t')[0]);

        const layer = state.layers.find(l => l.id === id);
        if (!layer) return;

        for (let i = 0; i < cleanedRows.length; i++) {
          const targetIdx = startIndex + i;
          if (targetIdx < layer.variables.length) {
            layer.variables[targetIdx] = cleanedRows[i];
          } else {
            layer.variables.push(cleanedRows[i]);
          }
        }

        renderLayersUI();
        updatePaginationState();
        renderPreview();
        showToast(`已从剪贴板导入 ${cleanedRows.length} 条变量数据`, 'success');
      }
    }

    // =========================================================================
    // 7. 图片上传（单图 + 多图/整个文件夹批量导入）
    // =========================================================================
    function handleSingleImageUpload(id, input) {
      const file = input.files && input.files[0];
      if (!file) return;
      readImageFile(file).then(imgObj => {
        const layer = state.layers.find(l => l.id === id);
        if (!layer) return;
        layer.singleImage = imgObj;
        const aspect = imgObj.width / imgObj.height;
        if (aspect && isFinite(aspect)) {
          layer.heightMm = Number((layer.widthMm / aspect).toFixed(2));
        }
        renderLayersUI();
        renderPreview();
        showToast(`已加载图片：${file.name}`, 'success');
      });
    }

    async function handleBatchImagesUpload(id, input) {
      const files = Array.from(input.files || []).filter(f => f.type.startsWith('image/'));
      if (files.length === 0) {
        showToast('未检测到有效图片文件', 'error');
        return;
      }

      files.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true }));

      const loadedList = [];
      for (const file of files) {
        try {
          const imgObj = await readImageFile(file);
          loadedList.push(imgObj);
        } catch (err) {
          console.warn('跳过无法读取的图片:', file.name, err);
        }
      }

      const layer = state.layers.find(l => l.id === id);
      if (!layer) return;
      layer.variableImages = loadedList;

      if (loadedList.length > 0) {
        const first = loadedList[0];
        const aspect = first.width / first.height;
        if (aspect && isFinite(aspect)) {
          layer.heightMm = Number((layer.widthMm / aspect).toFixed(2));
        }
      }

      renderLayersUI();
      updatePaginationState();
      renderPreview();
      showToast(`已成功导入 ${loadedList.length} 张变量图片`, 'success');
      input.value = '';
    }

    function removeVariableImageItem(id, index) {
      const layer = state.layers.find(l => l.id === id);
      if (!layer) return;
      layer.variableImages.splice(index, 1);
      renderLayersUI();
      updatePaginationState();
      renderPreview();
    }

    function readImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            resolve({
              name: file.name,
              src: e.target.result,
              imgElement: img,
              width: img.naturalWidth || img.width,
              height: img.naturalHeight || img.height
            });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // =========================================================================
    // 8. 渲染左侧图层编辑 UI

      container.innerHTML = state.layers.map((layer, index) => {

                onchange="updateLayerProp('${layer.id}', 'name', this.value)"
                class="text-xs font-semibold text-apple-text bg-transparent border-b border-transparent hover:border-gray-300 focus:border-apple-blue focus:outline-none truncate w-28" />
              ${extraBadge}
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button type="button" onclick="event.stopPropagation(); moveLayer('${layer.id}', -1)" ${index === 0 ? 'disabled' : ''} title="上移图层"
                class="p-1 rounded hover:bg-gray-200/70 text-apple-subtext disabled:opacity-30 cursor-pointer">
                <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i>
              </button>
              <button type="button" onclick="event.stopPropagation(); moveLayer('${layer.id}', 1)" ${index === state.layers.length - 1 ? 'disabled' : ''} title="下移图层"
                class="p-1 rounded hover:bg-gray-200/70 text-apple-subtext disabled:opacity-30 cursor-pointer">
                <i data-lucide="arrow-down" class="w-3.5 h-3.5"></i>
              </button>
              <button type="button" onclick="event.stopPropagation(); duplicateLayer('${layer.id}')" title="复制图层"
                class="p-1 rounded hover:bg-gray-200/70 text-apple-subtext cursor-pointer">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
              </button>
              <button type="button" onclick="event.stopPropagation(); deleteLayer('${layer.id}')" title="删除图层"
                class="p-1 rounded hover:bg-red-50 text-red-500 cursor-pointer">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `;

        // 1. 文字图层
        if (layer.type === 'text') {
          const tag = layer.useVariable ? `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-blue-100/80 text-apple-blue shrink-0">变量 (${layer.variables.length})</span>` : '';
          const anchor = layer.anchor || 'left';
          const isStyleCollapsed = layer.styleCollapsed !== false;
          const activeFontObj = FONT_OPTIONS.find(f => f.value === layer.fontFamily);
          const fontShortName = (layer.customFont && layer.customFont.trim())
            ? layer.customFont.trim()
            : (activeFontObj ? activeFontObj.label.split('/')[0].trim() : '默认字体');
          const styleSummary = `${fontShortName} · ${formatDisplayNum(layer.fontSizeMm, u)}${u} · (${formatDisplayNum(layer.xMm, u)}, ${formatDisplayNum(layer.yMm, u)})`;

          return `
            <div onclick="selectLayer('${layer.id}', event.shiftKey)" class="bg-apple-card rounded-2xl border ${borderClass} shadow-2xs transition-all overflow-hidden">
              ${renderHeader('type', 'bg-blue-50', 'text-apple-blue', tag)}
              <div onclick="event.stopPropagation()" class="${layer.collapsed ? 'hidden' : 'p-3.5 space-y-3'}">
                <!-- 内容与变量切换 -->
                <div>
                  <div class="flex items-center justify-between mb-1.5">
                    <label class="text-xs font-medium text-apple-subtext">文本内容</label>
                    <label class="inline-flex items-center gap-1.5 text-xs font-medium text-apple-blue cursor-pointer">
                      <input type="checkbox" ${layer.useVariable ? 'checked' : ''}
                        onchange="toggleTextVariable('${layer.id}', this.checked)"

                      <span>启用变量（批量数据）</span>
                    </label>
                  </div>

                  ${!layer.useVariable ? `
                    <textarea rows="2" placeholder="输入文本内容..."
                      oninput="updateLayerProp('${layer.id}', 'text', this.value)"
                      class="w-full px-3 py-1.5 text-sm bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:bg-white focus:border-apple-blue transition resize-y">${escapeHtml(layer.text)}</textarea>
                  ` : `
                    <div class="bg-gray-50/90 border border-apple-border rounded-xl p-2.5 space-y-2">
                      <div class="flex items-center justify-between text-[11px] text-apple-subtext">

                          <button type="button" onclick="clearTextVariables('${layer.id}')"

                          <div class="flex items-center gap-1.5 px-2 py-1 hover:bg-blue-50/30">

                              class="flex-1 text-xs py-1 px-1.5 bg-transparent focus:outline-none focus:bg-blue-50/40 rounded" />
                            <button type="button" onclick="removeTextVariableRow('${layer.id}', ${vIdx})"
                              class="text-gray-400 hover:text-red-500 p-0.5 cursor-pointer" title="删除此行">

                            </button>
                          </div>
