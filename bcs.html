                      <div>
                        <label class="block text-[11px] text-apple-subtext mb-1">限定高度 (${u})</label>
                        <input type="number" step="any" id="input_boxh_${layer.id}" value="${formatDisplayNum(layer.boxHeightMm, u)}"
                          onchange="updateLayerProp('${layer.id}', 'boxHeightMm', this.value, true)"
                          class="w-full px-2 py-1 text-xs font-mono bg-blue-50/30 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                      </div>
                    </div>
                  ` : ''}
                </div>

                <!-- 文字颜色（单行可折叠色板） -->
                <div class="pt-1.5 border-t border-gray-100">
                  ${renderCompactColorPalette({
                    paletteId: `text_color_${layer.id}`,
                    label: '文字颜色',
                    currentColor: layer.color,
                    onChangeExpr: `updateLayerProp('${layer.id}', 'color', '__COLOR__', false, true)`
                  })}
                </div>
              </div>
            </div>
          `;
        }

        // 2. 图片图层
        if (layer.type === 'image') {
          const tag = layer.useVariable ? `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-emerald-100/80 text-emerald-700 shrink-0">图库 (${layer.variableImages.length})</span>` : '';
          return `
            <div onclick="selectLayer('${layer.id}')" class="bg-apple-card rounded-2xl border ${borderClass} shadow-2xs transition-all overflow-hidden">
              ${renderHeader('image', 'bg-emerald-50', 'text-emerald-600', tag)}
              <div class="${layer.collapsed ? 'hidden' : 'p-3.5 space-y-3'}">
                <div class="flex items-center justify-between">
                  <span class="text-[11px] font-medium text-apple-subtext">图片来源模式</span>
                  <label class="inline-flex items-center gap-1.5 text-[11px] font-medium text-emerald-700 cursor-pointer">
                    <input type="checkbox" ${layer.useVariable ? 'checked' : ''}
                      onchange="updateLayerProp('${layer.id}', 'useVariable', this.checked)"
                      class="rounded border-gray-300 text-emerald-600 focus:ring-emerald-500" />
                    <span>启用变量（批量图片/文件夹）</span>
                  </label>
                </div>

                ${!layer.useVariable ? `
                  <div class="flex items-center gap-3 p-2.5 bg-gray-50/80 border border-dashed border-gray-300 rounded-xl">
                    ${layer.singleImage ? `
                      <img src="${layer.singleImage.src}" class="w-11 h-11 object-contain rounded-lg bg-white border border-gray-200 shrink-0" />
                      <div class="min-w-0 flex-1">
                        <p class="text-xs font-medium text-apple-text truncate">${escapeHtml(layer.singleImage.name)}</p>
                        <p class="text-[10px] font-mono text-apple-subtext">${layer.singleImage.naturalWidth} × ${layer.singleImage.naturalHeight} px</p>
                      </div>
                    ` : `
                      <div class="w-11 h-11 rounded-lg bg-white border border-gray-200 flex items-center justify-center text-gray-400 shrink-0">
                        <i data-lucide="image" class="w-5 h-5"></i>
                      </div>
                      <div class="flex-1 text-xs text-apple-subtext">请选择一张固定图片</div>
                    `}
                    <label class="px-2.5 py-1.5 bg-white hover:bg-gray-50 border border-apple-border rounded-lg text-xs font-medium text-apple-text shadow-2xs cursor-pointer shrink-0">
                      <span>上传图片</span>
                      <input type="file" accept="image/*" class="hidden" onchange="handleSingleImageUpload(this, '${layer.id}')" />
                    </label>
                  </div>
                ` : `
                  <div class="space-y-2">
                    <div class="grid grid-cols-2 gap-2">
                      <label class="flex items-center justify-center gap-1.5 px-2.5 py-2 bg-emerald-50/70 hover:bg-emerald-50 border border-emerald-200 rounded-xl text-xs font-medium text-emerald-800 cursor-pointer transition">
                        <i data-lucide="images" class="w-3.5 h-3.5"></i>
                        <span>选择多张图片</span>
                        <input type="file" accept="image/*" multiple class="hidden" onchange="handleBatchImagesUpload(this, '${layer.id}')" />
                      </label>
                      <label class="flex items-center justify-center gap-1.5 px-2.5 py-2 bg-emerald-50/70 hover:bg-emerald-50 border border-emerald-200 rounded-xl text-xs font-medium text-emerald-800 cursor-pointer transition">
                        <i data-lucide="folder-open" class="w-3.5 h-3.5"></i>
                        <span>选择整个文件夹</span>
                        <input type="file" webkitdirectory directory multiple class="hidden" onchange="handleBatchImagesUpload(this, '${layer.id}')" />
                      </label>
                    </div>

                    <div class="border border-apple-border rounded-xl overflow-hidden bg-gray-50/50">
                      <div class="px-2.5 py-1.5 bg-gray-100/80 border-b border-apple-border flex items-center justify-between text-[11px] text-apple-subtext">
                        <span>自动按文件名创建变量表 (${layer.variableImages.length} 张)</span>
                        ${layer.variableImages.length > 0 ? `<button type="button" onclick="state.layers.find(l=>l.id==='${layer.id}').variableImages=[]; renderLayersUI(); updatePaginationState(); renderPreview();" class="text-red-500 hover:underline cursor-pointer">清空</button>` : ''}
                      </div>
                      <div class="max-h-32 overflow-y-auto divide-y divide-gray-200/70">
                        ${layer.variableImages.length === 0 ? `
                          <div class="p-3 text-center text-[11px] text-gray-400">尚未选择批量图片或文件夹</div>
                        ` : layer.variableImages.map((imgItem, idx) => `
                          <div class="flex items-center gap-2 px-2 py-1 bg-white">
                            <span class="w-6 text-center text-[11px] font-mono text-gray-400 shrink-0">${idx + 1}</span>
                            <img src="${imgItem.src}" class="w-6 h-6 object-cover rounded border border-gray-200 shrink-0" />
                            <span class="flex-1 text-xs truncate text-apple-text">${escapeHtml(imgItem.name)}</span>
                            <button type="button" onclick="removeVariableImage('${layer.id}', ${idx})" class="text-gray-300 hover:text-red-500 px-1 cursor-pointer">×</button>
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  </div>
                `}

                <!-- 图片尺寸 W, H 与等比锁定 -->
                <div class="grid grid-cols-12 gap-2 items-end">
                  <div class="col-span-5">
                    <label class="block text-[11px] text-apple-subtext mb-1">宽度 W (${u})</label>
                    <input type="number" step="any" id="input_w_${layer.id}" value="${formatDisplayNum(layer.widthMm, u)}"
                      onchange="updateLayerProp('${layer.id}', 'widthMm', this.value, true)"
                      class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                  </div>
                  <div class="col-span-2 flex justify-center pb-1">
                    <button type="button" onclick="updateLayerProp('${layer.id}', 'lockAspectRatio', ${!layer.lockAspectRatio}, false, true)"
                      title="${layer.lockAspectRatio ? '已锁定宽高比' : '已解锁宽高比'}"
                      class="p-1.5 rounded-lg border ${layer.lockAspectRatio ? 'bg-blue-50 border-blue-200 text-apple-blue' : 'bg-gray-50 border-apple-border text-gray-400'} cursor-pointer">
                      <i data-lucide="${layer.lockAspectRatio ? 'link' : 'unlink'}" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                  <div class="col-span-5">
                    <label class="block text-[11px] text-apple-subtext mb-1">高度 H (${u})</label>
                    <input type="number" step="any" id="input_h_${layer.id}" value="${formatDisplayNum(layer.heightMm, u)}"
                      onchange="updateLayerProp('${layer.id}', 'heightMm', this.value, true)"
                      class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                  </div>
                </div>

                <!-- 坐标 X, Y -->
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="block text-[11px] text-apple-subtext mb-1">X 坐标 (${u})</label>
                    <input type="number" step="any" id="input_x_${layer.id}" value="${formatDisplayNum(layer.xMm, u)}"
                      onchange="updateLayerProp('${layer.id}', 'xMm', this.value, true)"
                      class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                  </div>
                  <div>
                    <label class="block text-[11px] text-apple-subtext mb-1">Y 坐标 (${u})</label>
                    <input type="number" step="any" id="input_y_${layer.id}" value="${formatDisplayNum(layer.yMm, u)}"
                      onchange="updateLayerProp('${layer.id}', 'yMm', this.value, true)"
                      class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        // 3. 几何形状图层（矩形 rect / 椭圆形 ellipse / 直线 line）
        const shapeMeta = {
          rect: { icon: 'square', bg: 'bg-amber-50', color: 'text-amber-600' },
          ellipse: { icon: 'circle', bg: 'bg-purple-50', color: 'text-purple-600' },
          line: { icon: 'minus', bg: 'bg-rose-50', color: 'text-rose-600' }
        }[layer.type];

        return `
          <div onclick="selectLayer('${layer.id}')" class="bg-apple-card rounded-2xl border ${borderClass} shadow-2xs transition-all overflow-hidden">
            ${renderHeader(shapeMeta.icon, shapeMeta.bg, shapeMeta.color)}
            <div class="${layer.collapsed ? 'hidden' : 'p-3.5 space-y-3'}">
              
              <!-- 位置 X, Y -->
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[11px] text-apple-subtext mb-1">X 坐标 (${u})</label>
                  <input type="number" step="any" id="input_x_${layer.id}" value="${formatDisplayNum(layer.xMm, u)}"
                    onchange="updateLayerProp('${layer.id}', 'xMm', this.value, true)"
                    class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                </div>
                <div>
                  <label class="block text-[11px] text-apple-subtext mb-1">Y 坐标 (${u})</label>
                  <input type="number" step="any" id="input_y_${layer.id}" value="${formatDisplayNum(layer.yMm, u)}"
                    onchange="updateLayerProp('${layer.id}', 'yMm', this.value, true)"
                    class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                </div>
              </div>

              <!-- 尺寸 W, H -->
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[11px] text-apple-subtext mb-1">${layer.type === 'line' ? `水平跨度 W (${u})` : `宽度 W (${u})`}</label>
                  <input type="number" step="any" id="input_w_${layer.id}" value="${formatDisplayNum(layer.widthMm, u)}"
                    onchange="updateLayerProp('${layer.id}', 'widthMm', this.value, true)"
                    class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                </div>
                <div>
                  <label class="block text-[11px] text-apple-subtext mb-1">${layer.type === 'line' ? `垂直跨度 H (${u})` : `高度 H (${u})`}</label>
                  <input type="number" step="any" id="input_h_${layer.id}" value="${formatDisplayNum(layer.heightMm, u)}"
                    onchange="updateLayerProp('${layer.id}', 'heightMm', this.value, true)"
                    class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                </div>
              </div>

              ${layer.type === 'line' ? `
                <!-- 直线专属方向快捷控制 -->
                <div class="flex items-center justify-between gap-2 bg-gray-50/80 px-2.5 py-1.5 rounded-lg border border-apple-border">
                  <span class="text-[11px] text-apple-subtext">方向快捷：</span>
                  <div class="flex items-center gap-1">
                    <button type="button" onclick="setLinePresetOrientation('${layer.id}', 'horizontal')" class="px-2 py-0.5 text-[11px] bg-white border border-apple-border rounded hover:bg-gray-100 cursor-pointer">水平线</button>
                    <button type="button" onclick="setLinePresetOrientation('${layer.id}', 'vertical')" class="px-2 py-0.5 text-[11px] bg-white border border-apple-border rounded hover:bg-gray-100 cursor-pointer">垂直线</button>
                    <button type="button" onclick="updateLayerProp('${layer.id}', 'lineDirection', '${layer.lineDirection === 'tl-br' ? 'bl-tr' : 'tl-br'}', false, true)"
                      class="px-2 py-0.5 text-[11px] bg-white border border-apple-border rounded hover:bg-gray-100 cursor-pointer" title="切换对角方向">
                      ${layer.lineDirection === 'tl-br' ? '斜向 ↘' : '斜向 ↗'}
                    </button>
                  </div>
                </div>
              ` : `
                <!-- 矩形 & 椭圆形 填充颜色（单行可折叠色板 + 无填充开关） -->
                <div class="pt-1 border-t border-gray-100">
                  ${renderCompactColorPalette({
                    paletteId: `fill_color_${layer.id}`,
                    label: '填充颜色',
                    currentColor: layer.fillColor,
                    onChangeExpr: `updateLayerProp('${layer.id}', 'fillColor', '__COLOR__', false, true)`,
                    allowTransparent: true,
                    isTransparent: layer.fillTransparent,
                    onToggleTransparentExpr: `updateLayerProp('${layer.id}', 'fillTransparent', this.checked, false, true)`
                  })}
                </div>
              `}

              <!-- 描边设置：粗细 + 虚线开关 + 虚线间隙 -->
              <div class="pt-1.5 border-t border-gray-100 space-y-2.5">
                <div class="grid grid-cols-12 gap-2 items-end">
                  <div class="col-span-6">
                    <label class="block text-[11px] text-apple-subtext mb-1">描边大小 (${u})</label>
                    <input type="number" step="any" value="${formatDisplayNum(layer.strokeWidthMm, u)}"
                      onchange="updateLayerProp('${layer.id}', 'strokeWidthMm', this.value, true)"
                      class="w-full px-2 py-1 text-xs font-mono bg-gray-50/70 border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                  </div>
                  <div class="col-span-6 pb-1">
                    <label class="inline-flex items-center gap-1.5 text-xs font-medium text-apple-text cursor-pointer">
                      <input type="checkbox" ${layer.strokeDashed ? 'checked' : ''}
                        onchange="updateLayerProp('${layer.id}', 'strokeDashed', this.checked, false, true)"
                        class="rounded border-gray-300 text-apple-blue focus:ring-apple-blue" />
                      <span>启用描边虚线</span>
                    </label>
                  </div>
                </div>

                ${layer.strokeDashed ? `
                  <div class="grid grid-cols-2 gap-2 p-2 bg-gray-50/80 rounded-xl border border-apple-border">
                    <div>
                      <label class="block text-[11px] text-apple-subtext mb-1">实线段长 (${u})</label>
                      <input type="number" step="any" value="${formatDisplayNum(layer.dashLengthMm, u)}"
                        onchange="updateLayerProp('${layer.id}', 'dashLengthMm', this.value, true)"
                        class="w-full px-2 py-1 text-xs font-mono bg-white border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                    </div>
                    <div>
                      <label class="block text-[11px] text-apple-subtext mb-1">虚线间隙 (${u})</label>
                      <input type="number" step="any" value="${formatDisplayNum(layer.dashGapMm, u)}"
                        onchange="updateLayerProp('${layer.id}', 'dashGapMm', this.value, true)"
                        class="w-full px-2 py-1 text-xs font-mono bg-white border border-apple-border rounded-lg focus:outline-none focus:border-apple-blue" />
                    </div>
                  </div>
                ` : ''}

                <!-- 描边颜色（单行可折叠色板） -->
                ${renderCompactColorPalette({
                  paletteId: `stroke_color_${layer.id}`,
                  label: '描边颜色',
                  currentColor: layer.strokeColor,
                  onChangeExpr: `updateLayerProp('${layer.id}', 'strokeColor', '__COLOR__', false, true)`
                })}
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /**
     * ============================================================================
     * 8. 变量分页计算与翻页控制
     * ============================================================================
     */
    function getTotalVariablePages() {
      let maxPages = 1;
      for (const layer of state.layers) {
        if (layer.type === 'text' && layer.useVariable && layer.variables.length > 0) {
          maxPages = Math.max(maxPages, layer.variables.length);
        } else if (layer.type === 'image' && layer.useVariable && layer.variableImages.length > 0) {
          maxPages = Math.max(maxPages, layer.variableImages.length);
        }
      }
      return maxPages;
    }

    function updatePaginationState() {
      const total = getTotalVariablePages();
      if (state.currentPage > total) state.currentPage = total;
      if (state.currentPage < 1) state.currentPage = 1;

      document.getElementById('totalPagesLabel').textContent = total;
      const pageInput = document.getElementById('currentPageInput');
      pageInput.value = state.currentPage;
      pageInput.max = total;

      document.getElementById('prevPageBtn').disabled = state.currentPage <= 1;
      document.getElementById('nextPageBtn').disabled = state.currentPage >= total;

      const hasVar = state.layers.some(l => (l.type === 'text' && l.useVariable) || (l.type === 'image' && l.useVariable));
      document.getElementById('variableSummaryText').textContent = hasVar
        ? `批量变量已激活 · 共 ${total} 组序列化页面（翻页实时预览切换）`
        : `当前无批量变量（共 1 页静态预览）`;
    }

    function changePage(delta) {
      const total = getTotalVariablePages();
      const next = Math.min(total, Math.max(1, state.currentPage + delta));
      if (next !== state.currentPage) {
        state.currentPage = next;
        updatePaginationState();
        renderPreview();
      }
    }

    function jumpToPage(val) {
      const total = getTotalVariablePages();
      const num = parseInt(val, 10);
      if (isNaN(num)) {
        updatePaginationState();
        return;
      }
      state.currentPage = Math.min(total, Math.max(1, num));
      updatePaginationState();
      renderPreview();
    }

    function getActiveTextForLayer(layer, pageIndex1Based) {
      if (!layer.useVariable || layer.variables.length === 0) return layer.text || '';
      const idx = (pageIndex1Based - 1) % layer.variables.length;
      return layer.variables[idx] ?? '';
    }

    function getActiveImageForLayer(layer, pageIndex1Based) {
      if (!layer.useVariable) return layer.singleImage;
      if (layer.variableImages.length === 0) return null;
      const idx = (pageIndex1Based - 1) % layer.variableImages.length;
      return layer.variableImages[idx];
    }

    /**
     * ============================================================================
     * 9. 核心渲染引擎（支持参考背景图、全图层矢量/位图、交互定界框与控制手柄）
     * ============================================================================
     */
    function renderDocumentToContext(ctx, pixelWidth, pixelHeight, pageIndex, isPreview = false) {
      // 开启最高品质图像平滑插值
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // 1. 画布纯色背景
      ctx.save();
      ctx.fillStyle = state.canvasBgColor;
      ctx.fillRect(0, 0, pixelWidth, pixelHeight);
      ctx.restore();

      const scaleX = pixelWidth / mmToPx(state.canvasWidthMm);
      const scaleY = pixelHeight / mmToPx(state.canvasHeightMm);

      // 2. 参考背景图（仅当预览模式，或导出未开启隐藏时渲染）
      if (state.refBgImage && state.refBgImage.imgObj && (isPreview || !state.refBgHideOnExport)) {
        ctx.save();
        ctx.globalAlpha = state.refBgOpacity;
        const img = state.refBgImage.imgObj;
        let drawX = 0, drawY = 0, drawW = pixelWidth, drawH = pixelHeight;
        if (state.refBgFitMode === 'contain') {
          const imgRatio = img.naturalWidth / img.naturalHeight;
          const canvasRatio = pixelWidth / pixelHeight;
          if (imgRatio > canvasRatio) {
            drawH = pixelWidth / imgRatio;
            drawY = (pixelHeight - drawH) / 2;
          } else {
            drawW = pixelHeight * imgRatio;
            drawX = (pixelWidth - drawW) / 2;
          }
        }
        ctx.drawImage(img, drawX, drawY, drawW, drawH);
        ctx.restore();
      }

      // 3. 预览坐标参考网格
      if (isPreview && document.getElementById('showRulerCheck')?.checked) {
        ctx.save();
        ctx.strokeStyle = 'rgba(0, 113, 227, 0.08)';
        ctx.lineWidth = 1;
        const stepPx = mmToPx(10) * scaleX;
        if (stepPx >= 6) {
          for (let x = stepPx; x < pixelWidth; x += stepPx) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, pixelHeight);
            ctx.stroke();
          }
          for (let y = stepPx; y < pixelHeight; y += stepPx) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(pixelWidth, y);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      if (isPreview) {
        for (const k in computedBoundsMap) delete computedBoundsMap[k];
      }

      // 4. 逐层渲染内容元素
      for (const layer of state.layers) {
        ctx.save();
        let boundsMm = { xMm: layer.xMm, yMm: layer.yMm, wMm: 10, hMm: 10 };

        if (layer.type === 'image') {
          const x = mmToPx(layer.xMm) * scaleX;
          const y = mmToPx(layer.yMm) * scaleY;
          const w = mmToPx(layer.widthMm) * scaleX;
          const h = mmToPx(layer.heightMm) * scaleY;
          boundsMm = { xMm: layer.xMm, yMm: layer.yMm, wMm: layer.widthMm, hMm: layer.heightMm };

          const imgData = getActiveImageForLayer(layer, pageIndex);
          if (imgData && imgData.imgObj) {
            ctx.drawImage(imgData.imgObj, x, y, w, h);
          } else if (isPreview) {
            ctx.fillStyle = 'rgba(16, 185, 129, 0.08)';
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.5)';
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = '#059669';
            ctx.font = `${Math.max(11, 12 * scaleX)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('待上传图片', x + w / 2, y + h / 2);
          }
        } else if (layer.type === 'rect' || layer.type === 'ellipse' || layer.type === 'line') {
          const x = mmToPx(layer.xMm) * scaleX;
          const y = mmToPx(layer.yMm) * scaleY;
          const w = mmToPx(layer.widthMm) * scaleX;
          const h = mmToPx(layer.heightMm) * scaleY;
          boundsMm = { xMm: layer.xMm, yMm: layer.yMm, wMm: layer.widthMm, hMm: layer.heightMm };

          const hasFill = layer.type !== 'line' && !layer.fillTransparent;
          const hasStroke = (layer.strokeWidthMm || 0) > 0;

          if (hasFill) ctx.fillStyle = layer.fillColor;
          if (hasStroke) {
            ctx.strokeStyle = layer.strokeColor;
            ctx.lineWidth = Math.max(0.5, mmToPx(layer.strokeWidthMm) * scaleX);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (layer.strokeDashed) {
              ctx.setLineDash([
                Math.max(1, mmToPx(layer.dashLengthMm) * scaleX),
                Math.max(1, mmToPx(layer.dashGapMm) * scaleX)
              ]);
            }
          }

          ctx.beginPath();
          if (layer.type === 'rect') {
            ctx.rect(x, y, w, h);
          } else if (layer.type === 'ellipse') {
            ctx.ellipse(x + w / 2, y + h / 2, Math.max(0.5, w / 2), Math.max(0.5, h / 2), 0, 0, Math.PI * 2);
          } else if (layer.type === 'line') {
            if (layer.lineDirection === 'bl-tr') {
              ctx.moveTo(x, y + h);
              ctx.lineTo(x + w, y);
            } else {
              ctx.moveTo(x, y);
              ctx.lineTo(x + w, y + h);
            }
          }

          if (hasFill) ctx.fill();
          if (hasStroke) ctx.stroke();
        } else if (layer.type === 'text') {
          const content = getActiveTextForLayer(layer, pageIndex);
          const fontSizePx = mmToPx(layer.fontSizeMm) * scaleY;
          const letterSpacingPx = mmToPx(layer.letterSpacingMm || 0) * scaleX;
          const lineHeightPx = fontSizePx * (layer.lineHeightRatio || 1.2);
          const anchor = layer.anchor || 'left';
          const fontStack = layer.customFont && layer.customFont.trim()
            ? `"${layer.customFont.trim()}", ${layer.fontFamily}`
            : layer.fontFamily;

          ctx.font = `${layer.fontWeight} ${fontSizePx}px ${fontStack}`;
          ctx.fillStyle = layer.color;
          ctx.textBaseline = 'top';

          const lines = (content || '').split('\n');
          let naturalWidthPx = 0;
          const measuredLines = lines.map(line => {
            const chars = Array.from(line);
            let lineW = 0;
            chars.forEach((ch, idx) => {
              lineW += ctx.measureText(ch).width + (idx < chars.length - 1 ? letterSpacingPx : 0);
            });
            naturalWidthPx = Math.max(naturalWidthPx, lineW);
            return { chars, width: lineW };
          });
          const naturalHeightPx = Math.max(fontSizePx, lines.length * lineHeightPx);

          const naturalWidthMm = pxToMm(naturalWidthPx / scaleX);
          const naturalHeightMm = pxToMm(naturalHeightPx / scaleY);
          const targetWMm = layer.constrainBox ? layer.boxWidthMm : naturalWidthMm;
          const targetHMm = layer.constrainBox ? layer.boxHeightMm : naturalHeightMm;

          let boxLeftMm = layer.xMm;
          if (anchor === 'center') boxLeftMm = layer.xMm - targetWMm / 2;
          else if (anchor === 'right') boxLeftMm = layer.xMm - targetWMm;

          boundsMm = { xMm: boxLeftMm, yMm: layer.yMm, wMm: targetWMm, hMm: targetHMm };

          const boxLeftPx = mmToPx(boxLeftMm) * scaleX;
          const boxTopPx = mmToPx(layer.yMm) * scaleY;
          const stretchX = naturalWidthPx > 0 ? (mmToPx(targetWMm) * scaleX) / naturalWidthPx : 1;
          const stretchY = naturalHeightPx > 0 ? (mmToPx(targetHMm) * scaleY) / naturalHeightPx : 1;

          ctx.translate(boxLeftPx, boxTopPx);
          if (layer.constrainBox) {
            ctx.scale(stretchX, stretchY);
          }

          measuredLines.forEach((lineObj, lineIdx) => {
            let cursorX = 0;
            if (anchor === 'center') cursorX = (naturalWidthPx - lineObj.width) / 2;
            else if (anchor === 'right') cursorX = naturalWidthPx - lineObj.width;
            const cursorY = lineIdx * lineHeightPx;

            lineObj.chars.forEach(ch => {
              ctx.fillText(ch, cursorX, cursorY);
              cursorX += ctx.measureText(ch).width + letterSpacingPx;
            });
          });
        }

        ctx.restore();

        if (isPreview) {
          computedBoundsMap[layer.id] = boundsMm;
        }
      }

      // 5. 预览选中高亮框、基准参考线与 8 向控制手柄
      if (isPreview && state.selectedLayerId && computedBoundsMap[state.selectedLayerId]) {
        const selLayer = state.layers.find(l => l.id === state.selectedLayerId);
        const b = computedBoundsMap[state.selectedLayerId];
        const bx = mmToPx(b.xMm) * scaleX;
        const by = mmToPx(b.yMm) * scaleY;
        const bw = mmToPx(b.wMm) * scaleX;
        const bh = mmToPx(b.hMm) * scaleY;

        ctx.save();
        ctx.strokeStyle = '#0071E3';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(bx, by, bw, bh);

        // 文字锚点基准垂直指示线
        if (selLayer && selLayer.type === 'text') {
          const anchorX = mmToPx(selLayer.xMm) * scaleX;
          ctx.save();
          ctx.strokeStyle = '#0071E3';
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(anchorX, Math.max(0, by - 14));
          ctx.lineTo(anchorX, Math.min(pixelHeight, by + bh + 14));
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = '#0071E3';
          ctx.beginPath();
          ctx.arc(anchorX, by - 6, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 绘制 8 个控制手柄
        const handles = getHandlePositionsPx(bx, by, bw, bh);
        handles.forEach(h => {
          ctx.fillStyle = '#FFFFFF';
          ctx.strokeStyle = '#0071E3';
          ctx.lineWidth = 1.5;
          ctx.fillRect(h.x - 4, h.y - 4, 8, 8);
          ctx.strokeRect(h.x - 4, h.y - 4, 8, 8);
        });
        ctx.restore();
      }
    }

    function getHandlePositionsPx(bx, by, bw, bh) {
      return [
        { id: 'nw', x: bx, y: by, cursor: 'nwse-resize' },
        { id: 'n', x: bx + bw / 2, y: by, cursor: 'ns-resize' },
        { id: 'ne', x: bx + bw, y: by, cursor: 'nesw-resize' },
        { id: 'e', x: bx + bw, y: by + bh / 2, cursor: 'ew-resize' },
        { id: 'se', x: bx + bw, y: by + bh, cursor: 'nwse-resize' },
        { id: 's', x: bx + bw / 2, y: by + bh, cursor: 'ns-resize' },
        { id: 'sw', x: bx, y: by + bh, cursor: 'nesw-resize' },
        { id: 'w', x: bx, y: by + bh / 2, cursor: 'ew-resize' }
      ];
    }

    function renderPreview() {
      const viewport = document.getElementById('canvasViewport');
      const canvas = document.getElementById('previewCanvas');
      if (!viewport || !canvas) return;

      const availW = Math.max(120, viewport.clientWidth - 48);
      const availH = Math.max(120, viewport.clientHeight - 48);

      const physW = mmToPx(state.canvasWidthMm);
      const physH = mmToPx(state.canvasHeightMm);
      const fitScale = Math.min(availW / physW, availH / physH, 1.5);
      interactState.previewScale = fitScale;

      const cssW = Math.max(40, Math.round(physW * fitScale));
      const cssH = Math.max(40, Math.round(physH * fitScale));
      const dpr = window.devicePixelRatio || 1;

      canvas.style.width = `${cssW}px`;
      canvas.style.height = `${cssH}px`;
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);

      const zoomBadge = document.getElementById('zoomScaleBadge');
      if (zoomBadge) zoomBadge.textContent = `${Math.round(fitScale * 100)}%`;

      const ctx = canvas.getContext('2d');
      renderDocumentToContext(ctx, canvas.width, canvas.height, state.currentPage, true);
    }

    /**
     * ============================================================================
     * 10. 画布鼠标拖拽移动与 8 向控制手柄缩放交互
     * ============================================================================
     */
    function setupCanvasInteractions() {
      const canvas = document.getElementById('previewCanvas');
      if (!canvas) return;

      function getMousePosMmAndPx(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const pxX = clientX - rect.left;
        const pxY = clientY - rect.top;
        const xMm = (pxX / rect.width) * state.canvasWidthMm;
        const yMm = (pxY / rect.height) * state.canvasHeightMm;
        return { pxX, pxY, xMm, yMm, rectW: rect.width, rectH: rect.height };
      }

      canvas.addEventListener('mousedown', (e) => {
        const { pxX, pxY, xMm, yMm, rectW, rectH } = getMousePosMmAndPx(e);
        const scaleX = rectW / state.canvasWidthMm;
        const scaleY = rectH / state.canvasHeightMm;

        // 1. 优先检测当前选中图层的 8 个缩放手柄
        if (state.selectedLayerId && computedBoundsMap[state.selectedLayerId]) {
          const b = computedBoundsMap[state.selectedLayerId];
          const handles = getHandlePositionsPx(b.xMm * scaleX, b.yMm * scaleY, b.wMm * scaleX, b.hMm * scaleY);
          const hitHandle = handles.find(h => Math.abs(pxX - h.x) <= 7 && Math.abs(pxY - h.y) <= 7);
          if (hitHandle) {
            const layer = state.layers.find(l => l.id === state.selectedLayerId);
            if (layer) {
              interactState.mode = 'resize';
              interactState.handle = hitHandle.id;
              interactState.layerId = layer.id;
              interactState.startMouseXMm = xMm;
              interactState.startMouseYMm = yMm;
              interactState.origXMm = b.xMm;
              interactState.origYMm = b.yMm;
              interactState.origWMm = b.wMm;
              interactState.origHMm = b.hMm;
              interactState.origFontSizeMm = layer.fontSizeMm || 8;
              return;
            }
          }
        }

        // 2. 自顶向下命中测试选择图层
        let hitLayerId = null;
        for (let i = state.layers.length - 1; i >= 0; i--) {
          const l = state.layers[i];
          const b = computedBoundsMap[l.id];
          if (!b) continue;
          const padMm = 1.5;
          if (xMm >= b.xMm - padMm && xMm <= b.xMm + b.wMm + padMm &&
              yMm >= b.yMm - padMm && yMm <= b.yMm + b.hMm + padMm) {
            hitLayerId = l.id;
            break;
          }
        }

        if (hitLayerId) {
          selectLayer(hitLayerId);
          const layer = state.layers.find(l => l.id === hitLayerId);
          interactState.mode = 'move';
          interactState.layerId = layer.id;
          interactState.startMouseXMm = xMm;
          interactState.startMouseYMm = yMm;
          interactState.origXMm = layer.xMm;
          interactState.origYMm = layer.yMm;
        } else {
          state.selectedLayerId = null;
          renderLayersUI();
          renderPreview();
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (interactState.mode === 'none') {
          if (e.target === canvas && state.selectedLayerId && computedBoundsMap[state.selectedLayerId]) {
            const { pxX, pxY, rectW, rectH } = getMousePosMmAndPx(e);
            const b = computedBoundsMap[state.selectedLayerId];
            const handles = getHandlePositionsPx(
              b.xMm * (rectW / state.canvasWidthMm),
              b.yMm * (rectH / state.canvasHeightMm),
              b.wMm * (rectW / state.canvasWidthMm),
              b.hMm * (rectH / state.canvasHeightMm)
            );
            const hit = handles.find(h => Math.abs(pxX - h.x) <= 7 && Math.abs(pxY - h.y) <= 7);
            canvas.style.cursor = hit ? hit.cursor : 'move';
          }
          return;
        }

        const layer = state.layers.find(l => l.id === interactState.layerId);
        if (!layer) return;

        const { xMm, yMm } = getMousePosMmAndPx(e);
        const dx = xMm - interactState.startMouseXMm;
        const dy = yMm - interactState.startMouseYMm;

        if (interactState.mode === 'move') {
          layer.xMm = Number((interactState.origXMm + dx).toFixed(2));
          layer.yMm = Number((interactState.origYMm + dy).toFixed(2));
          syncLayerNumericInputs(layer);
          renderPreview();
        } else if (interactState.mode === 'resize') {
          const h = interactState.handle;
          let newLeft = interactState.origXMm;
          let newTop = interactState.origYMm;
          let newW = interactState.origWMm;
          let newH = interactState.origHMm;

          if (h.includes('e')) newW = Math.max(0.5, interactState.origWMm + dx);
          if (h.includes('s')) newH = Math.max(layer.type === 'line' ? 0 : 0.5, interactState.origHMm + dy);
          if (h.includes('w')) {
            const maxShift = interactState.origWMm - 0.5;
            const shift = Math.min(maxShift, dx);
            newLeft = interactState.origXMm + shift;
            newW = interactState.origWMm - shift;
          }
          if (h.includes('n')) {
            const maxShift = interactState.origHMm - (layer.type === 'line' ? 0 : 0.5);
            const shift = Math.min(maxShift, dy);
            newTop = interactState.origYMm + shift;
            newH = interactState.origHMm - shift;
          }

          // 按住 Shift 键或图片锁定比例时保持等比缩放
          if ((e.shiftKey || (layer.type === 'image' && layer.lockAspectRatio)) && interactState.origHMm > 0) {
            const aspect = interactState.origWMm / interactState.origHMm;
            if (h === 'n' || h === 's') {
              newW = newH * aspect;
            } else {
              newH = newW / aspect;
            }
          }

          if (layer.type === 'text') {
            if (layer.constrainBox) {
              layer.boxWidthMm = Number(newW.toFixed(2));
              layer.boxHeightMm = Number(newH.toFixed(2));
            } else if (interactState.origHMm > 0) {
              const scaleRatio = newH / interactState.origHMm;
              layer.fontSizeMm = Number(Math.max(1, interactState.origFontSizeMm * scaleRatio).toFixed(2));
            }
            const anchor = layer.anchor || 'left';
            if (anchor === 'center') layer.xMm = Number((newLeft + newW / 2).toFixed(2));
            else if (anchor === 'right') layer.xMm = Number((newLeft + newW).toFixed(2));
            else layer.xMm = Number(newLeft.toFixed(2));
            layer.yMm = Number(newTop.toFixed(2));
          } else {
            layer.xMm = Number(newLeft.toFixed(2));
            layer.yMm = Number(newTop.toFixed(2));
            layer.widthMm = Number(newW.toFixed(2));
            layer.heightMm = Number(newH.toFixed(2));
          }

          syncLayerNumericInputs(layer);
          renderPreview();
        }
      });

      window.addEventListener('mouseup', () => {
        if (interactState.mode !== 'none') {
          interactState.mode = 'none';
          interactState.handle = null;
          renderLayersUI();
        }
      });
    }

    function syncLayerNumericInputs(layer) {
      const u = state.unit;
      const xEl = document.getElementById(`input_x_${layer.id}`);
      const yEl = document.getElementById(`input_y_${layer.id}`);
      if (xEl) xEl.value = formatDisplayNum(layer.xMm, u);
      if (yEl) yEl.value = formatDisplayNum(layer.yMm, u);

      if (layer.type === 'text') {
        const fsEl = document.getElementById(`input_fontsize_${layer.id}`);
        const bwEl = document.getElementById(`input_boxw_${layer.id}`);
        const bhEl = document.getElementById(`input_boxh_${layer.id}`);
        if (fsEl) fsEl.value = formatDisplayNum(layer.fontSizeMm, u);
        if (bwEl) bwEl.value = formatDisplayNum(layer.boxWidthMm, u);
        if (bhEl) bhEl.value = formatDisplayNum(layer.boxHeightMm, u);
      } else {
        const wEl = document.getElementById(`input_w_${layer.id}`);
        const hEl = document.getElementById(`input_h_${layer.id}`);
        if (wEl) wEl.value = formatDisplayNum(layer.widthMm, u);
        if (hEl) hEl.value = formatDisplayNum(layer.heightMm, u);
      }
    }

    /**
     * ============================================================================
     * 11. 模板导入与导出功能 (JSON 序列化与恢复)
     * ============================================================================
     */
    function exportTemplate() {
      const serializedLayers = state.layers.map(layer => {
        const copy = { ...layer };
        if (layer.type === 'image') {
          copy.singleImage = layer.singleImage
            ? { name: layer.singleImage.name, src: layer.singleImage.src, naturalWidth: layer.singleImage.naturalWidth, naturalHeight: layer.singleImage.naturalHeight }
            : null;
          copy.variableImages = (layer.variableImages || []).map(img => ({
            name: img.name,
            src: img.src,
            naturalWidth: img.naturalWidth,
            naturalHeight: img.naturalHeight
          }));
        }
        return copy;
      });

      const templatePayload = {
        version: '2.0',
        exportedAt: new Date().toISOString(),
        projectName: state.projectName,
        unit: state.unit,
        canvasWidthMm: state.canvasWidthMm,
        canvasHeightMm: state.canvasHeightMm,
        canvasBgColor: state.canvasBgColor,
        refBgImage: state.refBgImage
          ? { name: state.refBgImage.name, src: state.refBgImage.src, naturalWidth: state.refBgImage.naturalWidth, naturalHeight: state.refBgImage.naturalHeight }
          : null,
        refBgOpacity: state.refBgOpacity,
        refBgHideOnExport: state.refBgHideOnExport,
        refBgFitMode: state.refBgFitMode,
        layers: serializedLayers
      };

      const jsonStr = JSON.stringify(templatePayload, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
      const fileName = `${sanitizeFilename(state.projectName)}_模板.json`;
      triggerDownload(blob, fileName);
      showToast(`模板已导出：${fileName}`, 'success');
    }

    async function importTemplate(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data || !Array.isArray(data.layers)) {
          throw new Error('无效的模板文件格式');
        }

        state.projectName = data.projectName || '未命名项目';
        document.getElementById('projectNameInput').value = state.projectName;

        state.canvasWidthMm = Number(data.canvasWidthMm) || 150;
        state.canvasHeightMm = Number(data.canvasHeightMm) || 100;
        state.canvasBgColor = data.canvasBgColor || '#FFFFFF';
        state.refBgOpacity = typeof data.refBgOpacity === 'number' ? data.refBgOpacity : 0.4;
        state.refBgHideOnExport = data.refBgHideOnExport !== false;
        state.refBgFitMode = data.refBgFitMode || 'stretch';

        if (data.refBgImage && data.refBgImage.src) {
          state.refBgImage = await loadImageFromDataUrl(data.refBgImage.src, data.refBgImage.name);
        } else {
          state.refBgImage = null;
        }

        const restoredLayers = [];
        for (const rawLayer of data.layers) {
          const layer = { ...rawLayer, id: 'layer_' + (layerIdCounter++) };
          if (layer.type === 'image') {
            layer.singleImage = rawLayer.singleImage && rawLayer.singleImage.src
              ? await loadImageFromDataUrl(rawLayer.singleImage.src, rawLayer.singleImage.name)
              : null;
            layer.variableImages = [];
            if (Array.isArray(rawLayer.variableImages)) {
              for (const vImg of rawLayer.variableImages) {
                if (vImg && vImg.src) {
                  const loaded = await loadImageFromDataUrl(vImg.src, vImg.name);
                  if (loaded) layer.variableImages.push(loaded);
                }
              }
            }
          }
          restoredLayers.push(layer);
        }

        state.layers = restoredLayers;
        state.selectedLayerId = restoredLayers.length ? restoredLayers[0].id : null;
        state.currentPage = 1;

        if (data.unit && (data.unit === 'mm' || data.unit === 'pt')) {
          switchUnit(data.unit);
        } else {
          syncCanvasInputs();
        }
        renderCanvasBgPaletteUI();
        syncRefBgUI();
        renderLayersUI();
        updatePaginationState();
        renderPreview();
        showToast(`已成功导入模板：${file.name}`, 'success');
      } catch (err) {
        console.error('模板导入失败:', err);
        showToast('模板导入失败：文件格式不正确或已损坏', 'error');
      } finally {
        input.value = '';
      }
    }

    /**
     * ============================================================================
     * 12. 300 PPI 超高清位图 & 原生真矢量 PDF 批量导出引擎
     * ============================================================================
     */
    function sanitizeFilename(name) {
      return (name || '未命名项目').replace(/[\\/:*?"<>|]/g, '_').trim();
    }

    function padSequence(num, total) {
      const digits = Math.max(2, String(total).length);
      return String(num).padStart(digits, '0');
    }

    // 缓存已加载的矢量字体对象，避免重复请求
    let cachedVectorFont = null;
    let vectorFontLoadPromise = null;

    async function getVectorFont() {
      if (cachedVectorFont) return cachedVectorFont;
      if (vectorFontLoadPromise) return vectorFontLoadPromise;

      vectorFontLoadPromise = (async () => {
        // 加载支持简体中文的轻量级 WOFF/TTF 开源字体以提取精确真矢量字形轮廓
        const fontUrls = [
          'https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf',
          'https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.0.12/files/noto-sans-sc-chinese-simplified-400-normal.woff'
        ];
        for (const url of fontUrls) {
          try {
            const resp = await fetch(url);
            if (!resp.ok) continue;
            const buf = await resp.arrayBuffer();
            const font = opentype.parse(buf);
            if (font) {
              cachedVectorFont = font;
              return font;
            }
          } catch (e) {
            // 尝试下一个备用源
          }
        }
        return null;
      })();

      return vectorFontLoadPromise;
    }

    function hexToRgb(hex) {
      const clean = (hex || '#000000').replace('#', '');
      const num = parseInt(clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    /**
     * 将 OpenType 矢量路径命令直接写入 jsPDF 原生矢量绘图流（100% 真矢量贝塞尔曲线）
     */
    function drawOpenTypePathToPdf(doc, otPath, fillRgb) {
      if (!otPath || !otPath.commands || otPath.commands.length === 0) return;
      doc.setFillColor(fillRgb.r, fillRgb.g, fillRgb.b);

      const ops = [];
      let curX = 0, curY = 0;

      for (const cmd of otPath.commands) {
        if (cmd.type === 'M') {
          curX = cmd.x;
          curY = cmd.y;
          ops.push({ op: 'm', c: [curX, curY] });
        } else if (cmd.type === 'L') {
          curX = cmd.x;
          curY = cmd.y;
          ops.push({ op: 'l', c: [curX, curY] });
        } else if (cmd.type === 'Q') {
          // 二次贝塞尔曲线转三次贝塞尔曲线写入 PDF
          const c1x = curX + (2 / 3) * (cmd.x1 - curX);
          const c1y = curY + (2 / 3) * (cmd.y1 - curY);
          const c2x = cmd.x + (2 / 3) * (cmd.x1 - cmd.x);
          const c2y = cmd.y + (2 / 3) * (cmd.y1 - cmd.y);
          curX = cmd.x;
          curY = cmd.y;
          ops.push({ op: 'c', c: [c1x, c1y, c2x, c2y, curX, curY] });
        } else if (cmd.type === 'C') {
          curX = cmd.x;
          curY = cmd.y;
          ops.push({ op: 'c', c: [cmd.x1, cmd.y1, cmd.x2, cmd.y2, curX, curY] });
        } else if (cmd.type === 'Z') {
          ops.push({ op: 'h', c: [] });
        }
      }

      if (ops.length > 0) {
        doc.path(ops);
        doc.fill();
      }
    }

    /**
     * 直接生成并触发下载真矢量 PDF 文件（不依赖 window.print 弹窗，兼容所有浏览器与沙盒预览环境）
     */
    async function exportDirectVectorPdf(totalPages, projectName, progressCb) {
      const { jsPDF } = window.jspdf;
      const wMm = state.canvasWidthMm;
      const hMm = state.canvasHeightMm;
      const orientation = wMm >= hMm ? 'l' : 'p';

      const doc = new jsPDF({
        orientation,
        unit: 'mm',
        format: [wMm, hMm],
        compress: true
      });

      // 尝试获取真矢量字体轮廓引擎
      const vectorFont = await getVectorFont();

      for (let page = 1; page <= totalPages; page++) {
        if (progressCb) progressCb(page, totalPages);
        await new Promise(r => setTimeout(r, 8));

        if (page > 1) {
          doc.addPage([wMm, hMm], orientation);
        }

        // 1. 矢量纯色画布背景
        const bgRgb = hexToRgb(state.canvasBgColor);
        doc.setFillColor(bgRgb.r, bgRgb.g, bgRgb.b);
        doc.rect(0, 0, wMm, hMm, 'F');

        // 2. 参考背景图（仅当导出不隐藏时）
        if (state.refBgImage && state.refBgImage.src && !state.refBgHideOnExport) {
          try {
            doc.saveGraphicsState();
            doc.setGState(new doc.GState({ opacity: state.refBgOpacity }));
            let drawX = 0, drawY = 0, drawW = wMm, drawH = hMm;
            if (state.refBgFitMode === 'contain' && state.refBgImage.naturalHeight > 0) {
              const imgRatio = state.refBgImage.naturalWidth / state.refBgImage.naturalHeight;
              const canvasRatio = wMm / hMm;
              if (imgRatio > canvasRatio) {
                drawH = wMm / imgRatio;
                drawY = (hMm - drawH) / 2;
              } else {
                drawW = hMm * imgRatio;
                drawX = (wMm - drawW) / 2;
              }
            }
            const imgFmt = state.refBgImage.src.startsWith('data:image/jpeg') ? 'JPEG' : 'PNG';
            doc.addImage(state.refBgImage.src, imgFmt, drawX, drawY, drawW, drawH, undefined, 'FAST');
            doc.restoreGraphicsState();
          } catch (e) {}
        }

        // 3. 逐层写入原生矢量图形、原图无损图片与真矢量文字
        for (const layer of state.layers) {
          if (layer.type === 'image') {
            const imgData = getActiveImageForLayer(layer, page);
            if (imgData && imgData.src) {
              const imgFmt = imgData.src.startsWith('data:image/jpeg') ? 'JPEG' : 'PNG';
              doc.addImage(imgData.src, imgFmt, layer.xMm, layer.yMm, layer.widthMm, layer.heightMm, undefined, 'NONE');
            }
          } else if (layer.type === 'rect' || layer.type === 'ellipse' || layer.type === 'line') {
            const hasFill = layer.type !== 'line' && !layer.fillTransparent;
            const hasStroke = (layer.strokeWidthMm || 0) > 0;
            if (!hasFill && !hasStroke) continue;

            if (hasFill) {
              const fRgb = hexToRgb(layer.fillColor);
              doc.setFillColor(fRgb.r, fRgb.g, fRgb.b);
            }
            if (hasStroke) {
              const sRgb = hexToRgb(layer.strokeColor);
              doc.setDrawColor(sRgb.r, sRgb.g, sRgb.b);
              doc.setLineWidth(layer.strokeWidthMm);
              doc.setLineCap('round');
              doc.setLineJoin('round');
              if (layer.strokeDashed) {
                doc.setLineDashPattern([Math.max(0.1, layer.dashLengthMm), Math.max(0.1, layer.dashGapMm)], 0);
              } else {
                doc.setLineDashPattern([], 0);
              }
            }

            const styleFlag = hasFill && hasStroke ? 'FD' : (hasFill ? 'F' : 'S');
            if (layer.type === 'rect') {
              doc.rect(layer.xMm, layer.yMm, layer.widthMm, layer.heightMm, styleFlag);
            } else if (layer.type === 'ellipse') {
              const rx = Math.max(0.05, layer.widthMm / 2);
              const ry = Math.max(0.05, layer.heightMm / 2);
              doc.ellipse(layer.xMm + rx, layer.yMm + ry, rx, ry, styleFlag);
            } else if (layer.type === 'line') {
              if (layer.lineDirection === 'bl-tr') {
                doc.line(layer.xMm, layer.yMm + layer.heightMm, layer.xMm + layer.widthMm, layer.yMm);
              } else {
                doc.line(layer.xMm, layer.yMm, layer.xMm + layer.widthMm, layer.yMm + layer.heightMm);
              }
            }
            doc.setLineDashPattern([], 0);
          } else if (layer.type === 'text') {
            const content = getActiveTextForLayer(layer, page);
            if (!content) continue;

            const anchor = layer.anchor || 'left';
            const textRgb = hexToRgb(layer.color);
            const fontStack = layer.customFont && layer.customFont.trim()
              ? `"${layer.customFont.trim()}", ${layer.fontFamily}`
              : layer.fontFamily;

            const natDims = measureTextDimensionsMm(
              content,
              layer.fontSizeMm,
              layer.letterSpacingMm || 0,
              layer.lineHeightRatio || 1.2,
              layer.fontWeight,
              fontStack
            );

            const targetWMm = layer.constrainBox ? layer.boxWidthMm : natDims.widthMm;
            const targetHMm = layer.constrainBox ? layer.boxHeightMm : natDims.heightMm;

            let boxLeftMm = layer.xMm;
            if (anchor === 'center') boxLeftMm = layer.xMm - targetWMm / 2;
            else if (anchor === 'right') boxLeftMm = layer.xMm - targetWMm;

            const lines = content.split('\n');
            const lineHeightMm = layer.fontSizeMm * (layer.lineHeightRatio || 1.2);
            const stretchX = (layer.constrainBox && natDims.widthMm > 0) ? (targetWMm / natDims.widthMm) : 1;
            const stretchY = (layer.constrainBox && natDims.heightMm > 0) ? (targetHMm / natDims.heightMm) : 1;

            // 优先使用 OpenType 真矢量轮廓曲线直接写入 PDF（任意放大 1000% 绝对锐利，支持全中文）
            if (vectorFont && typeof doc.path === 'function') {
              const unitsPerEm = vectorFont.unitsPerEm || 1000;
              const ascenderRatio = (vectorFont.ascender || 880) / unitsPerEm;

              lines.forEach((line, lineIdx) => {
                const chars = Array.from(line);
                // 计算当前行总宽度
                let lineWMm = 0;
                const charWidthsMm = chars.map((ch, cIdx) => {
                  const glyph = vectorFont.charToGlyph(ch);
                  const adv = ((glyph.advanceWidth || unitsPerEm * 0.5) / unitsPerEm) * layer.fontSizeMm;
                  const sp = cIdx < chars.length - 1 ? (layer.letterSpacingMm || 0) : 0;
                  lineWMm += adv + sp;
                  return adv;
                });

                let cursorXMm = 0;
                if (anchor === 'center') cursorXMm = (natDims.widthMm - lineWMm) / 2;
                else if (anchor === 'right') cursorXMm = natDims.widthMm - lineWMm;

                const baselineYMm = lineIdx * lineHeightMm + layer.fontSizeMm * ascenderRatio;

                chars.forEach((ch, cIdx) => {
                  const glyph = vectorFont.charToGlyph(ch);
                  const rawPath = glyph.getPath(0, 0, layer.fontSizeMm);
                  // 应用非等比拉伸与最终画布定位
                  rawPath.commands.forEach(cmd => {
                    if (cmd.x !== undefined) cmd.x = boxLeftMm + (cursorXMm + cmd.x) * stretchX;
                    if (cmd.y !== undefined) cmd.y = layer.yMm + (baselineYMm + cmd.y) * stretchY;
                    if (cmd.x1 !== undefined) cmd.x1 = boxLeftMm + (cursorXMm + cmd.x1) * stretchX;
                    if (cmd.y1 !== undefined) cmd.y1 = layer.yMm + (baselineYMm + cmd.y1) * stretchY;
                    if (cmd.x2 !== undefined) cmd.x2 = boxLeftMm + (cursorXMm + cmd.x2) * stretchX;
                    if (cmd.y2 !== undefined) cmd.y2 = layer.yMm + (baselineYMm + cmd.y2) * stretchY;
                  });
                  drawOpenTypePathToPdf(doc, rawPath, textRgb);

                  // 粗体字重模拟微加粗描边保持粗细视觉一致
                  if (Number(layer.fontWeight) >= 700) {
                    doc.setDrawColor(textRgb.r, textRgb.g, textRgb.b);
                    doc.setLineWidth(layer.fontSizeMm * 0.032);
                    doc.stroke();
                  }

                  cursorXMm += charWidthsMm[cIdx] + (layer.letterSpacingMm || 0);
                });
              });
            } else {
              // 离线无网络兜底：以 1200 DPI 超高清单图层透明通道输出
              const hiScale = 1200 / MM_PER_INCH;
              const tmpW = Math.max(4, Math.ceil(targetWMm * hiScale) + 8);
              const tmpH = Math.max(4, Math.ceil(targetHMm * hiScale) + 8);
              const tCanvas = document.createElement('canvas');
              tCanvas.width = tmpW;
              tCanvas.height = tmpH;
              const tCtx = tCanvas.getContext('2d');
              const fontSizePx = layer.fontSizeMm * hiScale;
              const letterSpPx = (layer.letterSpacingMm || 0) * hiScale;
              const lineHPx = fontSizePx * (layer.lineHeightRatio || 1.2);
              tCtx.font = `${layer.fontWeight} ${fontSizePx}px ${fontStack}`;
              tCtx.fillStyle = layer.color;
              tCtx.textBaseline = 'top';
              if (layer.constrainBox) tCtx.scale(stretchX, stretchY);
              lines.forEach((line, idx) => {
                let cx = 0;
                const chars = Array.from(line);
                const lw = chars.reduce((acc, ch, i) => acc + tCtx.measureText(ch).width + (i < chars.length - 1 ? letterSpPx : 0), 0);
                if (anchor === 'center') cx = (natDims.widthMm * hiScale - lw) / 2;
                else if (anchor === 'right') cx = natDims.widthMm * hiScale - lw;
                chars.forEach(ch => {
                  tCtx.fillText(ch, cx, idx * lineHPx);
                  cx += tCtx.measureText(ch).width + letterSpPx;
                });
              });
              doc.addImage(tCanvas.toDataURL('image/png'), 'PNG', boxLeftMm, layer.yMm, tmpW / hiScale, tmpH / hiScale, undefined, 'NONE');
            }
          }
        }
      }

      const pdfBlob = doc.output('blob');
      triggerDownload(pdfBlob, `${projectName}.pdf`);
    }

    async function exportBatch(format) {
      const totalPages = getTotalVariablePages();
      const projectName = sanitizeFilename(state.projectName);
      // 600 DPI 超高清物理像素输出（150×100mm 对应 3543×2362px，放大依然极其锐利）
      const exportDpiMultiplier = 2;
      const physW = Math.max(1, Math.round(mmToPx(state.canvasWidthMm) * exportDpiMultiplier));
      const physH = Math.max(1, Math.round(mmToPx(state.canvasHeightMm) * exportDpiMultiplier));

      const modal = document.getElementById('exportModal');
      const titleEl = document.getElementById('exportModalTitle');
      const descEl = document.getElementById('exportModalDesc');
      const barEl = document.getElementById('exportProgressBar');
      const pctEl = document.getElementById('exportProgressPercent');
      const resInfoEl = document.getElementById('exportResolutionInfo');

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      barEl.style.width = '0%';
      pctEl.textContent = '0%';

      try {
        if (format === 'pdf') {
          titleEl.textContent = `正在生成真矢量多页 PDF (${totalPages} 页)...`;
          if (resInfoEl) resInfoEl.textContent = `${state.canvasWidthMm} × ${state.canvasHeightMm} mm · 原生真矢量曲线输出`;
          descEl.textContent = `正在初始化矢量轮廓引擎...`;

          await exportDirectVectorPdf(totalPages, projectName, (cur, tot) => {
            descEl.textContent = `正在写入第 ${cur} / ${tot} 页真矢量图形与文字轮廓...`;
            const pct = Math.round(((cur - 1) / tot) * 92);
            barEl.style.width = `${pct}%`;
            pctEl.textContent = `${pct}%`;
          });

          barEl.style.width = '100%';
          pctEl.textContent = '100%';
          showToast(`成功导出真矢量 PDF：${projectName}.pdf（共 ${totalPages} 页）`, 'success');
          return;
        }

        titleEl.textContent = `正在导出 600 PPI 超清 ${format.toUpperCase()} (${totalPages} 张)...`;
        if (resInfoEl) resInfoEl.textContent = `${physW} × ${physH} px · 超高清无损输出`;

        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = physW;
        offscreenCanvas.height = physH;
        const ctx = offscreenCanvas.getContext('2d', { alpha: format === 'png' });

        const zip = new JSZip();
        const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
        const quality = format === 'jpg' ? 1.0 : undefined;

        for (let page = 1; page <= totalPages; page++) {
          descEl.textContent = `正在渲染第 ${page} / ${totalPages} 张 (${physW} × ${physH} px)...`;
          const progress = Math.round(((page - 1) / totalPages) * 90);
          barEl.style.width = `${progress}%`;
          pctEl.textContent = `${progress}%`;

          await new Promise(r => setTimeout(r, 10));

          renderDocumentToContext(ctx, physW, physH, page, false);

          const blob = await new Promise(resolve => offscreenCanvas.toBlob(resolve, mimeType, quality));
          const seqStr = padSequence(page, totalPages);
          zip.file(`${projectName}_${seqStr}.${format}`, blob);
        }

        descEl.textContent = `正在打包生成 ${projectName}.zip...`;
        barEl.style.width = '95%';
        pctEl.textContent = '95%';

        const zipBlob = await zip.generateAsync({ type: 'blob' });
        triggerDownload(zipBlob, `${projectName}.zip`);

        barEl.style.width = '100%';
        pctEl.textContent = '100%';
        showToast(`成功导出 ${projectName}.zip（${physW}×${physH}px 超清 ${format.toUpperCase()}）`, 'success');
      } catch (err) {
        console.error('导出失败:', err);
        showToast('导出过程中发生异常，请检查图片或画布尺寸', 'error');
      } finally {
        setTimeout(() => {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }, 400);
      }
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
